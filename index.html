<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- ステータスバーの裏までページを広げる設定（black-translucent＋viewport-fit=cover）にすると、ホーム画面アプリで
     iPhoneが報告する画面の高さが実際より短くなり、画面の下に余白が出ることがあるため、ページはステータスバーの下から始める -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="拼音帮手">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3b3833">
<title>拼音帮手</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== 入力ページ（土台の画面。ほかのページはこの上に全画面で重ねて表示する） ===== -->
  <!-- ほかのページと同じく、画面全体に固定した不透明の入れ物に入れる。
       これが無いとiOS 26のSafariが画面上端にぼかしをかけ、ヘッダーの文字やボタンの上半分がぼけてしまう -->
  <div id="inputScreen">
  <!-- 上部（ヘッダーなど）は内容の上に重ねて表示する。後ろをスクロールする内容がすりガラス越しに透ける -->
  <div class="pageTop">
    <header id="topHeader" class="pageHeader">
      <span class="pageTitle">入力</span>
      <div class="displayToggles"></div>
    </header>

    <div id="fileBar">
      <div id="titleWrap">
        <span id="fileTitle"></span>
        <button id="renameBtn" class="iconBtn" type="button" aria-label="タイトルを編集" title="タイトルを編集">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
        </button>
      </div>
      <!-- 元に戻す（iOSのメモと同じく、入力欄の中ではなく上部のボタン列に置く） -->
      <button id="undoBtn" class="pillGroup pillGroupBtn" type="button" aria-label="元に戻す" title="元に戻す" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a7 7 0 1 1 2 4.9"></path><polyline points="3 4 3 10 9 10"></polyline></svg>
      </button>
      <button id="newBtn" class="pillGroup pillGroupBtn" type="button" title="新規作成">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg><span>新規</span>
      </button>
      <button id="saveBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        保存
      </button>
    </div>

    <div id="inputWrap">
      <!-- 取っ手は入力欄の右下に貼り付けるので、入力欄と一緒に包んで右端を揃える -->
      <div id="inputField">
        <textarea id="zhInput" lang="zh-CN" rows="1" placeholder="ここに入力／貼り付け" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
        <button id="focusToggle" type="button" aria-pressed="false" title="入力欄を畳んで広く表示">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 11 12 6 7 11"></polyline><polyline points="17 18 12 13 7 18"></polyline></svg>
        </button>
      </div>
      <!-- 入力中だけ右に出る「すべて消す」ボタン（単語帳・全漢字の入力バーと同じ動き） -->
      <button id="clearBtn" class="fieldClearBtn" type="button" aria-label="入力をすべて消す" title="入力をすべて消す" tabindex="-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
      </button>
    </div>

  </div>

  <main>
    <div id="results">
      <div class="emptyState"></div>
    </div>
  </main>
  </div>

  <!-- ===== フッターのタブバー（画面下に浮かぶすりガラスのカプセル） ===== -->
  <nav id="tabBar" aria-label="ページ切り替え">
    <span id="tabIndicator" aria-hidden="true"></span>
    <button class="tabItem" type="button" data-tab="input">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
      <span>入力</span>
    </button>
    <button class="tabItem" type="button" data-tab="list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="14" y2="18"></line></svg>
      <span>保存一覧</span>
    </button>
    <button class="tabItem" type="button" data-tab="wordbook">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
      <span>単語帳</span>
    </button>
    <button class="tabItem" type="button" data-tab="allKanji">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"></rect><rect x="13" y="3" width="8" height="8" rx="1.5"></rect><rect x="3" y="13" width="8" height="8" rx="1.5"></rect><rect x="13" y="13" width="8" height="8" rx="1.5"></rect></svg>
      <span>全漢字</span>
    </button>
  </nav>

  <div id="wordSheet">
    <div id="wordSheetList"></div>
  </div>

  <div id="saveModal" class="modalOverlay" hidden>
    <div class="modalCard">
      <div class="modalTitle" id="modalHeading">保存</div>
      <div class="modalLabel">タイトル（任意）</div>
      <div class="modalInputWrap">
        <input id="modalTitleInput" class="modalInput" type="text" autocomplete="off" />
        <button id="modalClearBtn" class="modalClearBtn" type="button" title="クリア" aria-label="クリア">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
        </button>
      </div>
      <div class="modalHint">空欄のときは、冒頭の文字から自動でタイトルがつきます</div>
      <div class="modalActions">
        <button id="modalCancelBtn" class="modalBtnGhost" type="button">キャンセル</button>
        <button id="modalSaveBtn" class="modalBtnPrimary" type="button">保存する</button>
      </div>
    </div>
  </div>

  <!-- ===== 保存一覧ページ ===== -->
  <div id="listScreen" class="pageScreen" hidden>
    <div class="pageTop">
      <header class="pageHeader">
        <span class="pageTitle">保存一覧</span>
        <div class="headerActions">
          <div class="pillGroup">
            <button id="exportBtn" class="pillGroupBtn" type="button" title="バックアップを書き出す（JSONファイル）">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><polyline points="7 10 12 15 17 10"></polyline><path d="M4 19h16"></path></svg><span>書き出し</span>
            </button>
            <button id="importBtn" class="pillGroupBtn" type="button" title="バックアップを読み込む（JSONファイル）">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"></path><polyline points="7 8 12 3 17 8"></polyline><path d="M4 19h16"></path></svg><span>読み込み</span>
            </button>
          </div>
          <input id="importFileInput" type="file" accept="application/json,.json" hidden>
        </div>
      </header>
    </div>
    <div id="listRows"></div>
  </div>

  <!-- ===== 単語帳ページ ===== -->
  <div id="wordbookScreen" class="pageScreen" hidden>
    <div class="pageTop">
      <header class="pageHeader">
        <div class="pageTitleWrap">
          <span class="pageTitle">単語帳</span>
          <span id="wordSelectCount"></span>
        </div>
        <div class="headerActions">
          <button id="wordSelectToggleBtn" class="textBtn" type="button" aria-pressed="false">選択</button>
          <!-- 選択モードの間だけ、表示切り替えの代わりにこの3つを出す -->
          <button id="wordMarkPersonBtn" class="iconBtn" type="button" aria-label="人名として登録" title="人名として登録" hidden disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
          </button>
          <button id="wordUnmarkPersonBtn" class="iconBtn" type="button" aria-label="人名登録を解除" title="人名登録を解除" hidden disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="23" y1="11" x2="17" y2="11"></line></svg>
          </button>
          <button id="wordDeleteBtn" class="pillGroup pillGroupBtn dangerPill" type="button" title="選択した単語を削除" hidden disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg><span>削除</span>
          </button>
          <div class="displayToggles"></div>
        </div>
      </header>
      <div id="wordSortBar" class="segmented">
        <span class="segThumb" aria-hidden="true"></span>
        <button class="wordSortBtn" type="button" data-sort="registered">登録順</button>
        <button class="wordSortBtn" type="button" data-sort="pinyin">ピンイン順</button>
        <button class="wordSortBtn" type="button" data-sort="tone">声調順</button>
      </div>
      <div id="wordAddBar" class="searchRow">
        <input id="wordAddInput" class="pillField" type="text" placeholder="単語を入力してEnterで登録（4文字まで）" maxlength="12" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" />
          <!-- 入力中だけ右に出る「すべて消す」ボタン（iOSの検索バーと同じ動き） -->
          <button id="wordAddClearBtn" class="fieldClearBtn" type="button" aria-label="入力をすべて消す" title="入力をすべて消す" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
          </button>
      </div>
    </div>
    <div id="wordbookBody">
      <div id="wordGrid"></div>
      <div id="wordbookIndex" hidden></div>
    </div>
    <!-- 登録順のときだけ出す「一番上に戻る」ボタン（右端の目次が無いので代わりに使う） -->
    <button id="wordScrollTopBtn" class="floatRoundBtn" type="button" aria-label="一番上に戻る" title="一番上に戻る" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="6 11 12 5 18 11"></polyline></svg>
    </button>
  </div>

  <!-- ===== 全漢字ページ ===== -->
  <div id="allKanjiScreen" class="pageScreen" hidden>
    <div class="pageTop">
      <header class="pageHeader">
        <span class="pageTitle">全漢字</span>
        <div class="displayToggles"></div>
      </header>
      <div id="allKanjiAddBar" class="searchRow">
        <input id="allKanjiAddInput" class="pillField" type="text" placeholder="文字を入力してEnterで漢字を登録" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" />
          <!-- 入力中だけ右に出る「すべて消す」ボタン（iOSの検索バーと同じ動き） -->
          <button id="allKanjiAddClearBtn" class="fieldClearBtn" type="button" aria-label="入力をすべて消す" title="入力をすべて消す" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
          </button>
      </div>
    </div>
    <div id="allKanjiBody">
      <div id="allKanjiGrid"></div>
      <div id="allKanjiIndex"></div>
    </div>
  </div>

  <div id="folderPicker" class="modalOverlay" hidden>
    <div class="modalCard">
      <div class="modalTitle">フォルダへ移動</div>
      <div id="folderPickerList"></div>
      <div class="modalActions">
        <button id="folderPickerCancel" class="modalBtnGhost" type="button">キャンセル</button>
      </div>
    </div>
  </div>

  <div id="nameModal" class="modalOverlay" hidden>
    <div class="modalCard">
      <div class="modalTitle" id="nameModalHeading">フォルダ名</div>
      <div class="modalInputWrap">
        <input id="nameModalInput" class="modalInput" type="text" autocomplete="off" maxlength="30" />
        <button id="nameModalClearBtn" class="modalClearBtn" type="button" title="クリア" aria-label="クリア">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
        </button>
      </div>
      <div class="modalActions">
        <button id="nameModalCancel" class="modalBtnGhost" type="button">キャンセル</button>
        <button id="nameModalOk" class="modalBtnPrimary" type="button">OK</button>
      </div>
    </div>
  </div>

  <div id="surume"><img src="images/surume.png" alt=""></div>

<!-- 漢字→ピンイン変換ライブラリ pinyin-pro（配布版をそのまま置いている） -->
<script src="vendor/pinyin-pro.min.js"></script>
<!-- 辞書データ（アプリ本体から定数として参照する） -->
<script src="data/kanji-map.js"></script>
<script src="data/char-freq.js"></script>
<script src="data/custom-words.js"></script>
<script src="data/ja-glyphs.js"></script>
<!-- アプリ本体（この順に読み込む。後のファイルは前のファイルの関数・変数を使う） -->
<script src="js/core.js"></script>
<script src="js/input-page.js"></script>
<script src="js/list-page.js"></script>
<script src="js/wordbook-page.js"></script>
<script src="js/all-kanji-page.js"></script>
<script src="js/app.js"></script>
</body>
</html>
