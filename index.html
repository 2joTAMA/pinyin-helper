<title>拼音帮手</title>
<style>
  :root{
    --ink:#32302b;
    --ink-soft:#3b3833;
    --paper:#d9d0bd;
    --paper-dim:#93897a;
    --input-bg:#c7bda7;
    --input-bg-dim:#b6ac93;
    --input-text:#2a2620;
    --seal:#c9704f;
    --seal-soft:#7a4433;
    --seal-dim:#573322;
    --line:#4a463e;
    --warn:#e2574c;
    --ja-accent:#93d1f2;
    --ja-accent-dim:#7e93a1;
    --footer-h:48px;
    /* 以下2つは起動時にJS(syncFooterOffsets)が実測値で上書きする。ここでの値は読み込み直後の暫定値 */
    --toolfooter-h:48px;
    --footer-total-h:96px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  [hidden]{ display:none !important; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--ink);
    color:var(--paper);
    font-family:"Hiragino Sans","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  }
  body{
    display:flex; flex-direction:column;
    height:100dvh;
    overflow:hidden;
    position:relative;
    isolation:isolate;
  }
  button{ font:inherit; -webkit-appearance:none; appearance:none; cursor:pointer; }

  /* ---------- header ---------- */
  #topHeader{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    gap:8px;
    padding:8px 10px;
    padding-top:calc(8px + env(safe-area-inset-top));
    border-bottom:1px solid var(--line);
    background:var(--ink-soft);
  }
  .brand{ font-size:14px; font-weight:600; letter-spacing:1px; color:var(--paper-dim); }
  .iconBtn{
    display:flex; align-items:center; justify-content:center;
    width:36px; height:36px;
    background:transparent; border:none;
    color:var(--paper-dim);
    padding:0; flex:0 0 auto;
    border-radius:999px;
  }
  .iconBtn:active{ background:rgba(217,208,189,0.12); }
  .iconBtn svg{ width:20px; height:20px; display:block; }
  #titleWrap{
    flex:1 1 auto; min-width:0;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  #fileTitle{
    font-size:14px; font-weight:600; color:var(--paper);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:100%;
  }
  #renameBtn{ width:24px; height:24px; flex:0 0 auto; }
  #renameBtn svg{ width:13px; height:13px; }
  #saveBtn{
    display:flex; align-items:center; gap:5px;
    background:transparent;
    border:1px solid var(--seal-soft);
    color:var(--paper-dim);
    padding:5px 11px;
    border-radius:999px;
    font-size:12px;
    line-height:1;
    white-space:nowrap;
    flex:0 0 auto;
    transition:background .2s, color .2s, border-color .2s;
  }
  #saveBtn:active{ background:var(--seal-soft); color:var(--paper); }
  #saveBtn svg{ width:12px; height:12px; display:block; }
  #saveBtn.justSaved{ background:var(--seal); border-color:var(--seal); color:var(--ink); }
  #saveBtn.dirty{ background:var(--warn); border-color:var(--warn); color:var(--ink); }

  /* ---------- auto-title sub header ---------- */
  #subHeader{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    padding:4px 12px;
    background:rgba(201,112,79,0.09);
    border-bottom:1px solid var(--line);
  }
  #autoTitleText{
    font-size:12px; font-weight:600; color:var(--seal);
    letter-spacing:0.3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:100%;
  }

  /* ---------- mode bar ---------- */
  #modeBar{
    flex:0 0 auto;
    display:flex; align-items:center;
    padding:0 12px;
    border-bottom:1px solid var(--line);
    background:var(--ink-soft);
  }
  .tabs{ display:flex; gap:18px; flex:1 1 auto; }
  .tabBtn{
    background:none; border:none;
    padding:10px 2px;
    font-size:13px; font-weight:600;
    color:var(--paper-dim);
    border-bottom:2px solid transparent;
  }
  .tabBtn.active{ color:var(--paper); border-bottom-color:var(--seal); }

  /* ---------- footer 1: 入力／単語帳／全漢字 切り替え（メニューを開くと隠れて非アクティブになる、単語帳・全漢字画面では隠れない） ----------
     bottom は JS(syncFooterOffsets)がフッター2の実測の高さを入れて、常にフッター2の真上に重なるようにする */
  #modeFooter{
    position:fixed; left:0; right:0; bottom:var(--toolfooter-h);
    z-index:55;
    display:flex;
    border-top:1px solid var(--line);
  }
  #modeFooter button{
    flex:1 1 0;
    height:var(--footer-h);
    display:flex; align-items:center; justify-content:center; gap:6px;
    border:none;
    font-size:14px; font-weight:700;
  }
  #modeFooter button svg{ width:16px; height:16px; display:block; }
  #modeFooterInputBtn{ background:var(--paper); color:var(--input-text); }
  #modeFooterInputBtn:active{ background:var(--input-bg-dim); }
  #modeFooterWordbookBtn{ background:var(--seal); color:var(--ink); }
  #modeFooterWordbookBtn:active{ background:var(--seal-soft); color:var(--paper); }
  #modeFooterAllKanjiBtn{ background:var(--paper-dim); color:var(--ink); }
  #modeFooterAllKanjiBtn:active{ background:var(--input-bg-dim); }

  /* ---------- footer 2: 声調123／声調記号／日本字体（画面最下部の安全余白を使い、メニューを開いても・単語帳画面でも隠れない） ---------- */
  #toolFooter{
    position:fixed; left:0; right:0; bottom:0;
    z-index:95;
    display:flex;
    background:var(--ink-soft);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  #toolFooter button{
    flex:1 1 33.333%;
    height:var(--footer-h);
    display:flex; align-items:center; justify-content:center; gap:4px;
    background:none; border:none;
    color:var(--paper-dim);
    font-size:15px; font-weight:700; letter-spacing:0.3px;
  }
  #toolFooter button + button{ border-left:1px solid var(--line); }
  #toolFooter button svg{ width:18px; height:18px; display:block; }
  #toneToggle.active{ background:var(--seal); color:var(--ink); }
  #contourToggle.active{ background:var(--seal); color:var(--ink); }
  #jaKanjiToggle.active{ background:var(--ja-accent); color:var(--ink); }

  /* ---------- input ---------- */
  #inputWrap{
    flex:0 0 auto;
    padding:8px 10px;
    border-bottom:1px solid var(--line);
    background:var(--ink-soft);
    position:relative;
    overflow:visible;
    transition:padding .25s ease, height .25s ease, background-color .25s ease;
  }
  /* 畳んだときは入力欄がぺちゃんこになったイメージで、横幅いっぱいの薄い帯（入力欄と同じ色）だけを残す */
  body.focusMode #inputWrap{
    padding:0;
    height:5px;
    background:var(--input-bg);
    border-bottom-color:transparent;
  }
  #zhInput{
    width:100%;
    min-height:40px;
    max-height:22vh;
    resize:none;
    background:var(--input-bg);
    color:var(--input-text);
    border:none;
    border-radius:8px 8px 0 8px;
    padding:9px 60px 9px 11px;
    font-size:17px;
    line-height:1.4;
    font-family:"Hiragino Sans","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    display:block;
    overflow-y:auto;
    transition:max-height .25s ease, min-height .25s ease, opacity .2s ease, padding .25s ease;
  }
  #zhInput:focus{ outline:2px solid var(--seal); outline-offset:1px; }
  body.focusMode #zhInput{
    max-height:0; min-height:0;
    padding-top:0; padding-bottom:0;
    opacity:0;
    overflow:hidden;
    pointer-events:none;
  }
  .inputTools{
    position:absolute; top:16px; right:16px; display:flex; gap:6px;
    transition:opacity .2s ease;
  }
  body.focusMode .inputTools{ opacity:0; pointer-events:none; }
  /* 入力欄の下端にぴったり貼り付いた取っ手。右端は入力欄の右端に揃え、角丸側（入力欄の右下）は0にして噛み合わせる */
  #focusToggle{
    position:absolute; right:10px; bottom:-12px; z-index:3;
    display:flex; align-items:center; justify-content:center;
    width:44px; height:20px;
    padding:0;
    border:none;
    border-top:1px solid var(--line);
    border-radius:0 0 10px 10px;
    background:var(--input-bg-dim);
    color:var(--input-text);
    box-shadow:0 3px 5px rgba(0,0,0,0.35);
    transition:bottom .25s ease;
  }
  #focusToggle svg{ width:13px; height:13px; display:block; transition:transform .2s ease; }
  #focusToggle.active svg{ transform:rotate(180deg); }
  /* 畳んだ帯（高さ5px）から完全にぶら下がるよう、帯の下端に揃える */
  body.focusMode #focusToggle{ bottom:-20px; }
  .miniBtn{
    width:22px; height:22px; border-radius:999px;
    background:rgba(42,38,32,0.18);
    border:none;
    display:flex; align-items:center; justify-content:center;
    color:var(--input-text);
    padding:0;
  }
  .miniBtn[disabled]{ opacity:0.35; }
  .miniBtn svg{ width:12px; height:12px; display:block; }
  #clearBtn{ visibility:hidden; }
  #clearBtn.show{ visibility:visible; }

  /* ---------- kanji-mode toolbar ---------- */
  #kanjiToolbar{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px;
    gap:10px;
    max-height:80px;
    overflow:hidden;
    transition:max-height .25s ease, opacity .2s ease, padding .25s ease;
  }
  body.focusMode #kanjiToolbar{
    max-height:0;
    padding-top:0; padding-bottom:0;
    opacity:0;
    pointer-events:none;
  }
  #kanjiActions{ display:flex; align-items:center; gap:10px; flex:1 1 auto; min-width:0; }
  .pillBtn{
    display:flex; align-items:center; gap:6px;
    background:transparent; color:var(--paper-dim);
    border:1px solid var(--line);
    padding:8px 14px; border-radius:999px;
    font-size:13px; font-weight:600;
    white-space:nowrap;
  }
  .pillBtn[disabled]{ opacity:0.4; }
  .pillBtn svg{ width:14px; height:14px; }
  #groupBtn{ background:var(--seal); color:var(--ink); border:none; font-weight:700; }
  #groupBtn[disabled]{ background:var(--seal-soft); color:var(--paper-dim); }
  #reorderBtn{ color:var(--seal); border-color:var(--seal); font-weight:700; }
  #orderHint{ font-size:11px; color:var(--paper-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #reorderActions{ display:none; align-items:center; justify-content:space-between; width:100%; }
  #reorderActions .reorderLabel{ font-size:13px; font-weight:700; color:var(--seal); white-space:nowrap; }
  #doneBtn{
    display:flex; align-items:center; gap:5px;
    background:var(--seal); color:var(--ink); border:none;
    padding:7px 14px; border-radius:999px;
    font-size:12px; font-weight:700; white-space:nowrap;
  }
  #doneBtn svg{ width:12px; height:12px; }

  body.reordering #topHeader,
  body.reordering #subHeader,
  body.reordering #modeBar,
  body.reordering #inputWrap{

    touch-action:none;

  }

  main{
    flex:1 1 auto;

  }

  #results{
    flex:1 1 auto;

  }
  .lineBlock{
    padding:10px 0;
    border-bottom:1px dashed var(--line);
  }
  .lineBlock:last-child{ border-bottom:none; }
  .zhLine{

    line-height:1.45;
    color:var(--paper);
    word-break:break-word;

  .pyLine{
    margin-top:5px;

  /* ---------- 声調カーブ表示（アルファベット非表示モード） ---------- */
  .contourRow{ display:flex; flex-wrap:wrap; align-items:flex-start; }
  .cCol{ display:inline-flex; flex-direction:column; align-items:center; }
  .cChar{
    font-size:23px;
    line-height:1.45;
    color:var(--paper);
  }
  .cTone{ width:19px; height:13px; margin-top:2px; }
  .cTone svg{ width:100%; height:100%; display:block; color:var(--seal); }

  /* ---------- kanji grid (単漢字モード) ---------- */
  #kanjiGrid{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:6px 16px 16px;
  }
  .kgroup + .kgroup{ margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); }
  .kgroupLabel{
    display:flex; align-items:center; gap:5px;
    font-size:16px; font-weight:700; color:var(--seal);
    letter-spacing:0.3px; margin-bottom:6px;
  }
  .kgroupWarnIcon{ width:14px; height:14px; color:var(--warn); flex:0 0 auto; }
  .kgroupRow{ display:flex; flex-wrap:wrap; gap:3px; }
  .kcard{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    padding:3px 4px;
    border-radius:8px;
    transition:background-color .15s ease;
  }
  .kcard.wordActive{ background:var(--seal-soft); }
  .khz{ font-size:27px; line-height:1; color:var(--paper); }
  .khz.mismatch{ color:var(--warn); }

  /* ---------- 日本漢字表示モードで、元の簡体字と実際に字形が変わった文字だけ色を付ける ---------- */
  .jaChanged{ color:var(--ja-accent); }
  .khz.mismatch .jaChanged{ color:var(--warn); }
  .ktone{
    position:absolute; top:-1px; right:-1px;
    font-size:9px; font-weight:700; line-height:1;
    color:var(--seal);
  }
  .kcard.contourOn{ flex-direction:column; gap:1px; }
  .kcontour{ width:22px; height:15px; }
  .kcontour svg{ width:100%; height:100%; display:block; color:var(--seal); }
  .kcard.dragging{
    position:fixed; z-index:80;
    background:var(--ink-soft); border:1px solid var(--seal); border-radius:8px;
    box-shadow:0 10px 22px rgba(0,0,0,0.45);
    transform:rotate(-4deg);
  }
  .kcardPlaceholder{ width:34px; height:34px; border:2px dashed var(--seal-soft); border-radius:8px; opacity:0.5; }

  /* ---------- 単漢字タップ時の単語シート ---------- */
  #wordSheet{
    position:fixed; left:0; right:0;
    bottom:var(--footer-total-h);
    z-index:70;
    background:var(--ink-soft);
    border-top:1px solid var(--line);
    border-radius:14px 14px 0 0;
    box-shadow:0 -8px 24px rgba(0,0,0,0.4);
    max-height:45vh;
    display:flex; flex-direction:column;
    /* bottomをfooter分だけ底上げしているので、100%移動だけでは画面外まで届かない。
       その分(--footer-total-h)を余計に動かして確実に隠す */
    transform:translateY(calc(100% + var(--footer-total-h)));
    transition:transform .22s ease;
    pointer-events:none;
  }
  #wordSheet.open{ transform:translateY(0); pointer-events:auto; }
  /* タップした漢字が画面下半分にあるときは、隠れないよう上から出す */
  #wordSheet.fromTop{
    top:0; bottom:auto;
    border-radius:0 0 14px 14px;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
    padding-bottom:0;
    padding-top:env(safe-area-inset-top);
    transform:translateY(-100%);
  }
  #wordSheet.fromTop.open{ transform:translateY(0); }
  #wordSheet.fromTop .wordSheetHandle{ order:2; }
  #wordSheet.fromTop #wordSheetList{ order:1; }
  .wordSheetHandle{
    width:36px; height:4px; border-radius:999px;
    background:var(--line);
    margin:8px auto 4px;
    flex:0 0 auto;
  }
  #wordSheetList{
    overflow-y:auto;
    padding:4px 18px 16px;
    display:flex; flex-direction:column; gap:12px;
  }
  .wordSheetItem{ display:flex; align-items:baseline; gap:12px; }
  .wordSheetHz{ font-size:22px; font-weight:700; color:var(--paper); letter-spacing:1px; }
  .wordSheetPy{ font-size:19px; font-weight:600; color:var(--seal); letter-spacing:0.2px; }
  .wordSheetItem .contourRow{ align-items:flex-end; }
  .wordSheetItem .cChar{ font-size:22px; font-weight:700; }
  .wordSheetItem .cTone{ width:19px; height:13px; }

  /* ---------- save modal ---------- */
  .modalOverlay{
    position:fixed; inset:0; z-index:100;
    background:rgba(0,0,0,0.55);
    display:flex; align-items:center; justify-content:center;
    padding:0 28px;
  }
  .modalCard{
    width:100%; max-width:340px;
    background:var(--ink-soft); border:1px solid var(--line); border-radius:14px;
    padding:20px 18px;
    box-shadow:0 18px 40px rgba(0,0,0,0.5);
  }
  .modalTitle{ font-size:16px; font-weight:700; color:var(--paper); margin-bottom:14px; }
  .modalLabel{ font-size:12px; color:var(--paper-dim); margin-bottom:6px; }
  .modalInputWrap{ position:relative; }
  .modalInput{
    width:100%; background:var(--input-bg); color:var(--input-text);
    border:none; border-radius:8px; padding:10px 34px 10px 12px;
    font-size:15px; margin-bottom:6px;
    font-family:inherit;
  }
  .modalInput:focus{ outline:2px solid var(--seal); }
  .modalClearBtn{
    position:absolute; top:0; bottom:6px; right:8px;
    margin:auto 0;
    width:22px; height:22px; border-radius:999px;
    background:rgba(42,38,32,0.18);
    border:none;
    display:flex; align-items:center; justify-content:center;
    color:var(--input-text);
    padding:0;
    visibility:hidden;
  }
  .modalClearBtn.show{ visibility:visible; }
  .modalClearBtn svg{ width:12px; height:12px; display:block; }
  .modalHint{ font-size:11px; color:var(--paper-dim); margin-bottom:20px; }
  .modalActions{ display:flex; gap:10px; justify-content:flex-end; }
  .modalBtnGhost{ background:transparent; border:none; color:var(--paper-dim); font-size:14px; padding:10px 12px; }
  .modalBtnPrimary{ background:var(--seal); color:var(--ink); border:none; border-radius:8px; font-size:14px; font-weight:700; padding:10px 18px; }

  /* ---------- saved list：左からスワイプインするメニュー（本来の画面は入力モード側） ----------
     メニューを開いている間は一番上まで覆う。閉じる操作はメニュー自身のヘッダーの
     ハンバーガーアイコン（#listBackBtn）／背景タップ／本体ハンバーガー再タップで行う。 */
  #listBackdrop{
    position:fixed; inset:0; z-index:89;
    background:rgba(0,0,0,0.45);
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
  }
  #listBackdrop.open{ opacity:1; pointer-events:auto; }
  #listScreen{
    position:fixed; top:0; bottom:0; left:0;
    width:90%;
    z-index:90;
    background:var(--ink);
    display:flex; flex-direction:column;
    transform:translateX(-100%);
    transition:transform .25s ease;
    box-shadow:10px 0 28px rgba(0,0,0,0.4);
    pointer-events:none;
  }
  #listScreen.open{ transform:translateX(0); pointer-events:auto; }
  #listScreen header{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 12px;
    padding-top:calc(8px + env(safe-area-inset-top));
    border-bottom:1px solid var(--line);
    background:var(--ink-soft);
  }
  #listHeaderActions{ display:flex; align-items:center; gap:0; flex:0 0 auto; }
  #listRows{ flex:1 1 auto; overflow-y:auto; padding:2px 16px calc(16px + var(--toolfooter-h)); }
  .listEmpty{ padding:40px 8px; text-align:center; color:var(--paper-dim); font-size:13px; }
  .listRowWrap{ position:relative; overflow:hidden; border-bottom:1px dashed var(--line); }
  .listRowActions{ position:absolute; top:0; right:0; bottom:0; display:flex; }
  .rowActionBtn{
    width:64px; border:none; padding:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    font-size:10px; font-weight:700;
  }
  .rowActionBtn svg{ width:15px; height:15px; }
  .actMove{ background:var(--paper-dim); color:var(--ink); }
  .actDuplicate{ background:var(--seal-soft); color:var(--paper); }
  .actDelete{ background:var(--seal); color:var(--ink); }
  .listRow{
    position:relative; background:var(--ink);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 2px 12px 10px;
    border-left:3px solid transparent;
    touch-action:pan-y;
    -webkit-touch-callout:none;
    -webkit-user-select:none; user-select:none;
  }
  .listRow.current{ background:var(--seal-dim); border-left-color:var(--seal); }
  .listRow.current .listTitle{ color:var(--seal); }
  .listTitle{
    flex:1 1 auto; min-width:0; font-size:14px; font-weight:600; color:var(--paper);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .listTitleWrap{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .listTitleWrap .listTitle{ flex:0 0 auto; }
  .listSubtitle{
    font-size:11px; font-weight:500; color:var(--seal);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;
  }
  .listMeta{ flex:0 0 auto; display:flex; align-items:center; gap:8px; }
  .listEditBtn{
    display:flex; align-items:center; justify-content:center;
    width:24px; height:24px; flex:0 0 auto;
    border:none; background:none;
    color:var(--paper-dim);
    padding:0;
  }
  .listEditBtn svg{ width:13px; height:13px; display:block; }
  .listEditBtn:active{ color:var(--seal); }

  /* 長押しでファイル行を掴んで並び替え */
  .listRowWrap.armed .listRow{ transform:scale(0.97); transition:transform .12s ease; }
  .listRowWrap.rowDragging{
    position:fixed; z-index:85;
    border-bottom:none;
    box-shadow:0 12px 28px rgba(0,0,0,0.5);
  }
  .listRowWrap.rowDragging .listRow{
    border:1px solid var(--seal); border-radius:10px;
    background:var(--ink-soft);
  }
  .listRowWrap.rowDragging .listRowActions{ display:none; }
  .listRowPlaceholder{
    border:2px dashed var(--seal-soft); border-radius:10px;
    opacity:0.5; margin:4px 0;
  }
  #listRows.isDragging{ -webkit-user-select:none; user-select:none; }
  #listRows.isDragging .listRow{ touch-action:none; }

  /* ---------- 単語帳画面 ---------- */
  #wordbookScreen{
    position:fixed; inset:0; z-index:50;
    background:var(--ink);
    display:flex; flex-direction:column;
  }
  #wordbookScreen header{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 12px;
    padding-top:calc(8px + env(safe-area-inset-top));
    border-bottom:1px solid var(--line);
    background:var(--ink-soft);
  }
  #wordbookHeaderActions{ display:flex; align-items:center; gap:2px; flex:0 0 auto; }
  #wordSelectCount{ font-size:12px; color:var(--paper-dim); margin-right:2px; white-space:nowrap; }
  #wordSelectToggleBtn{ width:auto; height:auto; flex-direction:column; gap:1px; padding:6px 10px; flex:0 0 auto; }
  #wordSelectToggleBtn.active{ color:var(--seal); }
  .iconBtnLabel{ font-size:9px; font-weight:600; line-height:1; letter-spacing:0.2px; }
  #wordSortBar{
    flex:0 0 auto;
    display:flex; gap:6px;
    padding:10px 16px 0;
  }
  .wordSortBtn{
    flex:1 1 0;
    background:var(--ink-soft); color:var(--paper-dim);
    border:1px solid var(--line); border-radius:8px;
    padding:8px 4px;
    font-size:13px; font-weight:700; text-align:center;
  }
  .wordSortBtn.active{ background:var(--seal-soft); border-color:var(--seal); color:var(--paper); }
  .wordSortBtn:active{ background:var(--line); }
  #wordAddBar{
    flex:0 0 auto;
    display:flex; align-items:center; gap:8px;
    padding:10px 16px 6px;
  }
  #wordAddInput{
    flex:1 1 auto; min-width:0;
    background:var(--input-bg); color:var(--input-text);
    border:none; border-radius:10px; padding:11px 12px;
    font-size:15px; font-family:inherit;
  }
  #wordAddInput:focus{ outline:2px solid var(--seal); }
  #wordGrid{
    flex:1 1 auto; overflow-y:auto; overflow-x:hidden;
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px;
    padding:10px 16px calc(16px + var(--footer-total-h));
    align-content:start;
  }
  .wordChip{
    min-width:0;
    background:var(--ink-soft); border:1px solid var(--line); border-radius:10px;
    padding:7px 5px;
    display:flex; flex-direction:column; align-items:center; gap:1px;
    text-align:center;
    -webkit-user-select:none; user-select:none;
  }
  .wordChip.selected{ border-color:var(--seal); background:var(--seal-soft); }
  .wordChipHz{ font-size:20px; font-weight:600; color:var(--paper); letter-spacing:1px; }
  /* 声調123／記号表記を切り替えても縦幅が動かないよう高さを固定し、1行に収まる幅まで
     JS(fitWordChipPy)が自動で文字サイズを縮める。それでも収まらなければ省略記号で切る。
     min-width:0とoverflow:hiddenがないと、white-space:nowrapの中身の最小幅がグリッドの
     列幅を押し広げてしまい、画面全体が横スクロールしてしまうので必須。 */
  .wordChipPy{
    width:100%;
    min-width:0;
    height:24px;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:19px; font-weight:600; color:var(--seal); letter-spacing:0.2px;
  }
  .wordChip.selected .wordChipPy{ color:var(--paper); }
  .wordChipContourRow{ justify-content:center; row-gap:2px; }
  .wordChipContourRow .cChar{ font-size:20px; }
  .wordChipContourRow .cTone{ width:17px; height:12px; }

  /* ---------- 全漢字画面（登録した漢字を常にピンインごとにグループ表示） ---------- */
  #allKanjiScreen{
    position:fixed; inset:0; z-index:50;
    background:var(--ink);
    display:flex; flex-direction:column;
  }
  #allKanjiScreen header{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 12px;
    padding-top:calc(8px + env(safe-area-inset-top));
    border-bottom:1px solid var(--line);
    background:var(--ink-soft);
  }
  #allKanjiAddBar{
    flex:0 0 auto;
    padding:10px 16px 6px;
  }
  #allKanjiAddInput{
    width:100%; background:var(--input-bg); color:var(--input-text);
    border:none; border-radius:10px; padding:11px 12px;
    font-size:15px; font-family:inherit;
  }
  #allKanjiAddInput:focus{ outline:2px solid var(--seal); }
  #allKanjiGrid{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:6px 16px calc(16px + var(--footer-total-h));
  }
  /* 単語帳に登録単語が1つもない漢字＝タップしても何も起きないので、少し薄い色にして示す */
  .khz.noWord{ color:var(--paper-dim); }
  /* グレーの中でも少し青みを残し、日本字体に変換済みの字だけは区別できるようにする */
  .khz.noWord .jaChanged{ color:var(--ja-accent-dim); }

  /* ---------- saved list: search + folders ---------- */
  #listSearchBar{
    flex:0 0 auto;
    display:flex; align-items:center; gap:8px;
    margin:8px 16px 4px;
    padding:8px 10px;
    background:var(--input-bg);
    border-radius:8px;
    color:var(--input-text);
  }
  #listSearchBar > svg{ width:15px; height:15px; flex:0 0 auto; opacity:0.7; }
  #listSearchInput{
    flex:1 1 auto; min-width:0;
    background:transparent; border:none; outline:none;
    -webkit-appearance:none; appearance:none;
    color:var(--input-text);
    font-size:16px; font-family:inherit;
  }
  #listSearchInput::placeholder{ color:rgba(42,38,32,0.5); }
  #listSearchInput::-webkit-search-cancel-button{ -webkit-appearance:none; appearance:none; }
  #listSearchClear{
    flex:0 0 auto; width:20px; height:20px; border-radius:999px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(42,38,32,0.18); border:none; color:var(--input-text); padding:0;
  }
  #listSearchClear svg{ width:11px; height:11px; display:block; }

  .newFolderRow{
    display:flex; align-items:center; gap:8px; width:100%;
    background:transparent; border:none;
    padding:12px 2px;
    color:var(--seal); font-size:13px; font-weight:700;
    border-bottom:1px dashed var(--line);
  }
  .newFolderRow svg{ width:16px; height:16px; flex:0 0 auto; }
  .listSectionDivider{ height:10px; }

  .folderRow .listTitle{ display:flex; align-items:center; gap:8px; color:var(--paper); }
  .folderRow .listTitle svg{ width:17px; height:17px; color:var(--seal); flex:0 0 auto; }
  .folderRow .listTitle span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .folderCount{ font-size:11px; color:var(--paper-dim); min-width:14px; text-align:right; }
  .folderChevron svg{ width:15px; height:15px; color:var(--paper-dim); display:block; transition:transform .18s ease; }
  .listRowWrap.expanded .folderChevron svg{ transform:rotate(90deg); }

  /* ---------- フォルダの中身（アコーディオン展開） ---------- */
  .folderBody{
    padding-left:16px;
    border-left:1px solid var(--line);
    margin:0 0 4px 8px;
  }

  .listFolderChip{
    display:flex; align-items:center; gap:3px;
    font-size:10px; color:var(--paper-dim);
    max-width:96px;
  }
  .listFolderChip svg{ width:11px; height:11px; flex:0 0 auto; }
  .listFolderChip span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  #folderPickerList{ max-height:50vh; overflow-y:auto; margin-bottom:16px; }
  .folderPickItem{
    display:flex; align-items:center; gap:10px; width:100%;
    background:transparent; border:none;
    padding:12px 6px;
    color:var(--paper); font-size:14px; text-align:left;
    border-bottom:1px dashed var(--line);
  }
  .folderPickItem > svg{ width:16px; height:16px; color:var(--seal); flex:0 0 auto; }
  .folderPickItem > span{ flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .folderPickItem.active{ color:var(--seal); font-weight:700; }
  .folderPickItem.action{ color:var(--paper-dim); }
  .folderPickItem .pickCheck{ width:14px; height:14px; color:var(--seal); flex:0 0 auto; }

  #surume{
    position:fixed;
    top:32%;
    right:0;
    width:150px;
    pointer-events:none;
    z-index:-1;
    opacity:0.15;
    transform:translateY(-50%) translateX(100%);
  }
  #surume img{ width:100%; display:block; }
  #surume.visible{
    transform:translateY(-50%) translateX(40%) scale(1);
  }
  #surume.enter{
    animation:peekIn 0.85s cubic-bezier(.22,.85,.28,1.15) forwards;
  }
  #surume.leaving{
    animation:peekOut 0.95s ease-in-out forwards;
  }
  @keyframes peekIn{
    0%   { transform:translateY(-50%) translateX(100%) scale(0.85); }
    55%  { transform:translateY(-50%) translateX(32%) scale(1.07); }
    75%  { transform:translateY(-50%) translateX(46%) scale(0.97); }
    100% { transform:translateY(-50%) translateX(40%) scale(1); }
  }
  @keyframes peekOut{
    0%   { transform:translateY(-50%) translateX(40%) scale(1); }
    14%  { transform:translateY(-50%) translateX(33%) scale(1.05); }
    42%  { transform:translateY(-50%) translateX(36%) scale(1.02); }
    100% { transform:translateY(-50%) translateX(100%) scale(0.85); }
  }
</style>

<body>
  <header id="topHeader">
    <button id="listBtn" class="iconBtn" type="button" aria-label="保存一覧" title="保存一覧">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="14" y2="18"></line></svg>
    </button>
    <div id="titleWrap">
      <span id="fileTitle"></span>
      <button id="renameBtn" class="iconBtn" type="button" aria-label="サブタイトルを編集" title="サブタイトルを編集">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
      </button>
    </div>
    <button id="newBtn" class="iconBtn" type="button" aria-label="新規作成" title="新規作成">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
    <button id="saveBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
      保存
    </button>
  </header>

  <div id="subHeader">
    <span id="autoTitleText"></span>
  </div>

  <div id="modeBar">
    <div class="tabs">
      <button class="tabBtn active" data-mode="sentence" type="button">文章モード</button>
      <button class="tabBtn" data-mode="kanji" type="button">単漢字モード</button>
    </div>
  </div>

  <div id="inputWrap">
    <textarea id="zhInput" rows="1" placeholder="ここに入力／貼り付け" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
    <div class="inputTools">
      <button id="undoBtn" class="miniBtn" type="button" title="元に戻す" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a7 7 0 1 1 2 4.9"></path><polyline points="3 4 3 10 9 10"></polyline></svg>
      </button>
      <button id="clearBtn" class="miniBtn" type="button" title="クリア">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
      </button>
    </div>
    <button id="focusToggle" type="button" aria-pressed="false" title="入力欄を畳んで広く表示">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 11 12 6 7 11"></polyline><polyline points="17 18 12 13 7 18"></polyline></svg>
    </button>
  </div>

  <div id="kanjiToolbar" hidden>
    <div id="kanjiActions">
      <button id="groupBtn" class="pillBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"></rect><rect x="13" y="3" width="8" height="8" rx="1.5"></rect><rect x="3" y="13" width="8" height="8" rx="1.5"></rect><rect x="13" y="13" width="8" height="8" rx="1.5"></rect></svg>
        <span id="groupBtnLabel">グループ分け</span>
      </button>
      <button id="reorderBtn" class="pillBtn" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h13"></path><path d="M13 3l4 4-4 4"></path><path d="M21 17H8"></path><path d="M11 21l-4-4 4-4"></path></svg>
        並び替え
      </button>
      <span id="orderHint"></span>
    </div>
    <div id="reorderActions">
      <span class="reorderLabel">並び替え中</span>
      <button id="doneBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        完了
      </button>
    </div>
  </div>

  <main>
    <div id="results">
      <div class="emptyState"></div>
    </div>
    <div id="kanjiGrid" hidden></div>
  </main>

  <div id="modeFooter">
    <button id="modeFooterInputBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
      入力
    </button>
    <button id="modeFooterWordbookBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
      単語帳
    </button>
    <button id="modeFooterAllKanjiBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"></rect><rect x="13" y="3" width="8" height="8" rx="1.5"></rect><rect x="3" y="13" width="8" height="8" rx="1.5"></rect><rect x="13" y="13" width="8" height="8" rx="1.5"></rect></svg>
      全漢字
    </button>
  </div>

  <div id="toolFooter">
    <button id="toneToggle" type="button" aria-pressed="false" title="声調を数字でも表示">123</button>
    <button id="contourToggle" type="button" aria-pressed="false" title="声調を高低カーブの記号で表示（アルファベット非表示）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17 L9 7 L15 7 L20 17"></path></svg>
    </button>
    <button id="jaKanjiToggle" type="button" aria-pressed="false" title="漢字を日本の字体で表示（内部のデータは変わりません）">日</button>
  </div>

  <div id="wordSheet">
    <div class="wordSheetHandle"></div>
    <div id="wordSheetList"></div>
  </div>

  <div id="saveModal" class="modalOverlay" hidden>
    <div class="modalCard">
      <div class="modalTitle" id="modalHeading">保存</div>
      <div class="modalLabel">サブタイトル（任意）</div>
      <div class="modalInputWrap">
        <input id="modalTitleInput" class="modalInput" type="text" autocomplete="off" />
        <button id="modalClearBtn" class="modalClearBtn" type="button" title="クリア" aria-label="クリア">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
        </button>
      </div>
      <div class="modalHint">タイトルは内容から自動でつきます。空欄でも保存できます</div>
      <div class="modalActions">
        <button id="modalCancelBtn" class="modalBtnGhost" type="button">キャンセル</button>
        <button id="modalSaveBtn" class="modalBtnPrimary" type="button">保存する</button>
      </div>
    </div>
  </div>

  <div id="listBackdrop"></div>
  <div id="listScreen">
    <header>
      <button id="listBackBtn" class="iconBtn" type="button" aria-label="メニューを閉じる" title="メニューを閉じる">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="14" y2="18"></line></svg>
      </button>
      <span class="brand" id="listBrand">保存一覧</span>
      <div id="listHeaderActions">
        <button id="exportBtn" class="iconBtn" type="button" aria-label="バックアップを書き出す" title="バックアップを書き出す（JSONファイル）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><polyline points="7 10 12 15 17 10"></polyline><path d="M4 19h16"></path></svg>
        </button>
        <button id="importBtn" class="iconBtn" type="button" aria-label="バックアップを読み込む" title="バックアップを読み込む（JSONファイル）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"></path><polyline points="7 8 12 3 17 8"></polyline><path d="M4 19h16"></path></svg>
        </button>
        <input id="importFileInput" type="file" accept="application/json,.json" hidden>
        <button id="listNewBtn" class="iconBtn" type="button" aria-label="新規作成" title="新規作成">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </div>
    </header>
    <div id="listSearchBar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="listSearchInput" type="search" placeholder="タイトル・漢字で検索" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" />
      <button id="listSearchClear" type="button" aria-label="検索をクリア" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
      </button>
    </div>
    <div id="listRows"></div>
  </div>

  <div id="wordbookScreen" hidden>
    <header>
      <button id="wordbookMenuBtn" class="iconBtn" type="button" aria-label="保存一覧" title="保存一覧">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="14" y2="18"></line></svg>
      </button>
      <span class="brand">単語帳</span>
      <div id="wordbookHeaderActions">
        <span id="wordSelectCount"></span>
        <button id="wordDeleteBtn" class="iconBtn" type="button" aria-label="削除" title="削除" hidden disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
        </button>
      </div>
    </header>
    <div id="wordSortBar">
      <button class="wordSortBtn" type="button" data-sort="registered">登録順</button>
      <button class="wordSortBtn" type="button" data-sort="pinyin">ピンイン順</button>
      <button class="wordSortBtn" type="button" data-sort="tone">声調順</button>
    </div>
    <div id="wordAddBar">
      <input id="wordAddInput" type="text" placeholder="単語を入力してEnterで登録（4文字まで）" maxlength="12" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" />
      <button id="wordSelectToggleBtn" class="iconBtn" type="button" aria-label="選択" title="選択">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><polyline points="8 12 11 15 16 9"></polyline></svg>
        <span class="iconBtnLabel">選択</span>
      </button>
    </div>
    <div id="wordGrid"></div>
  </div>

  <div id="allKanjiScreen" hidden>
    <header>
      <button id="allKanjiMenuBtn" class="iconBtn" type="button" aria-label="保存一覧" title="保存一覧">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="14" y2="18"></line></svg>
      </button>
      <span class="brand">全漢字</span>
      <div class="iconBtn" aria-hidden="true"></div>
    </header>
    <div id="allKanjiAddBar">
      <input id="allKanjiAddInput" type="text" placeholder="文字を入力してEnterで漢字を登録" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" />
    </div>
    <div id="allKanjiGrid"></div>
  </div>

  <div id="folderPicker" class="modalOverlay" hidden>
    <div class="modalCard">
      <div class="modalTitle">フォルダへ移動</div>
      <div id="folderPickerList"></div>
      <div class="modalActions">
        <button id="folderPickerCancel" class="modalBtnGhost" type="button">キャンセル</button>
      </div>
    </div>
  </div>

  <div id="nameModal" class="modalOverlay" hidden>
    <div class="modalCard">
      <div class="modalTitle" id="nameModalHeading">フォルダ名</div>
      <input id="nameModalInput" class="modalInput" type="text" autocomplete="off" maxlength="30" />
      <div class="modalActions" style="margin-top:12px">
        <button id="nameModalCancel" class="modalBtnGhost" type="button">キャンセル</button>
        <button id="nameModalOk" class="modalBtnPrimary" type="button">OK</button>
      </div>
    </div>
  </div>

  function normalizeToSimplified(text) {

  const JA_KANJI_MAP = (() => {

  function toJapaneseKanji(text) {
    let out = '';
    for (const ch of text) {
      if (JA_KANJI_PREFERRED[ch]) out += JA_KANJI_PREFERRED[ch];
      else if (JA_KANJI_NO_CONVERT.has(ch)) out += ch;
      else out += JA_KANJI_MAP[ch] || ch;
    }

  }
  // elの中身をtextで置き換える。日本漢字表示ONのときは、実際に字形が変わった文字だけ

  function renderDisplayText(el, text) {

  // ================= pinyin table order (ju/qu/xu のような並び用) =================
  const INITIAL_LIST = ['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s','y','w'];
  const INITIAL_ORDER = ['b','p','m','f','d','t','n','l','g','k','h','j','q','x','zh','ch','sh','r','z','c','s','y','w',''];
  const FINAL_ORDER = [
    'a','o','e','ai','ei','ao','ou','an','en','ang','eng','ong','er',
    'i','ia','ie','iao','iu','ian','in','iang','ing','iong',
    'u','ua','uo','uai','ui','uan','un','uang','ueng',
    'v','ve','van','vn'
  ];

  function splitPinyinBase(base) {
    for (const ini of INITIAL_LIST) {
      if (base.indexOf(ini) === 0 && base.length > ini.length) {
        let final = base.slice(ini.length).replace(/^ü/, 'v');
        if ((ini === 'j' || ini === 'q' || ini === 'x') && final.charAt(0) === 'u') {
          final = 'v' + final.slice(1);
        }
        return { initial: ini, final: final };
      }
    }
    return { initial: '', final: base.replace(/^ü/, 'v') };
  }

  function pinyinGroupRank(base) {
    const parts = splitPinyinBase(base || '');
    let ir = INITIAL_ORDER.indexOf(parts.initial);
    if (ir < 0) ir = INITIAL_ORDER.length;
    let fr = FINAL_ORDER.indexOf(parts.final);
    if (fr < 0) fr = FINAL_ORDER.length;
    return [ir, fr];
  }

  function compareGroupKeys(a, b) {
    const ra = pinyinGroupRank(a);
    const rb = pinyinGroupRank(b);
    if (ra[0] !== rb[0]) return ra[0] - rb[0];
    if (ra[1] !== rb[1]) return ra[1] - rb[1];
    return a < b ? -1 : a > b ? 1 : 0;
  }

  // ================= 単語帳の並び替え（登録順／ピンイン順／声調順） =================
  // ピンイン順：単語を音節ごとにINITIAL_ORDER/FINAL_ORDERの表（あいうえお順相当）で比較する
  function pinyinRanksForWord(word) {
    return Array.from(word).map((ch) => pinyinGroupRank(getBasePinyin(ch)));
  }
  function comparePinyinWords(a, b) {
    const ra = pinyinRanksForWord(a);
    const rb = pinyinRanksForWord(b);
    const len = Math.min(ra.length, rb.length);
    for (let i = 0; i < len; i++) {
      if (ra[i][0] !== rb[i][0]) return ra[i][0] - rb[i][0];
      if (ra[i][1] !== rb[i][1]) return ra[i][1] - rb[i][1];
    }
    if (ra.length !== rb.length) return ra.length - rb.length;
    return a < b ? -1 : a > b ? 1 : 0;
  }
  // 声調順：漢字1文字だけを切り出して調べると「一」「不」のような変調や、重ね言葉の軽声が
  // 元の（変化前の）声調のまま拾われてしまう。単語全体をピンイン変換してから声調を拾うことで、
  // その単語として実際に読まれる声調（変調・軽声を含む）で比較する。
  function getWordToneDigits(word) {
    if (!pp || !pp.segment) return Array.from(word).map(() => '');
    let groups = [];
    try {
      groups = pp.segment(word, { format: pp.OutputFormat.AllArray, toneType: 'num' });
    } catch (e) { groups = []; }
    const chars = groups.length
      ? groups.reduce((acc, g) => acc.concat(g), [])
      : Array.from(word).map((c) => ({ result: c }));
    return chars.map(({ result }) => {
      const m = /([0-5])$/.exec(result || '');
      return m ? m[1] : '';
    });
  }
  // 軽声(0)は5扱いで最後に回す。文字数が短い単語から先に並べ、
  // 同じ声調の組み合わせ（例：1声+2声）の中はピンイン順にする
  function toneRanksForWord(word) {
    return getWordToneDigits(word).map((d) => {
      if (d === '') return 9;
      if (d === '0') return 5;
      return Number(d);
    });
  }
  function compareToneWords(a, b) {
    const la = Array.from(a).length;
    const lb = Array.from(b).length;
    if (la !== lb) return la - lb;
    const ta = toneRanksForWord(a);
    const tb = toneRanksForWord(b);
    for (let i = 0; i < ta.length; i++) {
      if (ta[i] !== tb[i]) return ta[i] - tb[i];
    }
    return comparePinyinWords(a, b);
  }
  const WORD_SORT_KEY = 'pinyinHelperWordSort_v1';
  const WORD_SORT_MODES = ['registered', 'pinyin', 'tone'];
  let wordSortMode = WORD_SORT_MODES.indexOf(localStorage.getItem(WORD_SORT_KEY)) >= 0

  // ================= pinyin lookup helpers =================
  function getBasePinyin(ch) {
    if (!pp || !pp.pinyin) return '';

  function getToneDigit(ch) {
    if (!pp || !pp.pinyin) return '';

      const withNum = pp.pinyin(ch, { toneType: 'num', multiple: false }) || '';
      // pinyin-proは軽声を末尾「0」で表す（「5」ではない）ので両方拾う
      const m = withNum.match(/([0-5])$/);

  // 声調番号を高低カーブのSVG記号に変換する（contourモード用。軽声(0または5)は点で表す）
  // 1声=上の水平線／2声=45度の右肩上がり／3声=ピンインのˇと同じV字（下がって上がる）／4声=45度の右肩下がり
  const TONE_CONTOUR_SHAPE = {
    '1': '<line x1="4" y1="2" x2="16" y2="2" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',
    '2': '<line x1="5" y1="12" x2="15" y2="2" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',
    '3': '<polyline points="4,8 10,13 16,8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>',
    '4': '<line x1="5" y1="2" x2="15" y2="12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',
    '0': '<circle cx="10" cy="7" r="2.3" fill="currentColor"/>',
    '5': '<circle cx="10" cy="7" r="2.3" fill="currentColor"/>',
  };
  function toneContourSVG(digit) {
    const shape = TONE_CONTOUR_SHAPE[digit];
    if (!shape) return '';
    return '<svg viewBox="0 0 20 14">' + shape + '</svg>';
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // 単語区切りを考慮してピンインを組み立てる（単語内はくっつけ、単語間はスペース）
  function lineToPinyin(normalizedLine) {
    if (!pp || !pp.segment) return '';
    let groups;
    try {
      groups = pp.segment(normalizedLine, { format: pp.OutputFormat.AllArray, toneType: state.toneType });
    } catch (e) {
      return '';
    }
    return groups
      .map((group) => group.map((g) => g.result).join(''))
      .join(' ');
  }

  // 漢字1文字ずつの下にその声調カーブSVGを揃えて配置する行を作る（アルファベット非表示のとき共通で使う）
  function appendContourCols(row, text) {
    let groups = [];
    if (pp && pp.segment) {
      try {
        groups = pp.segment(text, { format: pp.OutputFormat.AllArray, toneType: 'num' });
      } catch (e) { groups = []; }
    }
    const chars = groups.length
      ? groups.reduce((acc, g) => acc.concat(g), [])
      : Array.from(text).map((c) => ({ origin: c, result: c }));

    chars.forEach(({ origin, result }) => {
      const col = document.createElement('span');
      col.className = 'cCol';

      const charEl = document.createElement('span');
      charEl.className = 'cChar';
      renderDisplayText(charEl, origin);
      col.appendChild(charEl);

      const toneEl = document.createElement('span');
      toneEl.className = 'cTone';
      const m = /([0-5])$/.exec(result || '');
      if (m) toneEl.innerHTML = toneContourSVG(m[1]);
      col.appendChild(toneEl);

      row.appendChild(col);
    });
  }

  // 文章モード用：行全体を漢字＋声調カーブの行にする
  function buildContourBlock(normalizedLine) {
    const block = document.createElement('div');
    block.className = 'lineBlock contourBlock';

    const row = document.createElement('div');
    row.className = 'contourRow';
    appendContourCols(row, normalizedLine);

    block.appendChild(row);
    return block;
  }

  // 単語帳用：チップの中に収まる小さめの漢字＋声調カーブの行を作る
  function buildWordContourRow(word) {
    const row = document.createElement('div');
    row.className = 'contourRow wordChipContourRow';
    appendContourCols(row, word);
    return row;
  }

  // ================= surume（背景キャラ） =================
  let hasText = false;
  function updateSurume(nextHasText) {
    if (nextHasText === hasText) return;
    hasText = nextHasText;
    if (!surume) return;
    if (hasText) {
      surume.classList.remove('leaving', 'visible');
      void surume.offsetWidth;
      surume.classList.add('enter');
    } else {
      surume.classList.remove('enter', 'visible');
      void surume.offsetWidth;
      surume.classList.add('leaving');
    }
  }
  if (surume) {
    surume.addEventListener('animationend', (e) => {
      if (e.animationName === 'peekIn') {
        surume.classList.remove('enter');
        surume.classList.add('visible');
      } else if (e.animationName === 'peekOut') {
        surume.classList.remove('leaving');
      }
    });
  }

  // ================= undo (元に戻す) =================
  function pushUndo(val) {
    clearTimeout(typingTimer);
    typingTimer = null;
    if (undoStack[undoStack.length - 1] === val) return;
    undoStack.push(val);
    if (undoStack.length > 5) undoStack.shift();
    undoBtn.disabled = undoStack.length === 0;
  }

  function commitInputValue(newValue, opts) {
    const skipUndo = opts && opts.skipUndo;
    if (!skipUndo && input.value !== newValue) {
      pushUndo(input.value);
    }
    input.value = newValue;
    lastCommittedValue = newValue;
    autoGrow();
  }

  undoBtn.addEventListener('click', () => {
    if (!undoStack.length) return;
    clearTimeout(typingTimer);
    typingTimer = null;
    const prev = undoStack.pop();
    input.value = prev;
    lastCommittedValue = prev;
    undoBtn.disabled = undoStack.length === 0;
    autoGrow();
    renderCurrentMode();
  });

  // ================= 文章モード =================
  function renderSentence() {
    const raw = input.value;
    const trimmed = raw ? raw.trim() : '';

    if (trimmed === '') {
      results.innerHTML = '<div class="emptyState"></div>';
      return;
    }

    const lines = raw.split('\n');
    const frag = document.createDocumentFragment();

    lines.forEach((line) => {
      if (line.trim() === '') return;

      const normalized = normalizeToSimplified(line);

      if (state.contourOn) {
        frag.appendChild(buildContourBlock(normalized));
        return;
      }

      const pyText = lineToPinyin(normalized);

      const block = document.createElement('div');
      block.className = 'lineBlock';

      const zhDiv = document.createElement('div');
      zhDiv.className = 'zhLine';
      renderDisplayText(zhDiv, normalized);

      const pyDiv = document.createElement('div');
      pyDiv.className = 'pyLine';
      pyDiv.textContent = pyText;

      block.appendChild(zhDiv);
      block.appendChild(pyDiv);
      frag.appendChild(block);
    });

    results.innerHTML = '';
    results.appendChild(frag);
    results.scrollTop = results.scrollHeight;
  }

  // ================= 単漢字モード =================
  // テキストエリアの内容そのものを正とする：行＝グループ。1行のみなら「未グループ」表示。
  function parseKanjiLines(rawText) {
    const normalized = normalizeToSimplified(rawText);
    const rawLines = normalized.split('\n');
    const seen = new Set();
    const lines = [];
    rawLines.forEach((line) => {
      const chars = [];
      for (const ch of line) {
        if (!HANZI_RE.test(ch)) continue;
        if (seen.has(ch)) continue;
        seen.add(ch);
        chars.push(ch);
      }
      if (chars.length) lines.push(chars);
    });
    return lines;
  }

  // 漢字だけを大きく表示。声調数字は123トグルON時のみ右肩に小さく（絶対配置なのでレイアウトは動かない）。
  // mismatch=true のときは、そのグループの代表音と読みが違う＝警告色で表示。
  // 単語帳にその漢字を含む単語が1つもないときはタップしても何も起きないので、少し薄い色で示す。
  function makeCard(ch, mismatch) {
    const hasWord = savedWords.some((w) => w.indexOf(ch) >= 0);
    const card = document.createElement('div');
    card.className = 'kcard' + (state.contourOn ? ' contourOn' : '');
    card.dataset.char = ch;

    const hz = document.createElement('span');
    hz.className = 'khz' + (mismatch ? ' mismatch' : '') + (hasWord ? '' : ' noWord');
    renderDisplayText(hz, ch);
    card.appendChild(hz);

    if (state.contourOn) {
      const contour = document.createElement('span');
      contour.className = 'kcontour';
      contour.innerHTML = toneContourSVG(getToneDigit(ch));
      card.appendChild(contour);
    } else {
      const tone = document.createElement('span');
      tone.className = 'ktone';
      tone.textContent = state.toneType === 'num' ? getToneDigit(ch) : '';
      card.appendChild(tone);
    }

    card.addEventListener('click', () => {
      if (state.reordering || !hasWord) return;
      openWordSheetFor(ch, card);
    });

    return card;
  }

  const WARN_ICON_SVG = '<svg class="kgroupWarnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>';

  // ================= 単漢字タップ時の単語シート =================
  // 登録済み単語にその漢字を含むものがあれば下からシートを出す。無ければ何もしない（現状維持）。
  let activeWordCard = null;
  let activeWordChar = null;
  function setActiveWordCard(card) {
    if (activeWordCard && activeWordCard !== card) activeWordCard.classList.remove('wordActive');
    activeWordCard = card || null;
    if (activeWordCard) activeWordCard.classList.add('wordActive');
  }
  // 現在の表示設定（声調123／声調カーブ／日本字体）に合わせて中身だけを作り直す
  function renderWordSheetContent(ch) {
    const matches = savedWords.filter((w) => w.indexOf(ch) >= 0);
    wordSheetList.innerHTML = '';
    matches.forEach((w) => {
      const item = document.createElement('div');
      item.className = 'wordSheetItem';
      if (state.contourOn) {
        const row = document.createElement('div');
        row.className = 'contourRow';
        appendContourCols(row, w);
        item.appendChild(row);
      } else {
        const hz = document.createElement('div');
        hz.className = 'wordSheetHz';
        renderDisplayText(hz, w);
        const py = document.createElement('div');
        py.className = 'wordSheetPy';
        py.textContent = lineToPinyin(w);
        item.appendChild(hz);
        item.appendChild(py);
      }
      wordSheetList.appendChild(item);
    });
    return matches.length;
  }
  function openWordSheetFor(ch, cardEl) {
    if (!renderWordSheetContent(ch)) return;
    activeWordChar = ch;
    // タップした漢字が画面下半分にある場合は、シートに隠れないよう上から出す
    if (cardEl) {
      const rect = cardEl.getBoundingClientRect();
      wordSheet.classList.toggle('fromTop', rect.top > window.innerHeight / 2);
    }
    wordSheet.classList.add('open');
    setActiveWordCard(cardEl);
  }
  function closeWordSheet() {
    wordSheet.classList.remove('open');
    setActiveWordCard(null);
    activeWordChar = null;
  }
  // 声調123／声調カーブ／日本字体の表示設定が変わったとき用。呼び出し側は
  // renderCurrentMode(true)でシート自体を閉じずに描画し直しているので、ここでは
  // 新しい表示設定のカードを探して中身だけを作り直す（'open'クラスは既に付いたままなので
  // classList.addは何もしない＝閉じるアニメーションは一切発生しない）
  function reopenWordSheetIfNeeded(ch) {
    if (!ch) return;
    // シートは単漢字モードのグリッドか全漢字ページのグリッドのどちらからでも開けるので、
    // 今表示されている方を探す
    const grid = !allKanjiScreen.hidden ? allKanjiGrid : kanjiGrid;
    const card = grid.querySelector('.kcard[data-char="' + CSS.escape(ch) + '"]');
    openWordSheetFor(ch, card);
  }
  // カードでもシート自身でも表示切り替えボタンでもない場所をタップしたら閉じる
  document.addEventListener('click', (e) => {
    if (!wordSheet.classList.contains('open')) return;
    if (e.target.closest('#wordSheet')) return;
    if (e.target.closest('.kcard')) return;
    if (e.target.closest('#toolFooter')) return;
    closeWordSheet();
  });

  function renderKanjiMode() {
    const lines = parseKanjiLines(input.value);
    kanjiGrid.innerHTML = '';

    if (!lines.length) {
      kanjiGrid.innerHTML = '<div class="emptyState"></div>';
      updateKanjiToolbarUI(0, false);
      return;
    }

    // state.groupedView が true（＝グループ分け実行済み）のときだけ、グループ見出し・不一致警告を出す。
    // 同じピンインの漢字しかなくグループが1つだけになった場合でも、実行済みなら見出しを表示する。
    const isGroupedView = state.groupedView;
    lines.forEach((chars) => {
      const wrap = document.createElement('div');
      wrap.className = 'kgroup';

      let labelKey = '';
      if (isGroupedView) {
        labelKey = getBasePinyin(chars[0]) || '';
        const hasMismatch = chars.some((ch) => getBasePinyin(ch) !== labelKey);
        const label = document.createElement('div');
        label.className = 'kgroupLabel';
        label.innerHTML = '<span>' + escapeHtml(labelKey) + '</span>' + (hasMismatch ? WARN_ICON_SVG : '');
        wrap.appendChild(label);
      }

      const row = document.createElement('div');
      row.className = 'kgroupRow';
      chars.forEach((ch) => {
        const mismatch = isGroupedView && getBasePinyin(ch) !== labelKey;
        row.appendChild(makeCard(ch, mismatch));
      });
      wrap.appendChild(row);
      kanjiGrid.appendChild(wrap);
    });

    const total = lines.reduce((n, chars) => n + chars.length, 0);
    updateKanjiToolbarUI(total, isGroupedView);

    if (state.reordering) attachDragHandlers();
  }

  // ================= 全漢字ページ =================
  // 登録済みの漢字を常にピンインでグループ化して表示する（グループ内は登録順のまま）。
  function renderAllKanjiGrid() {
    allKanjiGrid.innerHTML = '';
    if (!allKanji.length) {
      allKanjiGrid.innerHTML = '<div class="listEmpty">まだ漢字が登録されていません</div>';
      return;
    }

    const groups = new Map();
    allKanji.forEach((ch) => {
      const key = getBasePinyin(ch) || ch;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(ch);
    });

    const orderedKeys = Array.from(groups.keys()).sort(compareGroupKeys);
    const frag = document.createDocumentFragment();
    orderedKeys.forEach((key) => {
      const wrap = document.createElement('div');
      wrap.className = 'kgroup';

      const label = document.createElement('div');
      label.className = 'kgroupLabel';
      label.innerHTML = '<span>' + escapeHtml(key) + '</span>';
      wrap.appendChild(label);

      const row = document.createElement('div');
      row.className = 'kgroupRow';
      groups.get(key).forEach((ch) => row.appendChild(makeCard(ch, false)));
      wrap.appendChild(row);

      frag.appendChild(wrap);
    });
    allKanjiGrid.appendChild(frag);
  }

  function updateKanjiToolbarUI(charCount, isGroupedView) {
    groupBtnLabel.textContent = isGroupedView ? '再グループ化' : 'グループ分け';
    groupBtn.disabled = charCount === 0;
    reorderBtn.hidden = !isGroupedView;
    orderHint.textContent = (!isGroupedView && charCount > 0) ? '入力順で表示中' : '';
  }

  // グループ分け：既にまとまっている行（＝同じ音の文字だけの行）はその並びを維持し、
  // 新しく増えた文字（混在した行や新規追加分）だけを対応グループの末尾に足す。
  function performGrouping() {
    const normalized = normalizeToSimplified(input.value);
    const rawLines = normalized.split('\n');
    const seen = new Set();
    const pureGroups = new Map();
    const strayChars = [];

    rawLines.forEach((line) => {
      const chars = [];
      for (const ch of line) {
        if (!HANZI_RE.test(ch) || seen.has(ch)) continue;
        seen.add(ch);
        chars.push(ch);
      }
      if (!chars.length) return;
      const keys = new Set(chars.map(getBasePinyin));
      if (keys.size === 1) {
        const key = chars.length ? getBasePinyin(chars[0]) : '';
        const arr = pureGroups.get(key) || [];
        pureGroups.set(key, arr.concat(chars));
      } else {
        strayChars.push.apply(strayChars, chars);
      }
    });

    strayChars.forEach((ch) => {
      const key = getBasePinyin(ch) || ch;
      const arr = pureGroups.get(key) || [];
      arr.push(ch);
      pureGroups.set(key, arr);
    });

    if (!pureGroups.size) return;

    const orderedKeys = Array.from(pureGroups.keys()).sort(compareGroupKeys);
    const outLines = orderedKeys.map((k) => pureGroups.get(k).join(''));
    commitInputValue(outLines.join('\n'));
    state.groupedView = true;
    renderCurrentMode();
  }

  groupBtn.addEventListener('click', performGrouping);

  reorderBtn.addEventListener('click', () => {
    closeWordSheet();
    state.reordering = true;
    document.body.classList.add('reordering');
    renderKanjiMode();
  });

  function collectTextFromDom() {
    const lines = [];
    kanjiGrid.querySelectorAll('.kgroup').forEach((groupEl) => {
      const row = groupEl.querySelector('.kgroupRow');
      if (!row) return;
      const chars = Array.prototype.map
        .call(row.querySelectorAll('.kcard'), (c) => c.dataset.char)
        .join('');
      if (chars) lines.push(chars);
    });
    return lines.join('\n');
  }

  doneBtn.addEventListener('click', () => {
    const newText = collectTextFromDom();
    commitInputValue(newText);
    state.reordering = false;
    document.body.classList.remove('reordering');
    renderCurrentMode();
  });

  // カードのドラッグ並び替え（マウス／タッチ共通、グループ内のみ）
  function attachDragHandlers() {
    kanjiGrid.querySelectorAll('.kgroupRow').forEach((row) => {
      Array.prototype.forEach.call(row.querySelectorAll('.kcard'), (card) => attachCardDrag(card, row));
    });
  }

  function attachCardDrag(card, row) {
    card.addEventListener('pointerdown', (e) => {
      if (!state.reordering) return;
      e.preventDefault();
      const rect = card.getBoundingClientRect();
      const offsetX = e.clientX - rect.left;
      const offsetY = e.clientY - rect.top;
      try { card.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
      card.classList.add('dragging');
      card.style.width = rect.width + 'px';
      card.style.left = rect.left + 'px';
      card.style.top = rect.top + 'px';

      const placeholder = document.createElement('div');
      placeholder.className = 'kcardPlaceholder';
      placeholder.style.width = rect.width + 'px';
      placeholder.style.height = rect.height + 'px';
      row.insertBefore(placeholder, card.nextSibling);

      function onMove(ev) {
        card.style.left = (ev.clientX - offsetX) + 'px';
        card.style.top = (ev.clientY - offsetY) + 'px';
        const dragRect = card.getBoundingClientRect();
        const dcx = dragRect.left + dragRect.width / 2;
        const dcy = dragRect.top + dragRect.height / 2;
        let closest = null;
        let closestDist = Infinity;
        Array.prototype.forEach.call(row.querySelectorAll('.kcard:not(.dragging)'), (sib) => {
          const r = sib.getBoundingClientRect();
          const dist = Math.hypot(dcx - (r.left + r.width / 2), dcy - (r.top + r.height / 2));
          if (dist < closestDist) { closestDist = dist; closest = sib; }
        });
        if (closest) {
          const r = closest.getBoundingClientRect();
          const before = dcx < r.left + r.width / 2;
          row.insertBefore(placeholder, before ? closest : closest.nextSibling);
        }
      }
      function onUp(ev) {
        row.insertBefore(card, placeholder);
        placeholder.remove();
        card.classList.remove('dragging');
        card.style.position = '';
        card.style.left = '';
        card.style.top = '';
        card.style.width = '';
        try { card.releasePointerCapture(ev.pointerId); } catch (err) { /* noop */ }
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
      }
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    });
  }

  // ================= モード切替 / 声調トグル =================
  function updateModeTabsUI() {
    tabBtns.forEach((btn) => btn.classList.toggle('active', btn.dataset.mode === state.mode));
  }

  tabBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      const mode = btn.dataset.mode;
      if (mode === state.mode) return;
      state.mode = mode;
      updateModeTabsUI();
      renderCurrentMode();
    });
  });

  // 単語帳を開いている間に声調表示の設定を切り替えたら、単語帳側も即座に反映する
  function refreshWordbookIfOpen() {
    if (!wordbookScreen.hidden) renderWordGrid();
  }
  // 全漢字ページを開いている間も同様に即座に反映する
  function refreshAllKanjiIfOpen() {
    if (!allKanjiScreen.hidden) renderAllKanjiGrid();
  }

  toneToggle.addEventListener('click', () => {
    const reopenChar = wordSheet.classList.contains('open') ? activeWordChar : null;
    if (state.contourOn) {
      // 記号モード中に押した場合は、記号モードを抜けて数字モードへ切り替える
      state.contourOn = false;
      contourToggle.classList.remove('active');
      contourToggle.setAttribute('aria-pressed', 'false');
      state.toneType = 'num';
    } else {
      state.toneType = state.toneType === 'symbol' ? 'num' : 'symbol';
    }
    toneToggle.classList.toggle('active', state.toneType === 'num');
    toneToggle.setAttribute('aria-pressed', state.toneType === 'num' ? 'true' : 'false');
    renderCurrentMode(!!reopenChar);
    refreshWordbookIfOpen();
    refreshAllKanjiIfOpen();
    reopenWordSheetIfNeeded(reopenChar);
  });

  contourToggle.addEventListener('click', () => {
    const reopenChar = wordSheet.classList.contains('open') ? activeWordChar : null;
    state.contourOn = !state.contourOn;
    contourToggle.classList.toggle('active', state.contourOn);
    contourToggle.setAttribute('aria-pressed', state.contourOn ? 'true' : 'false');
    renderCurrentMode(!!reopenChar);
    refreshWordbookIfOpen();
    refreshAllKanjiIfOpen();
    reopenWordSheetIfNeeded(reopenChar);
  });

  jaKanjiToggle.addEventListener('click', () => {
    const reopenChar = wordSheet.classList.contains('open') ? activeWordChar : null;
    state.jaKanjiOn = !state.jaKanjiOn;
    jaKanjiToggle.classList.toggle('active', state.jaKanjiOn);
    jaKanjiToggle.setAttribute('aria-pressed', state.jaKanjiOn ? 'true' : 'false');
    renderCurrentMode(!!reopenChar);
    refreshWordbookIfOpen();
    refreshAllKanjiIfOpen();
    reopenWordSheetIfNeeded(reopenChar);
  });

  focusToggle.addEventListener('click', () => {
    state.focusMode = !state.focusMode;
    document.body.classList.toggle('focusMode', state.focusMode);
    focusToggle.classList.toggle('active', state.focusMode);
    focusToggle.setAttribute('aria-pressed', state.focusMode ? 'true' : 'false');
    focusToggle.title = state.focusMode ? '入力欄を表示' : '入力欄を畳んで広く表示';
  });

  // ================= 描画の切替 =================
  // keepWordSheet=trueのときは単語シートを閉じない（声調123／声調カーブ／日本字体の
  // 表示切り替えボタン用。呼び出し側でシートの中身を後から作り直す）
  function renderCurrentMode(keepWordSheet) {
    if (!keepWordSheet) closeWordSheet();
    const trimmed = input.value ? input.value.trim() : '';
    updateSurume(trimmed !== '');
    clearBtn.classList.toggle('show', input.value.length > 0);
    updateAutoTitleDisplay();
    updateSaveBtnDirtyState();

    if (state.mode === 'sentence') {
      results.hidden = false;
      kanjiGrid.hidden = true;
      kanjiToolbar.hidden = true;
      renderSentence();
    } else {
      results.hidden = true;
      kanjiGrid.hidden = false;
      kanjiToolbar.hidden = false;
      renderKanjiMode();
    }
  }

  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, window.innerHeight * 0.22) + 'px';
  }

  input.addEventListener('input', () => {
    if (!typingTimer) burstStartValue = lastCommittedValue;
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => {
      typingTimer = null;
      if (input.value !== burstStartValue) {
        pushUndo(burstStartValue);
        lastCommittedValue = input.value;
      }
    }, 800);
    autoGrow();
    state.groupedView = false;
    renderCurrentMode();
  });

  clearBtn.addEventListener('click', () => {
    commitInputValue('');
    input.focus();
    renderCurrentMode();
  });

  // ================= 保存（localStorage） =================
  const STORAGE_KEY = 'pinyinHelperSavedFiles_v1';
  function loadSavedFiles() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function persistSavedFiles() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(savedFiles)); } catch (e) { /* noop */ }
  }
  let savedFiles = loadSavedFiles();

  // 旧形式（title が自由記述のタイトルだった）からの移行：
  // 旧タイトルはサブタイトルへ回し、タイトルは内容から自動生成し直す
  (function migrateTitlesToAutoTitle() {
    let changed = false;
    savedFiles.forEach((f) => {
      if (typeof f.subtitle !== 'string') {
        f.subtitle = f.title || '';
        f.title = computeAutoTitle(f.mode, f.text || '');
        changed = true;
      }
    });
    if (changed) persistSavedFiles();
  })();

  // 一覧の並び順を「更新日時順」から「手動（配列順）」へ一度だけ移行する。
  // 既存ユーザーには、今まで見えていた並び（新しい順）をそのまま初期の手動順として渡す。
  const ORDER_INIT_KEY = 'pinyinHelperOrderInit_v1';
  try {
    if (!localStorage.getItem(ORDER_INIT_KEY)) {
      savedFiles.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      persistSavedFiles();
      localStorage.setItem(ORDER_INIT_KEY, '1');
    }
  } catch (e) { /* noop */ }

  // ---------- フォルダ（1階層） ----------
  const FOLDER_KEY = 'pinyinHelperFolders_v1';
  function loadFolders() {
    try {
      const raw = localStorage.getItem(FOLDER_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function persistFolders() {
    try { localStorage.setItem(FOLDER_KEY, JSON.stringify(folders)); } catch (e) { /* noop */ }
  }
  let folders = loadFolders();

  // ---------- 単語帳（単漢字モードのタップで関連語を出すための登録単語） ----------
  const WORDS_KEY = 'pinyinHelperWords_v1';
  function loadWords() {
    try {
      const raw = localStorage.getItem(WORDS_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function persistWords() {
    try { localStorage.setItem(WORDS_KEY, JSON.stringify(savedWords)); } catch (e) { /* noop */ }
  }
  let savedWords = loadWords(); // 新しく登録した単語が先頭

  // 簡体字化して先頭4文字（漢字のみ）に丸め、既に登録済みなら何もしない（重複自動排除）
  // ここに含まれる漢字は、全漢字ページ未登録のものだけ自動で登録する（通知なし）
  function addWord(raw) {
    const simplified = normalizeToSimplified(raw || '');
    const chars = Array.from(simplified).filter((ch) => HANZI_RE.test(ch)).slice(0, 4);
    const word = chars.join('');
    if (!word || savedWords.indexOf(word) >= 0) return false;
    savedWords.unshift(word);
    persistWords();
    addAllKanji(word);
    return true;
  }
  function deleteWords(words) {
    const del = new Set(words);
    savedWords = savedWords.filter((w) => !del.has(w));
    persistWords();
  }

  // ---------- 全漢字（単語帳とは別に、登録した漢字を常にピンインごとにグループ表示するページ） ----------
  const ALL_KANJI_KEY = 'pinyinHelperAllKanji_v1';
  function loadAllKanji() {
    try {
      const raw = localStorage.getItem(ALL_KANJI_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function persistAllKanji() {
    try { localStorage.setItem(ALL_KANJI_KEY, JSON.stringify(allKanji)); } catch (e) { /* noop */ }
  }
  let allKanji = loadAllKanji(); // 登録順（古い順）

  // 入力された文字列から漢字だけを取り出し、まだ登録していないものだけ末尾に追加する（重複は自動で無視）
  function addAllKanji(raw) {
    const simplified = normalizeToSimplified(raw || '');
    const seen = new Set(allKanji);
    let added = false;
    for (const ch of simplified) {
      if (!HANZI_RE.test(ch) || seen.has(ch)) continue;
      seen.add(ch);
      allKanji.push(ch);
      added = true;
    }
    if (added) persistAllKanji();
    return added;
  }

  // ---------- バックアップの書き出し／読み込み ----------
  // ホーム画面アプリはブラウザ側の事情でデータ領域が消えることがあるため、
  // 手元にJSONファイルとして退避・復元できるようにする。
  function exportBackup() {
    const payload = {
      app: 'pinyin-helper',
      version: 1,
      exportedAt: Date.now(),
      savedFiles: savedFiles,
      folders: folders,
      words: savedWords,
    };
    const json = JSON.stringify(payload, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const pad = (n) => String(n).padStart(2, '0');
    const d = new Date();
    const stamp = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes());

    const a = document.createElement('a');
    a.href = url;
    a.download = 'pinyin-helper-backup-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  // 既存データは残したまま、IDが重複しないファイル・フォルダ・単語だけを追加する（上書きしない）
  function mergeImportedBackup(data) {
    const importedFolders = Array.isArray(data.folders) ? data.folders : [];
    const importedFiles = Array.isArray(data.savedFiles) ? data.savedFiles : [];
    const importedWords = Array.isArray(data.words) ? data.words : [];

    const existingFolderIds = new Set(folders.map((f) => f.id));
    importedFolders.forEach((f) => {
      if (f && f.id && !existingFolderIds.has(f.id)) {
        folders.push(f);
        existingFolderIds.add(f.id);
      }
    });

    const existingFileIds = new Set(savedFiles.map((f) => f.id));
    let addedCount = 0;
    importedFiles.forEach((f) => {
      if (f && f.id && !existingFileIds.has(f.id)) {
        if (typeof f.subtitle !== 'string') {
          f.subtitle = f.title || '';
          f.title = computeAutoTitle(f.mode, f.text || '');
        }
        savedFiles.push(f);
        existingFileIds.add(f.id);
        addedCount += 1;
      }
    });

    const existingWords = new Set(savedWords);
    importedWords.forEach((w) => {
      if (typeof w === 'string' && w && !existingWords.has(w)) {
        savedWords.push(w);
        existingWords.add(w);
      }
    });

    persistFolders();
    persistSavedFiles();
    persistWords();
    return addedCount;
  }

  exportBtn.addEventListener('click', exportBackup);
  importBtn.addEventListener('click', () => importFileInput.click());
  importFileInput.addEventListener('change', () => {
    const file = importFileInput.files && importFileInput.files[0];
    importFileInput.value = '';
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      let data;
      try {
        data = JSON.parse(String(reader.result));
      } catch (e) {
        alert('ファイルの読み込みに失敗しました（JSON形式が正しくないようです）');
        return;
      }
      if (!data || (!Array.isArray(data.savedFiles) && !Array.isArray(data.folders))) {
        alert('このファイルはバックアップ形式ではないようです');
        return;
      }
      const added = mergeImportedBackup(data);
      updateListChrome();
      renderListRows();
      alert(added > 0
        ? added + '件のファイルを読み込みました（既存のデータはそのまま残っています）'
        : '新しく追加されたファイルはありませんでした（すでに読み込み済みの可能性があります）');
    };
    reader.readAsText(file);
  });

  // 保存一覧の表示状態：query は検索文字列。フォルダはアコーディオンなので展開中のIDをSetで持つ
  const listView = { query: '' };
  const expandedFolders = new Set();

  function folderName(id) {
    const f = folders.find((x) => x.id === id);
    return f ? f.name : '';
  }
  function fileCountInFolder(id) {
    return savedFiles.filter((f) => (f.folderId || null) === id).length;
  }
  function addFolder(name) {
    const folder = {
      id: 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name: name,
      createdAt: Date.now(),
    };
    folders.push(folder);
    persistFolders();
    return folder;
  }

  // タイトル or 中の漢字で検索（「你好」なら 你 と 好 を両方含むファイルを拾う）
  function fileMatchesQuery(file, q) {
    const query = q.trim();
    if (!query) return true;
    if ((file.title || '').toLowerCase().indexOf(query.toLowerCase()) >= 0) return true;
    if ((file.subtitle || '').toLowerCase().indexOf(query.toLowerCase()) >= 0) return true;
    const text = normalizeToSimplified(file.text || '');
    if (text.indexOf(query) >= 0) return true;
    const hanziChars = [];
    for (const ch of query) {
      if (HANZI_RE.test(ch)) hanziChars.push(normalizeToSimplified(ch));
    }
    return hanziChars.length > 0 && hanziChars.every((ch) => text.indexOf(ch) >= 0);
  }

  // ---------- アイコン ----------
  const FOLDER_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path></svg>';
  const FOLDER_PLUS_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path><line x1="12" y1="10" x2="12" y2="16"></line><line x1="9" y1="13" x2="15" y2="13"></line></svg>';
  const CHEVRON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>';
