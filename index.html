  newBtn.addEventListener('click', () => {
    autoSaveBeforeLeaving();
    startNewFile();
  });

  // ================= 単語帳 =================
  let wordSelectMode = false;
  const selectedWords = new Set();

  function updateWordSelectUI() {
    wordSelectToggleBtn.classList.toggle('active', wordSelectMode);
    wordSelectToggleBtn.setAttribute('aria-pressed', wordSelectMode ? 'true' : 'false');
    wordMarkPersonBtn.hidden = !wordSelectMode;
    wordMarkPersonBtn.disabled = selectedWords.size === 0;
    wordUnmarkPersonBtn.hidden = !wordSelectMode;
    wordUnmarkPersonBtn.disabled = selectedWords.size === 0;
    wordDeleteBtn.hidden = !wordSelectMode;
    wordDeleteBtn.disabled = selectedWords.size === 0;
    wordSelectCount.textContent = wordSelectMode && selectedWords.size ? selectedWords.size + '件選択中' : '';
  }

  function exitWordSelectMode() {
    wordSelectMode = false;
    selectedWords.clear();
    updateWordSelectUI();
  }

  // 現在の並び替えモードに応じたグループ情報（見出し・右端インデックス用）を返す。
  // 登録順のときはグループ化しない（null）。
  function wordGroupInfo(word) {
    if (wordSortMode === 'pinyin') {
      const firstChar = Array.from(word)[0] || '';
      const initial = splitPinyinBase(getBasePinyin(firstChar) || '').initial;
      const text = initial || ALL_KANJI_INDEX_NO_INITIAL_LABEL;
      return { key: initial, indexText: text, headerText: text };
    }
    if (wordSortMode === 'tone') {
      const [t1, t2] = wordToneGroupDigits(word);
      const key = t1 + '_' + t2;
      const indexText = t2 ? t1 + t2 : t1;
      const headerText = t2
        ? (TONE_GROUP_NAME[t1] || '?') + '-' + (TONE_GROUP_NAME[t2] || '?')
        : (TONE_GROUP_NAME[t1] || '?');
      return { key, indexText, headerText };
    }
    return null;
  }

  function renderWordGrid() {
    wordGrid.innerHTML = '';
    wordGrid.classList.toggle('contourMode', state.contourOn);
    wordbookIndex.innerHTML = '';
    const grouped = wordSortMode !== 'registered';
    wordbookIndex.hidden = !grouped;
    if (!savedWords.length) {
      wordGrid.innerHTML = '<div class="listEmpty">まだ単語が登録されていません</div>';
      return;
    }
    const indexFrag = document.createDocumentFragment();
    let lastGroupKey = null;
    getSortedWords().forEach((word) => {
      if (grouped) {
        const info = wordGroupInfo(word);
        if (info && info.key !== lastGroupKey) {
          lastGroupKey = info.key;
          const label = document.createElement('div');
          label.className = 'wordGroupLabel';
          label.dataset.groupKey = info.key;
          label.textContent = info.headerText;
          wordGrid.appendChild(label);

          const item = document.createElement('div');
          item.className = 'wordbookIndexItem';
          item.dataset.groupKey = info.key;
          item.textContent = info.indexText;
          indexFrag.appendChild(item);
        }
      }

      const isPerson = personWords.has(word);
      const chip = document.createElement('div');
      chip.className = 'wordChip' + (isPerson ? ' person' : '') + (selectedWords.has(word) ? ' selected' : '');

      if (isPerson) {
        const badge = document.createElement('div');
        badge.className = 'wordChipPersonIcon';
        badge.innerHTML = PERSON_SVG;
        chip.appendChild(badge);
      }

      if (state.contourOn) {
        chip.appendChild(buildWordContourRow(word));
      } else {
        const hz = document.createElement('div');
        hz.className = 'wordChipHz';
        renderDisplayText(hz, word);
        chip.appendChild(hz);

        const py = document.createElement('div');
        py.className = 'wordChipPy';
        // ピンインなしモードでも枠（高さ24px固定）は残して、カードの高さ・漢字の位置を変えない
        py.textContent = state.pinyinOff ? '' : lineToPinyin(word);
        chip.appendChild(py);
      }

      chip.addEventListener('click', () => {
        if (!wordSelectMode) return;
        if (selectedWords.has(word)) selectedWords.delete(word);
        else selectedWords.add(word);
        chip.classList.toggle('selected');
        updateWordSelectUI();
      });

      wordGrid.appendChild(chip);
    });
    wordbookIndex.appendChild(indexFrag);

    fitAllWordChipPy();
  }

  // 単語帳の右端インデックスをタップ／ドラッグして、そのグループの先頭見出しへジャンプする
  // （全漢字ページの同機能と同じ操作感にしている）
  function jumpWordbookToGroup(groupKey) {
    const target = wordGrid.querySelector('.wordGroupLabel[data-group-key="' + CSS.escape(groupKey) + '"]');
    if (target) target.scrollIntoView({ block: 'start' });
  }
  function wordbookIndexItemAt(x, y) {
    const el = document.elementFromPoint(x, y);
    return el ? el.closest('.wordbookIndexItem') : null;
  }
  let wordbookIndexActiveEl = null;
  function setWordbookIndexActive(item) {
    if (wordbookIndexActiveEl && wordbookIndexActiveEl !== item) wordbookIndexActiveEl.classList.remove('active');
    wordbookIndexActiveEl = item || null;
    if (wordbookIndexActiveEl) wordbookIndexActiveEl.classList.add('active');
  }
  wordbookIndex.addEventListener('click', (e) => {
    const item = e.target.closest('.wordbookIndexItem');
    if (item) jumpWordbookToGroup(item.dataset.groupKey);
  });
  wordbookIndex.addEventListener('touchstart', (e) => {
    const item = wordbookIndexItemAt(e.touches[0].clientX, e.touches[0].clientY);
    if (item) { jumpWordbookToGroup(item.dataset.groupKey); setWordbookIndexActive(item); }
  }, { passive: true });
  wordbookIndex.addEventListener('touchmove', (e) => {
    const item = wordbookIndexItemAt(e.touches[0].clientX, e.touches[0].clientY);
    if (item && item !== wordbookIndexActiveEl) { jumpWordbookToGroup(item.dataset.groupKey); setWordbookIndexActive(item); }
    e.preventDefault();
  }, { passive: false });
  wordbookIndex.addEventListener('touchend', () => setWordbookIndexActive(null));
  wordbookIndex.addEventListener('touchcancel', () => setWordbookIndexActive(null));

  // 声調123／記号表記を切り替えても行の高さが動かないよう、ピンインが1行に収まるまで
  // 文字サイズを少しずつ縮める（最小サイズでも収まらなければCSSの省略記号に任せる）。
  // 描画直後はまだ画面が非表示のことがあるので、確実に幅が測れるよう次フレームで実行する。
  // カード1枚ずつ「縮める→測る」を繰り返すと、そのたびにブラウザが画面全体の配置を計算し直して
  // 単語が多いと数秒かかるので、全カードをまとめて測る→まとめて縮める、を交互に行う。
  // 最初の縮小幅は「収まる幅 ÷ 今の幅」の比で見積もる（字間の分だけ必ず大きめに出るので、
  // そこから1pxずつ下げれば、1pxずつ縮めていたときと同じ大きさに落ち着く）。
  const WORD_CHIP_PY_MAX_PX = 19;
  const WORD_CHIP_PY_MIN_PX = 12;
  function fitAllWordChipPy() {
    requestAnimationFrame(() => {
      const els = Array.from(wordGrid.querySelectorAll('.wordChipPy')).filter((el) => el.textContent);
      els.forEach((el) => { el.style.fontSize = ''; });
      // 測る（ここで1回だけ配置が計算される）
      let pending = els
        .map((el) => ({ el, maxWidth: el.clientWidth, width: el.scrollWidth, size: WORD_CHIP_PY_MAX_PX }))
        .filter((p) => p.maxWidth && p.width > p.maxWidth + 0.5);
      // 縮める
      pending.forEach((p) => {
        const estimate = Math.floor(WORD_CHIP_PY_MAX_PX * p.maxWidth / p.width);
        p.size = Math.max(WORD_CHIP_PY_MIN_PX, Math.min(WORD_CHIP_PY_MAX_PX - 1, estimate));
        p.el.style.fontSize = p.size + 'px';
      });
      // まだはみ出しているものだけ、1pxずつ下げて測り直す
      while (pending.length) {
        pending = pending.filter((p) => p.size > WORD_CHIP_PY_MIN_PX && p.el.scrollWidth > p.maxWidth + 0.5);
        pending.forEach((p) => {
          p.size -= 1;
          p.el.style.fontSize = p.size + 'px';
        });
      }
    });
  }

  // skipFocus=trueのときは入力欄にフォーカスしない（起動直後にキーボードが勝手に出ないようにする）
  function openWordbookScreen(skipFocus) {
    closeAllKanjiScreen();
    closeWordSheet();
    exitWordSelectMode();
    wordAddInput.value = '';
    renderWordGrid();
    wordbookScreen.hidden = false;
    if (skipFocus !== true) setTimeout(() => wordAddInput.focus(), 0);
  }
  function closeWordbookScreen() {
    wordbookScreen.hidden = true;
  }

  function openAllKanjiScreen() {
    closeWordbookScreen();
    closeWordSheet();
    allKanjiAddInput.value = '';
    renderAllKanjiGrid();
    allKanjiScreen.hidden = false;
    setTimeout(() => allKanjiAddInput.focus(), 0);
  }
  function closeAllKanjiScreen() {
    allKanjiScreen.hidden = true;
  }

  modeFooterWordbookBtn.addEventListener('click', () => openWordbookScreen());
  modeFooterAllKanjiBtn.addEventListener('click', openAllKanjiScreen);
  modeFooterInputBtn.addEventListener('click', () => {
    // 何も入力されていない状態で入力モードに移ったときは、すぐ書けるよう入力欄を開く
    if (!input.value.trim()) setFocusMode(false);
    closeWordbookScreen();
    closeAllKanjiScreen();
    closeListScreen();
  });

  wordbookMenuBtn.addEventListener('click', () => {
    if (isListScreenOpen()) { closeListScreen(); return; }
    autoSaveBeforeLeaving();
    openListScreen();
  });

  allKanjiMenuBtn.addEventListener('click', () => {
    if (isListScreenOpen()) { closeListScreen(); return; }
    autoSaveBeforeLeaving();
    openListScreen();
  });

  // Enterを押すたびに1件ずつ、入力に含まれる漢字を全部登録する（重複は自動で無視）
  let allKanjiAddComposing = false;
  allKanjiAddInput.addEventListener('compositionstart', () => { allKanjiAddComposing = true; });
  allKanjiAddInput.addEventListener('compositionend', () => { allKanjiAddComposing = false; });
  allKanjiAddInput.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || allKanjiAddComposing || e.isComposing) return;
    e.preventDefault();
    addAllKanji(allKanjiAddInput.value);
    allKanjiAddInput.value = '';
    renderAllKanjiGrid();
  });

  wordSelectToggleBtn.addEventListener('click', () => {
    wordSelectMode = !wordSelectMode;
    selectedWords.clear();
    updateWordSelectUI();
    renderWordGrid();
  });

  wordSortBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      if (btn.dataset.sort === wordSortMode) return;
      wordSortMode = btn.dataset.sort;
      updateWordSortBtnsUI();
      renderWordGrid();
    });
  });

  wordMarkPersonBtn.addEventListener('click', () => {
    if (!selectedWords.size) return;
    setWordsPersonStatus(selectedWords, true);
    exitWordSelectMode();
    renderWordGrid();
  });

  wordUnmarkPersonBtn.addEventListener('click', () => {
    if (!selectedWords.size) return;
    setWordsPersonStatus(selectedWords, false);
    exitWordSelectMode();
    renderWordGrid();
  });

  wordDeleteBtn.addEventListener('click', () => {
    if (!selectedWords.size) return;
    deleteWords(selectedWords);
    exitWordSelectMode();
    renderWordGrid();
  });

  // Enterを押すたびに1件ずつ登録する（IME変換確定のEnterと誤爆しないようcompositionを見る）
  let wordAddComposing = false;
  wordAddInput.addEventListener('compositionstart', () => { wordAddComposing = true; });
  wordAddInput.addEventListener('compositionend', () => { wordAddComposing = false; });
  wordAddInput.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || wordAddComposing || e.isComposing) return;
    e.preventDefault();
    addWord(wordAddInput.value);
    wordAddInput.value = '';
    renderWordGrid();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!nameModal.hidden) { finishName(null); return; }
    if (!folderPicker.hidden) { closeFolderPicker(); return; }
    if (!saveModal.hidden) { closeSaveModal(); return; }
    if (!wordbookScreen.hidden) {
      if (wordSelectMode) exitWordSelectMode();
      else closeWordbookScreen();
      return;
    }
    if (!allKanjiScreen.hidden) { closeAllKanjiScreen(); return; }
    if (isListScreenOpen()) {
      if (listView.query.trim()) setQuery('');
      else closeListScreen();
    }
  });

  // ================= スマホでの左→右スワイプで保存一覧メニューを開く =================
  let edgeSwipeStart = null;
  document.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'touch') return;
    if (isListScreenOpen()) return;
    if (state.reordering) return;
    if (!saveModal.hidden || !folderPicker.hidden || !nameModal.hidden) return;
    edgeSwipeStart = { x: e.clientX, y: e.clientY, t: Date.now() };
  }, { passive: true });
  document.addEventListener('pointerup', (e) => {
    if (!edgeSwipeStart) return;
    const { x, y, t } = edgeSwipeStart;
    edgeSwipeStart = null;
    if (e.pointerType !== 'touch') return;
    if (isListScreenOpen()) return;
    if (state.reordering) return;
    const dx = e.clientX - x;
    const dy = e.clientY - y;
    if (Date.now() - t > 700) return;
    if (dx > 60 && Math.abs(dy) < 50 && dx > Math.abs(dy) * 1.5) {
      openListScreen();
    }
  }, { passive: true });
  document.addEventListener('pointercancel', () => { edgeSwipeStart = null; }, { passive: true });

  // ================= 画面の実高さをCSS変数へ反映 =================
  // iOSのホーム画面追加（standalone）表示では100dvhが実際の画面高さより小さく
  // 計算されるバグがあり、bodyの高さがOSの本当のビューポートより短くなる。
  // bodyはtransformでposition:fixedな子要素（フッターやオーバーレイ画面）の基準に
  // なっているので、window.innerHeight（無ければvisualViewport.height）を実測して
  // --app-hに入れれば、フッター下に隙間ができる問題を解消できる。
  function syncAppHeight() {
    const h = window.innerHeight || (window.visualViewport && window.visualViewport.height) || 0;
    if (h) document.documentElement.style.setProperty('--app-h', h + 'px');
  }
  window.addEventListener('resize', syncAppHeight);
  window.addEventListener('orientationchange', syncAppHeight);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', syncAppHeight);

  // ================= フッター2段の実測サイズをCSS変数へ反映 =================
  // env(safe-area-inset-bottom)やbutton内のstretch挙動はブラウザ差が出やすいため、
  // calc()に頼らず実際に描画された高さを測って var(--toolfooter-h) / var(--footer-total-h) に入れる。
  function syncFooterOffsets() {
    const toolH = toolFooter.offsetHeight;
    const modeH = modeFooter.offsetHeight;
    modeFooter.style.bottom = toolH + 'px';
    document.documentElement.style.setProperty('--toolfooter-h', toolH + 'px');
    document.documentElement.style.setProperty('--footer-total-h', (toolH + modeH) + 'px');
  }
  window.addEventListener('resize', syncFooterOffsets);
  window.addEventListener('orientationchange', syncFooterOffsets);

  // ================= 起動 =================
  lastCommittedValue = input.value;
  setTitleDisplay('');
  updateModeTabsUI();
  setFocusMode(state.focusMode);
  autoGrow();
  renderCurrentMode();
  // アプリを開いたときは単語帳ページから始める
  openWordbookScreen(true);
  syncAppHeight();
  syncFooterOffsets();

  // オフラインでも起動できるよう、アプリのファイルを端末に保存するService Worker（sw.js）を登録する
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => { /* noop */ });
  }
})();

</script>
</body>
</html>
