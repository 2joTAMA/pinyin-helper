  function makeFolderRow(folder) {
    const wrap = document.createElement('div');
    wrap.className = 'listRowWrap';

    const actions = document.createElement('div');
    actions.className = 'listRowActions';

    const renameB = document.createElement('button');
    renameB.type = 'button';
    renameB.className = 'rowActionBtn actMove';
    renameB.innerHTML = PENCIL_SVG + '<span>名前</span>';
    renameB.addEventListener('click', (e) => {
      e.stopPropagation();
      renameFolderFlow(folder);
    });

    const delB = document.createElement('button');
    delB.type = 'button';
    delB.className = 'rowActionBtn actDelete';
    delB.innerHTML = TRASH_SVG + '<span>削除</span>';
    delB.addEventListener('click', (e) => {
      e.stopPropagation();
      const n = fileCountInFolder(folder.id);
      const msg = n
        ? 'フォルダ「' + folder.name + '」を削除します。\n中の' + n + '件も一緒に削除されます。'
        : 'フォルダ「' + folder.name + '」を削除しますか？';
      if (!window.confirm(msg)) return;
      savedFiles = savedFiles.filter((f) => f.folderId !== folder.id);
      folders = folders.filter((x) => x.id !== folder.id);
      expandedFolders.delete(folder.id);
      persistFolders();
      persistSavedFiles();
      renderListRows();
    });
    actions.appendChild(renameB);
    actions.appendChild(delB);

    if (expandedFolders.has(folder.id)) wrap.classList.add('expanded');

    const row = document.createElement('div');
    row.className = 'listRow folderRow';
    row.dataset.folderId = folder.id;

    const name = document.createElement('span');
    name.className = 'listTitle';
    name.innerHTML = FOLDER_SVG + '<span>' + escapeHtml(folder.name) + '</span>';

    const meta = document.createElement('span');
    meta.className = 'listMeta';
    const count = document.createElement('span');
    count.className = 'folderCount';
    count.textContent = String(fileCountInFolder(folder.id));
    const chev = document.createElement('span');
    chev.className = 'folderChevron';
    chev.innerHTML = CHEVRON_SVG;
    meta.appendChild(count);
    meta.appendChild(chev);

    row.appendChild(name);
    row.appendChild(meta);

    wrap.appendChild(actions);
    wrap.appendChild(row);
    attachFileRowGestures(wrap, row, () => {
      if (expandedFolders.has(folder.id)) expandedFolders.delete(folder.id);
      else expandedFolders.add(folder.id);
      renderListRows();
    }, true, {
      actionW: 128,
      attr: 'folderId',
      commit: commitFolderOrderFromDom,
      // 展開中に並び替えを始めたら、中身(.folderBody)を置き去りにしないよう先に畳む
      onDragStart: () => {
        if (!expandedFolders.has(folder.id)) return;
        expandedFolders.delete(folder.id);
        wrap.classList.remove('expanded');
        const body = wrap.nextSibling;
        if (body && body.classList && body.classList.contains('folderBody')) body.remove();
      },
    });
    return wrap;
  }

  // 行のジェスチャ：タップで開く／左スワイプでアクション表示／長押しで並び替え
  // ファイル行・フォルダ行の両方で使う共通実装。opts.attrで対象行の判別用データ属性
  // （'fileId'→data-file-id、'folderId'→data-folder-id）を切り替え、その種類の行同士でだけ
  // 並び替えが完結するようにする（opts省略時はファイル行向けの既定値で動く）。
  function attachFileRowGestures(wrap, row, onOpen, enableReorder, opts) {
    const ACTION_W = (opts && opts.actionW) || 192; // 移動・複製・削除の3ボタン分（64px × 3）
    const HOLD_MS = 380;
    const MOVE_CANCEL = 10;
    const itemAttr = (opts && opts.attr) || 'fileId';
    const itemSelector = '.listRow[data-' + itemAttr.replace(/[A-Z]/g, (m) => '-' + m.toLowerCase()) + ']';
    const commitOrder = (opts && opts.commit) || commitOrderFromDom;

    let startX = 0, startY = 0, grabX = 0, grabY = 0, lastY = 0;
    let pointerId = null;
    let holdTimer = null, armTimer = null;
    let mode = null; // null | 'swipe' | 'scroll' | 'drag'
    let currentX = 0;
    let placeholder = null;
    let offX = 0, offY = 0;
    let autoDir = 0, rafId = 0;
    let dragScope = null;

    function preventTouch(e) { e.preventDefault(); }
    function clearTimers() {
      clearTimeout(holdTimer); holdTimer = null;
      clearTimeout(armTimer); armTimer = null;
      wrap.classList.remove('armed');
    }

    row.addEventListener('pointerdown', (e) => {
      if (mode || pointerId !== null || !e.isPrimary) return;
      pointerId = e.pointerId;
      startX = grabX = e.clientX;
      startY = grabY = lastY = e.clientY;
      currentX = 0;
      mode = null;
      if (enableReorder) {
        armTimer = setTimeout(() => { if (mode === null) wrap.classList.add('armed'); }, Math.max(0, HOLD_MS - 130));
        holdTimer = setTimeout(startDrag, HOLD_MS);
      }
    });

    row.addEventListener('pointermove', (e) => {
      if (pointerId === null) return;
      grabX = e.clientX; grabY = lastY = e.clientY;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      if (mode === null) {
        if (Math.abs(dx) + Math.abs(dy) > MOVE_CANCEL) {
          clearTimers();
          mode = Math.abs(dx) > Math.abs(dy) ? 'swipe' : 'scroll';
          if (mode === 'swipe') {
            row.style.transition = 'none';
            try { row.setPointerCapture(pointerId); } catch (err) { /* noop */ }
          }
        }
      }

      if (mode === 'swipe') {
        currentX = Math.min(0, Math.max(-ACTION_W, dx));
        row.style.transform = 'translateX(' + currentX + 'px)';
      } else if (mode === 'drag') {
        e.preventDefault();
        wrap.style.left = (e.clientX - offX) + 'px';
        wrap.style.top = (e.clientY - offY) + 'px';
        updatePlaceholder(e.clientY);
        edgeAutoScroll(e.clientY);
      }
    });

    function endPointer(isUp) {
      if (pointerId === null) return;
      const pid = pointerId;
      const wasMode = mode;
      pointerId = null;
      clearTimers();

      if (wasMode === 'drag') { finishDrag(pid); mode = null; return; }
      try { row.releasePointerCapture(pid); } catch (err) { /* noop */ }

      if (wasMode === 'swipe') {
        row.style.transition = '';
        const open = currentX < -(ACTION_W / 3);
        row.style.transform = open ? 'translateX(-' + ACTION_W + 'px)' : '';
        row.classList.toggle('swiped', open);
        mode = null;
        return;
      }

      mode = null;
      if (wasMode === 'scroll' || !isUp) return;

      if (row.classList.contains('swiped')) {
        row.classList.remove('swiped');
        row.style.transform = '';
        return;
      }
      onOpen();
    }
    row.addEventListener('pointerup', () => endPointer(true));
    row.addEventListener('pointercancel', () => endPointer(false));
    row.addEventListener('contextmenu', (e) => { if (mode === 'drag' || wrap.classList.contains('armed')) e.preventDefault(); });

    function startDrag() {
      if (mode !== null || pointerId === null) return;
      mode = 'drag';
      wrap.classList.remove('armed');
      row.classList.remove('swiped');
      row.style.transition = '';
      row.style.transform = '';
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch (err) { /* noop */ } }
      // フォルダ行の場合、展開中の中身（.folderBody）を置き去りにしないよう
      // 並び替え開始時に呼び出し側で先に畳んでもらう
      if (opts && opts.onDragStart) opts.onDragStart();

      // 並び替えは今いる枠（ルート直下 or 展開中のフォルダの中）の中だけで完結させる
      dragScope = wrap.parentNode;

      const r = wrap.getBoundingClientRect();
      offX = grabX - r.left;
      offY = grabY - r.top;

      placeholder = document.createElement('div');
      placeholder.className = 'listRowPlaceholder';
      placeholder.style.height = r.height + 'px';
      wrap.parentNode.insertBefore(placeholder, wrap.nextSibling);

      wrap.style.width = r.width + 'px';
      wrap.style.left = r.left + 'px';
      wrap.style.top = r.top + 'px';
      wrap.classList.add('rowDragging');
      listRows.classList.add('isDragging');

      try { row.setPointerCapture(pointerId); } catch (err) { /* noop */ }
      document.addEventListener('touchmove', preventTouch, { passive: false });
    }

    function fileWraps() {
      return Array.prototype.filter.call(
        dragScope.querySelectorAll('.listRowWrap'),
        (w) => w !== wrap && w.querySelector(itemSelector)
      );
    }
    function updatePlaceholder(y) {
      if (!placeholder) return;
      const others = fileWraps();
      if (!others.length) { dragScope.appendChild(placeholder); return; }
      let target = null;
      for (let i = 0; i < others.length; i++) {
        const rr = others[i].getBoundingClientRect();
        if (y < rr.top + rr.height / 2) { target = others[i]; break; }
      }
      if (target) dragScope.insertBefore(placeholder, target);
      else dragScope.insertBefore(placeholder, others[others.length - 1].nextSibling);
    }
    function edgeAutoScroll(y) {
      // 一覧はヘッダーとタブバーの下まで広がっているので、実際に見えている範囲の上下端で判定する
      const topEdge = listScreen.querySelector('.pageTop').getBoundingClientRect().bottom;
      const bottomEdge = tabBar.getBoundingClientRect().top;
      autoDir = y < topEdge + 52 ? -1 : (y > bottomEdge - 52 ? 1 : 0);
      if (autoDir && !rafId) rafId = requestAnimationFrame(scrollTick);
    }
    function scrollTick() {
      rafId = 0;
      if (mode !== 'drag' || !autoDir) return;
      listRows.scrollTop += autoDir * 9;
      updatePlaceholder(lastY);
      rafId = requestAnimationFrame(scrollTick);
    }
    function finishDrag(pid) {
      document.removeEventListener('touchmove', preventTouch, { passive: false });
      autoDir = 0;
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      if (placeholder && placeholder.parentNode) {
        dragScope.insertBefore(wrap, placeholder);
        placeholder.remove();
      }
      placeholder = null;
      wrap.classList.remove('rowDragging');
      wrap.style.width = wrap.style.left = wrap.style.top = '';
      listRows.classList.remove('isDragging');
      try { row.releasePointerCapture(pid); } catch (err) { /* noop */ }
      commitOrder(dragScope);
      dragScope = null;
    }
  }

  // DOM 上のファイル行の並びを savedFiles に反映（表示中の行だけを、その枠内で入れ替える）
  function commitOrderFromDom(container) {
    const scope = container || listRows;
    const shownIds = Array.prototype.map.call(
      scope.querySelectorAll('.listRow[data-file-id]'),
      (r) => r.dataset.fileId
    );
    if (!shownIds.length) return;
    const shown = new Set(shownIds);
    const byId = new Map(savedFiles.map((f) => [f.id, f]));
    const queue = shownIds.map((id) => byId.get(id)).filter(Boolean);
    let qi = 0;
    savedFiles = savedFiles.map((f) => (shown.has(f.id) ? queue[qi++] : f));
    persistSavedFiles();
  }

  // DOM 上のフォルダ行の並びを folders に反映（commitOrderFromDomのフォルダ版）
  function commitFolderOrderFromDom(container) {
    const scope = container || listRows;
    const shownIds = Array.prototype.map.call(
      scope.querySelectorAll('.listRow[data-folder-id]'),
      (r) => r.dataset.folderId
    );
    if (!shownIds.length) return;
    const shown = new Set(shownIds);
    const byId = new Map(folders.map((f) => [f.id, f]));
    const queue = shownIds.map((id) => byId.get(id)).filter(Boolean);
    let qi = 0;
    folders = folders.map((f) => (shown.has(f.id) ? queue[qi++] : f));
    persistFolders();
  }

  // ---------- フォルダ移動ピッカー ----------
  function openFolderPicker(file) {
    folderPickerList.innerHTML = '';

    const mkItem = (label, active, isAction, onClick) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'folderPickItem' + (active ? ' active' : '') + (isAction ? ' action' : '');
      b.innerHTML = (isAction ? FOLDER_PLUS_SVG : FOLDER_SVG) +
        '<span>' + escapeHtml(label) + '</span>' + (active ? CHECK_SVG : '');
      b.addEventListener('click', onClick);
      folderPickerList.appendChild(b);
    };

    mkItem('フォルダなし', !file.folderId, false, () => moveFileToFolder(file, null));
    folders.forEach((f) => mkItem(f.name, file.folderId === f.id, false, () => moveFileToFolder(file, f.id)));
    mkItem('新規フォルダ…', false, true, async () => {
      const nm = await askName('新規フォルダ', '');
      if (!nm) return;
      moveFileToFolder(file, addFolder(nm).id);
    });

    folderPicker.hidden = false;
  }
  function closeFolderPicker() { folderPicker.hidden = true; }
  function moveFileToFolder(file, folderId) {
    file.folderId = folderId;
    persistSavedFiles();
    closeFolderPicker();
    renderListRows();
  }
  folderPickerCancel.addEventListener('click', closeFolderPicker);
  folderPicker.addEventListener('click', (e) => { if (e.target === folderPicker) closeFolderPicker(); });

  // ---------- 名前入力モーダル（フォルダの作成・改名で共用） ----------
  let nameResolve = null;
  function askName(heading, initial) {
    return new Promise((resolve) => {
      nameResolve = resolve;
      nameModalHeading.textContent = heading;
      nameModalInput.value = initial || '';
      nameModal.hidden = false;
      setTimeout(() => { nameModalInput.focus(); nameModalInput.select(); }, 0);
    });
  }
  function finishName(val) {
    if (!nameResolve) return;
    const r = nameResolve;
    nameResolve = null;
    nameModal.hidden = true;
    r(val);
  }
  nameModalCancel.addEventListener('click', () => finishName(null));
  nameModalOk.addEventListener('click', () => finishName(nameModalInput.value.trim() || null));
  nameModalInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); nameModalOk.click(); }
  });
  nameModal.addEventListener('click', (e) => { if (e.target === nameModal) finishName(null); });

  async function createFolderFlow() {
    const nm = await askName('新規フォルダ', '');
    if (!nm) return;
    addFolder(nm);
    renderListRows();
  }
  async function renameFolderFlow(folder) {
    const nm = await askName('フォルダ名を変更', folder.name);
    if (!nm) return;
    folder.name = nm;
    persistFolders();
    renderListRows();
  }

  function loadFile(file) {
    currentFileId = file.id;
    setTitleDisplay(file.title);
    // 保存済みのファイルは読むために開くことが多いので、入力欄は畳んで広く見せる
    setFocusMode(true);
    commitInputValue(file.text || '', { skipUndo: true });
    undoStack = [];
    undoBtn.disabled = true;
    renderInputPage();
    // 開いた直後は入力中の状態にせず、常に先頭が見える状態にする
    input.blur();
    results.scrollTop = 0;
  }

  function startNewFile() {
    currentFileId = null;
    setTitleDisplay('');
    setFocusMode(false);
    commitInputValue('', { skipUndo: true });
    undoStack = [];
    undoBtn.disabled = true;
    renderInputPage();
  }

  listNewBtn.addEventListener('click', () => {
    autoSaveBeforeLeaving();
    startNewFile();
    showTab('input');
  });

  newBtn.addEventListener('click', () => {
    autoSaveBeforeLeaving();
    startNewFile();
  });

  // ================= 単語帳 =================
  let wordSelectMode = false;
  const selectedWords = new Set();

  function updateWordSelectUI() {
    wordSelectToggleBtn.classList.toggle('active', wordSelectMode);
    wordSelectToggleBtn.setAttribute('aria-pressed', wordSelectMode ? 'true' : 'false');
    wordSelectToggleBtn.textContent = wordSelectMode ? '完了' : '選択';
    wordMarkPersonBtn.hidden = !wordSelectMode;
    wordMarkPersonBtn.disabled = selectedWords.size === 0;
    wordUnmarkPersonBtn.hidden = !wordSelectMode;
    wordUnmarkPersonBtn.disabled = selectedWords.size === 0;
    wordDeleteBtn.hidden = !wordSelectMode;
    wordDeleteBtn.disabled = selectedWords.size === 0;
    wordSelectCount.textContent = wordSelectMode && selectedWords.size ? selectedWords.size + '件選択中' : '';
    // 選択中は表示切り替えを隠し、同じ場所に人名登録・解除・削除のボタンを出す
    wordbookDisplayToggles.hidden = wordSelectMode;
  }

  function exitWordSelectMode() {
    wordSelectMode = false;
    selectedWords.clear();
    updateWordSelectUI();
  }

  // 現在の並び替えモードに応じたグループ情報（見出し・右端インデックス用）を返す。
  // 登録順のときはグループ化しない（null）。
  function wordGroupInfo(word) {
    if (wordSortMode === 'pinyin') {
      const firstChar = Array.from(word)[0] || '';
      const initial = splitPinyinBase(getBasePinyin(firstChar) || '').initial;
      const text = initial || ALL_KANJI_INDEX_NO_INITIAL_LABEL;
      return { key: initial, indexText: text, headerText: text };
    }
    if (wordSortMode === 'tone') {
      const [t1, t2] = wordToneGroupDigits(word);
      const key = t1 + '_' + t2;
      const indexText = t2 ? t1 + t2 : t1;
      const headerText = t2
        ? (TONE_GROUP_NAME[t1] || '?') + '-' + (TONE_GROUP_NAME[t2] || '?')
        : (TONE_GROUP_NAME[t1] || '?');
      return { key, indexText, headerText };
    }
    return null;
  }

  function renderWordGrid() {
    wordGrid.innerHTML = '';
    wordGrid.classList.toggle('contourMode', state.contourOn);
    wordbookIndex.innerHTML = '';
    const grouped = wordSortMode !== 'registered';
    wordbookIndex.hidden = !grouped;
    // 登録順のときは目次が無いので、代わりに「一番上に戻る」ボタンを出す
    wordScrollTopBtn.hidden = grouped || !savedWords.length;
    if (!savedWords.length) {
      wordGrid.innerHTML = '<div class="listEmpty">まだ単語が登録されていません</div>';
      return;
    }
    const indexFrag = document.createDocumentFragment();
    let lastGroupKey = null;
    // カードを入れる先。ピンイン順／声調順のときはグループ（見出し＋カードの並び）ごとに分ける。
    // グループごとにまとめておくと、見出しがそのグループの間だけ上に固定され、次のグループの見出しに押し上げられる
    let chipParent = wordGrid;
    getSortedWords().forEach((word) => {
      if (grouped) {
        const info = wordGroupInfo(word);
        if (info && info.key !== lastGroupKey) {
          lastGroupKey = info.key;
          const section = document.createElement('section');
          section.className = 'wordGroup';
          section.dataset.groupKey = info.key;
          const label = document.createElement('div');
          label.className = 'wordGroupLabel';
          label.textContent = info.headerText;
          section.appendChild(label);
          chipParent = document.createElement('div');
          chipParent.className = 'wordGroupGrid';
          section.appendChild(chipParent);
          wordGrid.appendChild(section);

          const item = document.createElement('div');
          item.className = 'wordbookIndexItem';
          item.dataset.groupKey = info.key;
          item.textContent = info.indexText;
          indexFrag.appendChild(item);
        }
      }

      const isPerson = personWords.has(word);
      const chip = document.createElement('div');
      chip.className = 'wordChip' + (isPerson ? ' person' : '') + (selectedWords.has(word) ? ' selected' : '');
      chip.dataset.word = word;

      if (isPerson) {
        const badge = document.createElement('div');
        badge.className = 'wordChipPersonIcon';
        badge.innerHTML = PERSON_SVG;
        chip.appendChild(badge);
      }

      if (state.contourOn) {
        chip.appendChild(buildWordContourRow(word));
      } else {
        const hz = document.createElement('div');
        hz.className = 'wordChipHz';
        renderDisplayText(hz, word);
        chip.appendChild(hz);

        const py = document.createElement('div');
        py.className = 'wordChipPy';
        // ピンインなしモードでも枠（高さ24px固定）は残して、カードの高さ・漢字の位置を変えない
        py.textContent = state.pinyinOff ? '' : lineToPinyin(word);
        chip.appendChild(py);
      }

      chip.addEventListener('click', () => {
        if (!wordSelectMode) return;
        if (selectedWords.has(word)) selectedWords.delete(word);
        else selectedWords.add(word);
        chip.classList.toggle('selected');
        updateWordSelectUI();
      });

      chipParent.appendChild(chip);
    });
    wordbookIndex.appendChild(indexFrag);
    wordbookIndexHighlighter.refresh();

    fitAllWordChipPy();
  }
  const wordbookIndexHighlighter = createIndexHighlighter({
    screen: wordbookScreen, grid: wordGrid, index: wordbookIndex, groupSelector: '.wordGroup', key: 'groupKey',
  });

  // 単語帳の右端インデックスをタップ／ドラッグして、そのグループの先頭見出しへジャンプする
  // （全漢字ページの同機能と同じ操作感にしている）
  function jumpWordbookToGroup(groupKey) {
    const target = wordGrid.querySelector('.wordGroup[data-group-key="' + CSS.escape(groupKey) + '"]');
    if (target) scrollChildToTop(wordGrid, target);
  }
  function wordbookIndexItemAt(x, y) {
    const el = document.elementFromPoint(x, y);
    return el ? el.closest('.wordbookIndexItem') : null;
  }
  let wordbookIndexActiveEl = null;
  function setWordbookIndexActive(item) {
    if (wordbookIndexActiveEl && wordbookIndexActiveEl !== item) wordbookIndexActiveEl.classList.remove('active');
    wordbookIndexActiveEl = item || null;
    if (wordbookIndexActiveEl) wordbookIndexActiveEl.classList.add('active');
  }
  wordScrollTopBtn.addEventListener('click', () => wordGrid.scrollTo({ top: 0, behavior: 'smooth' }));
  wordbookIndex.addEventListener('click', (e) => {
    const item = e.target.closest('.wordbookIndexItem');
    if (item) jumpWordbookToGroup(item.dataset.groupKey);
  });
  wordbookIndex.addEventListener('touchstart', (e) => {
    const item = wordbookIndexItemAt(e.touches[0].clientX, e.touches[0].clientY);
    if (item) { jumpWordbookToGroup(item.dataset.groupKey); setWordbookIndexActive(item); }
  }, { passive: true });
  wordbookIndex.addEventListener('touchmove', (e) => {
    const item = wordbookIndexItemAt(e.touches[0].clientX, e.touches[0].clientY);
    if (item && item !== wordbookIndexActiveEl) { jumpWordbookToGroup(item.dataset.groupKey); setWordbookIndexActive(item); }
    e.preventDefault();
  }, { passive: false });
  wordbookIndex.addEventListener('touchend', () => setWordbookIndexActive(null));
  wordbookIndex.addEventListener('touchcancel', () => setWordbookIndexActive(null));

  // 声調123／記号表記を切り替えても行の高さが動かないよう、ピンインが1行に収まるまで
  // 文字サイズを少しずつ縮める（最小サイズでも収まらなければCSSの省略記号に任せる）。
  // 描画直後はまだ画面が非表示のことがあるので、確実に幅が測れるよう次フレームで実行する。
  // カード1枚ずつ「縮める→測る」を繰り返すと、そのたびにブラウザが画面全体の配置を計算し直して
  // 単語が多いと数秒かかるので、全カードをまとめて測る→まとめて縮める、を交互に行う。
  // 最初の縮小幅は「収まる幅 ÷ 今の幅」の比で見積もる（字間の分だけ必ず大きめに出るので、
  // そこから1pxずつ下げれば、1pxずつ縮めていたときと同じ大きさに落ち着く）。
  const WORD_CHIP_PY_MAX_PX = 19;
  const WORD_CHIP_PY_MIN_PX = 12;
  function fitAllWordChipPy() {
    requestAnimationFrame(() => {
      const els = Array.from(wordGrid.querySelectorAll('.wordChipPy')).filter((el) => el.textContent);
      els.forEach((el) => { el.style.fontSize = ''; });
      // 測る（ここで1回だけ配置が計算される）
      let pending = els
        .map((el) => ({ el, maxWidth: el.clientWidth, width: el.scrollWidth, size: WORD_CHIP_PY_MAX_PX }))
        .filter((p) => p.maxWidth && p.width > p.maxWidth + 0.5);
      // 縮める
      pending.forEach((p) => {
        const estimate = Math.floor(WORD_CHIP_PY_MAX_PX * p.maxWidth / p.width);
        p.size = Math.max(WORD_CHIP_PY_MIN_PX, Math.min(WORD_CHIP_PY_MAX_PX - 1, estimate));
        p.el.style.fontSize = p.size + 'px';
      });
      // まだはみ出しているものだけ、1pxずつ下げて測り直す
      while (pending.length) {
        pending = pending.filter((p) => p.size > WORD_CHIP_PY_MIN_PX && p.el.scrollWidth > p.maxWidth + 0.5);
        pending.forEach((p) => {
          p.size -= 1;
          p.el.style.fontSize = p.size + 'px';
        });
      }
    });
  }

  // ================= ページ切り替え（フッターのタブバー） =================
  // 入力ページが土台で、保存一覧・単語帳・全漢字はその上に全画面で重ねる。表示するページだけhiddenを外す。
  // opts.skipFocus=trueのときは追加欄にフォーカスしない（起動直後にキーボードが勝手に出ないようにする）
  function showTab(tab, opts) {
    opts = opts || {};
    // 表示中のタブをもう一度押したときは、そのページの一番上までスクロールするだけ
    if (tab === state.tab && !opts.force) {
      const scroller = { list: listRows, input: results, wordbook: wordGrid, allKanji: allKanjiGrid }[tab];
      if (scroller) scroller.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    // 保存一覧へ移るときは、保存済みのファイルに未保存の変更があれば自動保存する
    if (tab === 'list') autoSaveBeforeLeaving();
    closeWordSheet();
    exitWordSelectMode();

    if (tab === 'list') prepareListScreen();
    if (tab === 'wordbook') { wordAddInput.value = ''; renderWordGrid(); }
    if (tab === 'allKanji') { allKanjiAddInput.value = ''; renderAllKanjiGrid(); }
    // 何も入力されていない状態で入力ページに移ったときは、すぐ書けるよう入力欄を開く
    if (tab === 'input' && !input.value.trim()) setFocusMode(false);

    listScreen.hidden = tab !== 'list';
    wordbookScreen.hidden = tab !== 'wordbook';
    allKanjiScreen.hidden = tab !== 'allKanji';
    state.tab = tab;
    updateTabBarUI();

    if (!opts.skipFocus) {
      if (tab === 'wordbook') setTimeout(() => wordAddInput.focus(), 0);
      if (tab === 'allKanji') setTimeout(() => allKanjiAddInput.focus(), 0);
    }
  }

  // 選択中のタブに色を付け、背景（#tabIndicator）をそのタブの位置へすべらせる
  function updateTabBarUI() {
    const idx = tabItems.findIndex((b) => b.dataset.tab === state.tab);
    tabItems.forEach((b) => {
      const on = b.dataset.tab === state.tab;
      b.classList.toggle('active', on);
      if (on) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    tabIndicator.style.transform = 'translateX(' + (Math.max(0, idx) * 100) + '%)';
  }
  tabItems.forEach((b) => b.addEventListener('click', () => showTab(b.dataset.tab)));

  // Enterを押すたびに1件ずつ、入力に含まれる漢字を全部登録する（重複は自動で無視）
  let allKanjiAddComposing = false;
  allKanjiAddInput.addEventListener('compositionstart', () => { allKanjiAddComposing = true; });
  allKanjiAddInput.addEventListener('compositionend', () => { allKanjiAddComposing = false; });
  allKanjiAddInput.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || allKanjiAddComposing || e.isComposing) return;
    e.preventDefault();
    addAllKanji(allKanjiAddInput.value);
    allKanjiAddInput.value = '';
    renderAllKanjiGrid();
  });

  // 入力バーの右に出る「すべて消す」ボタン。普通にクリックで処理すると、押した瞬間に入力欄から
  // フォーカスが外れてボタン自体が引っ込んでしまうので、押し始め（pointerdown）で処理してフォーカスを保つ
  [[wordAddClearBtn, wordAddInput], [allKanjiAddClearBtn, allKanjiAddInput]].forEach(([btn, field]) => {
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      field.value = '';
      field.focus();
    });
  });

  wordSelectToggleBtn.addEventListener('click', () => {
    wordSelectMode = !wordSelectMode;
    selectedWords.clear();
    updateWordSelectUI();
    renderWordGrid();
  });

  wordSortBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      if (btn.dataset.sort === wordSortMode) return;
      wordSortMode = btn.dataset.sort;
      updateWordSortBtnsUI();
      renderWordGrid();
    });
  });

  wordMarkPersonBtn.addEventListener('click', () => {
    if (!selectedWords.size) return;
    setWordsPersonStatus(selectedWords, true);
    exitWordSelectMode();
    renderWordGrid();
  });

  wordUnmarkPersonBtn.addEventListener('click', () => {
    if (!selectedWords.size) return;
    setWordsPersonStatus(selectedWords, false);
    exitWordSelectMode();
    renderWordGrid();
  });

  wordDeleteBtn.addEventListener('click', () => {
    if (!selectedWords.size) return;
    deleteWords(selectedWords);
    exitWordSelectMode();
    renderWordGrid();
  });

  // Enterを押すたびに1件ずつ登録する（IME変換確定のEnterと誤爆しないようcompositionを見る）
  let wordAddComposing = false;
  wordAddInput.addEventListener('compositionstart', () => { wordAddComposing = true; });
  wordAddInput.addEventListener('compositionend', () => { wordAddComposing = false; });
  wordAddInput.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || wordAddComposing || e.isComposing) return;
    e.preventDefault();
    addWord(wordAddInput.value);
    wordAddInput.value = '';
    renderWordGrid();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!nameModal.hidden) { finishName(null); return; }
    if (!folderPicker.hidden) { closeFolderPicker(); return; }
    if (!saveModal.hidden) { closeSaveModal(); return; }
    if (state.tab === 'wordbook' && wordSelectMode) { exitWordSelectMode(); renderWordGrid(); }
  });

  // ================= 画面の実高さをCSS変数へ反映 =================
  // iOSのホーム画面追加（standalone）表示では100dvhが実際の画面高さより小さく
  // 計算されるバグがあり、bodyの高さがOSの本当のビューポートより短くなる。
  // bodyはtransformでposition:fixedな子要素（タブバーや各ページ）の基準に
  // なっているので、window.innerHeight（無ければvisualViewport.height）を実測して
  // --app-hに入れれば、タブバーの下に隙間ができる問題を解消できる。
  function syncAppHeight() {
    const h = window.innerHeight || (window.visualViewport && window.visualViewport.height) || 0;
    if (h) document.documentElement.style.setProperty('--app-h', h + 'px');
  }
  window.addEventListener('resize', syncAppHeight);
  window.addEventListener('orientationchange', syncAppHeight);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', syncAppHeight);

  // ================= 各ページ上部（ヘッダーなど）の高さをCSS変数へ反映 =================
  // 上部は内容の上に重ねて表示している（すりガラスで後ろが透ける）ので、その高さを実測して
  // ページごとに --top-h に入れ、スクロール領域の上余白にする。入力欄の高さが変わったときも追従する
  document.querySelectorAll('.pageTop').forEach((top) => {
    const host = top.parentElement;
    const update = () => {
      host.style.setProperty('--top-h', top.offsetHeight + 'px');
      // 全漢字・単語帳は目次の色付けのためにグループの位置を覚えているので、上部の高さが変わったら測り直す
      if (host === allKanjiScreen) allKanjiIndexHighlighter.refresh();
      if (host === wordbookScreen) wordbookIndexHighlighter.refresh();
    };
    if (window.ResizeObserver) new ResizeObserver(update).observe(top);
    update();
  });

  // iOSのSafariは、どこかにtouchstartの処理が無いとボタンを押している間の見た目（:active）を出さない
  document.addEventListener('touchstart', () => {}, { passive: true });

  // ================= タブバーが占める高さをCSS変数へ反映 =================
  // env(safe-area-inset-bottom)を含む位置はブラウザ差が出やすいため、実際に描画された位置を測って
  // 「画面下端からタブバー上端まで」の高さを var(--footer-total-h) に入れる（各ページの下余白に使う）。
  function syncFooterOffsets() {
    const h = document.body.getBoundingClientRect().bottom - tabBar.getBoundingClientRect().top;
    document.documentElement.style.setProperty('--footer-total-h', Math.max(0, Math.round(h)) + 'px');
  }
  window.addEventListener('resize', syncFooterOffsets);
  window.addEventListener('orientationchange', syncFooterOffsets);

  // ================= 起動 =================
  lastCommittedValue = input.value;
  setTitleDisplay('');
  setFocusMode(state.focusMode);
  autoGrow();
  updateDisplayTogglesUI();
  renderInputPage();
  // アプリを開いたときは単語帳ページから始める（起動時はタブの背景をすべらせずにその位置へ置く）
  tabIndicator.style.transition = 'none';
  showTab('wordbook', { skipFocus: true, force: true });
  requestAnimationFrame(() => requestAnimationFrame(() => { tabIndicator.style.transition = ''; }));
  syncAppHeight();
  syncFooterOffsets();

  // オフラインでも起動できるよう、アプリのファイルを端末に保存するService Worker（sw.js）を登録する
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => { /* noop */ });
  }
})();

</script>
</body>
</html>
