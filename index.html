  // サブタイトル（自由記述）を1行目ヘッダーに表示
  function setSubtitleDisplay(subtitle) {
    fileTitle.textContent = subtitle || '';
  }

  // 文章モードの自動タイトル：先頭の文字を適度な文字数だけ抽出
  function defaultTitleFromText(text) {
    const flat = text.replace(/\s+/g, '').trim();
    if (!flat) return '無題';
    return flat.length > 14 ? flat.slice(0, 14) + '…' : flat;
  }

  // 単漢字モードの自動タイトル：グループ（行）ごとの代表ピンインを、同じ音は重複させずに半角スペースで連結
  function kanjiAutoTitle(text) {
    const lines = parseKanjiLines(text);
    const seen = new Set();
    const labels = [];
    lines.forEach((chars) => {
      if (!chars.length) return;
      const label = getBasePinyin(chars[0]) || chars[0];
      if (seen.has(label)) return;
      seen.add(label);
      labels.push(label);
    });
    return labels.length ? labels.join(' ') : '無題';
  }

  // モードに応じた自動タイトルを算出する
  function computeAutoTitle(mode, text) {
    return mode === 'kanji' ? kanjiAutoTitle(text) : defaultTitleFromText(text);
  }

  // 2行目ヘッダーの自動タイトルを、現在の入力内容から更新する
  function updateAutoTitleDisplay() {
    autoTitleText.textContent = computeAutoTitle(state.mode, input.value);
  }

  function flashSaved() {
    saveBtn.classList.add('justSaved');
    setTimeout(() => saveBtn.classList.remove('justSaved'), 700);
  }

  // 現在の内容が、最後に保存した状態から変わっているか（未保存の変更があるか）
  function isDirty() {
    if (currentFileId) {
      const f = savedFiles.find((x) => x.id === currentFileId);
      if (!f) return false;
      return f.text !== input.value || f.mode !== state.mode;
    }
    return input.value.trim() !== '';
  }
  function updateSaveBtnDirtyState() {
    saveBtn.classList.toggle('dirty', isDirty());
  }

  let modalContext = null; // { mode: 'new' } | { mode: 'rename', fileId }

  function updateModalClearBtn() {
    modalClearBtn.classList.toggle('show', modalTitleInput.value.length > 0);
  }

  function openSaveModal(ctx) {
    modalContext = ctx;
    modalHeading.textContent = ctx.mode === 'rename' ? 'サブタイトルを編集' : '保存';
    if (ctx.mode === 'rename') {
      const f = savedFiles.find((x) => x.id === ctx.fileId);
      modalTitleInput.value = f ? (f.subtitle || '') : '';
    } else {
      modalTitleInput.value = '';
    }
    modalTitleInput.placeholder = '例）挨拶フレーズまとめ';
    updateModalClearBtn();
    saveModal.hidden = false;
    setTimeout(() => modalTitleInput.focus(), 0);
  }
  function closeSaveModal() {
    saveModal.hidden = true;
    modalContext = null;
  }

  // 既存ファイルの内容を保存する（単漢字モードなら保存前に自動で再グループ化する）
  function saveExistingFile() {
    if (state.mode === 'kanji') performGrouping();
    const idx = savedFiles.findIndex((f) => f.id === currentFileId);
    if (idx < 0) return;
    savedFiles[idx].text = input.value;
    savedFiles[idx].mode = state.mode;
    savedFiles[idx].title = computeAutoTitle(state.mode, input.value);
    savedFiles[idx].updatedAt = Date.now();
    persistSavedFiles();
  }

  // 一覧や新規作成へ移動する前に呼ぶ：一度でも保存済みのファイルに未保存の変更があれば自動保存する。
  // まだ一度も保存していない新規ファイルは、確認なしで破棄してよい。
  function autoSaveBeforeLeaving() {
    if (currentFileId && isDirty()) saveExistingFile();
  }

  saveBtn.addEventListener('click', () => {
    if (currentFileId) {
      saveExistingFile();
      flashSaved();
      updateAutoTitleDisplay();
      updateSaveBtnDirtyState();
    } else {
      openSaveModal({ mode: 'new' });
    }
  });

  renameBtn.addEventListener('click', () => {
    if (!currentFileId) { openSaveModal({ mode: 'new' }); return; }
    openSaveModal({ mode: 'rename', fileId: currentFileId });
  });

  modalCancelBtn.addEventListener('click', closeSaveModal);
  saveModal.addEventListener('click', (e) => { if (e.target === saveModal) closeSaveModal(); });
  modalTitleInput.addEventListener('input', updateModalClearBtn);
  modalClearBtn.addEventListener('click', () => {
    modalTitleInput.value = '';
    updateModalClearBtn();
    modalTitleInput.focus();
  });
  modalTitleInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); modalSaveBtn.click(); }
  });

  modalSaveBtn.addEventListener('click', () => {
    if (!modalContext) return;
    const subtitle = modalTitleInput.value.trim();

    if (modalContext.mode === 'rename') {
      const idx = savedFiles.findIndex((f) => f.id === modalContext.fileId);
      if (idx >= 0) {
        savedFiles[idx].subtitle = subtitle;
        persistSavedFiles();
      }
      if (modalContext.fileId === currentFileId) setSubtitleDisplay(subtitle);
      if (listScreen.classList.contains('open')) renderListRows();
    } else {
      if (state.mode === 'kanji') performGrouping(); // 保存時は自動で再グループ化する
      const file = {
        id: 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
        title: computeAutoTitle(state.mode, input.value),
        subtitle: subtitle,
        mode: state.mode,
        text: input.value,
        folderId: null, // アコーディオン化により「今開いているフォルダ」という概念がないため常にルートへ保存
        updatedAt: Date.now(),
      };
      savedFiles.unshift(file); // 新規保存は一覧の先頭へ。以降は手動の並び順を保持
      persistSavedFiles();
      currentFileId = file.id;
      setSubtitleDisplay(subtitle);
      updateAutoTitleDisplay();
      updateSaveBtnDirtyState();
    }
    closeSaveModal();
  });

  // ================= 保存一覧（左からスワイプインするメニュー） =================
  function openListScreen() {
    closeWordSheet();
    updateListChrome();
    listSearchInput.value = listView.query;
    listSearchClear.hidden = !listView.query;
    renderListRows();
    listScreen.classList.add('open');
    listBackdrop.classList.add('open');
  }
  function closeListScreen() {
    listScreen.classList.remove('open');
    listBackdrop.classList.remove('open');
  }
  function isListScreenOpen() {
    return listScreen.classList.contains('open');
  }

  function updateListChrome() {
    listBrand.textContent = listView.query.trim() ? '検索結果' : '保存一覧';
  }

  function setQuery(q) {
    listView.query = q;
    if (listSearchInput.value !== q) listSearchInput.value = q;
    listSearchClear.hidden = !q;
    updateListChrome();
    renderListRows();
    listRows.scrollTop = 0;
  }
  listSearchInput.addEventListener('input', () => setQuery(listSearchInput.value));
  listSearchClear.addEventListener('click', () => { setQuery(''); listSearchInput.focus(); });

  function emptyRow(msg) {
    const empty = document.createElement('div');
    empty.className = 'listEmpty';
    empty.textContent = msg;
    return empty;
  }

  function renderListRows() {
    listRows.innerHTML = '';
    const q = listView.query.trim();

    // 検索中：全ファイルを横断してフラット表示
    if (q) {
      const hits = savedFiles.filter((f) => fileMatchesQuery(f, q));
      if (!hits.length) {
        listRows.appendChild(emptyRow('該当する保存はありません'));
        return;
      }
      hits.forEach((file) => listRows.appendChild(makeListRow(file, { showFolder: true })));
      return;
    }

    // フォルダ一覧（アコーディオン開閉）→ ルート直下のファイル
    const newFolderBtn = document.createElement('button');
    newFolderBtn.type = 'button';
    newFolderBtn.className = 'newFolderRow';
    newFolderBtn.innerHTML = FOLDER_PLUS_SVG + '<span>新規フォルダ</span>';
    newFolderBtn.addEventListener('click', createFolderFlow);
    listRows.appendChild(newFolderBtn);

    folders
      .slice()
      .sort((a, b) => a.name.localeCompare(b.name, 'ja'))
      .forEach((folder) => {
        listRows.appendChild(makeFolderRow(folder));
        if (!expandedFolders.has(folder.id)) return;
        const body = document.createElement('div');
        body.className = 'folderBody';
        const inFolder = savedFiles.filter((f) => (f.folderId || null) === folder.id);
        if (!inFolder.length) {
          body.appendChild(emptyRow('このフォルダは空です'));
        } else {
          inFolder.forEach((file) => body.appendChild(makeListRow(file, {})));
        }
        listRows.appendChild(body);
      });

    const rootFiles = savedFiles
      .filter((f) => !f.folderId || !folders.some((d) => d.id === f.folderId));

    if (folders.length && rootFiles.length) {
      const div = document.createElement('div');
      div.className = 'listSectionDivider';
      listRows.appendChild(div);
    }
    if (!folders.length && !rootFiles.length) {
      listRows.appendChild(emptyRow('保存された内容はまだありません'));
      return;
    }
    rootFiles.forEach((file) => listRows.appendChild(makeListRow(file, {})));
  }

  // 保存済みファイルを複製する。複製は元ファイルのすぐ後ろに挿入する
  function duplicateFile(file) {
    const copy = Object.assign({}, file, {
      id: 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      updatedAt: Date.now(),
    });
    const idx = savedFiles.findIndex((f) => f.id === file.id);

  function attachSwipe(row, width) {
    const w = width || 64;
    let startX = 0, startY = 0, currentX = 0;
    let dragging = false, axisLocked = false, horizontal = false;
    row.addEventListener('pointerdown', (e) => {
      startX = e.clientX; startY = e.clientY;
      currentX = 0; dragging = true; axisLocked = false; horizontal = false;
      row.style.transition = 'none';
    });
    row.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (!axisLocked && Math.abs(dx) + Math.abs(dy) > 8) {
        axisLocked = true;
        horizontal = Math.abs(dx) > Math.abs(dy);
      }
      if (!horizontal) return;
      currentX = Math.min(0, Math.max(-w, dx));
      row.style.transform = 'translateX(' + currentX + 'px)';
    });
    function endDrag() {
      if (!dragging) return;
      dragging = false;
      row.style.transition = '';
      const open = currentX < -(w / 3);
      row.style.transform = open ? 'translateX(-' + w + 'px)' : '';
      row.classList.toggle('swiped', open);
    }
    row.addEventListener('pointerup', endDrag);
    row.addEventListener('pointercancel', endDrag);
  }

  // ファイル行のジェスチャ：タップで開く／左スワイプでアクション表示／長押しで並び替え
  function attachFileRowGestures(wrap, row, onOpen, enableReorder) {
    const ACTION_W = 192; // 移動・複製・削除の3ボタン分（64px × 3）
    const HOLD_MS = 380;
    const MOVE_CANCEL = 10;

    let startX = 0, startY = 0, grabX = 0, grabY = 0, lastY = 0;
    let pointerId = null;
    let holdTimer = null, armTimer = null;
    let mode = null; // null | 'swipe' | 'scroll' | 'drag'
    let currentX = 0;
    let placeholder = null;
    let offX = 0, offY = 0;
    let autoDir = 0, rafId = 0;
    let dragScope = null;

    function preventTouch(e) { e.preventDefault(); }
    function clearTimers() {
      clearTimeout(holdTimer); holdTimer = null;
      clearTimeout(armTimer); armTimer = null;
      wrap.classList.remove('armed');
    }

    row.addEventListener('pointerdown', (e) => {
      if (mode || pointerId !== null || !e.isPrimary) return;
      pointerId = e.pointerId;
      startX = grabX = e.clientX;
      startY = grabY = lastY = e.clientY;
      currentX = 0;
      mode = null;
      if (enableReorder) {
        armTimer = setTimeout(() => { if (mode === null) wrap.classList.add('armed'); }, Math.max(0, HOLD_MS - 130));
        holdTimer = setTimeout(startDrag, HOLD_MS);
      }
    });

    row.addEventListener('pointermove', (e) => {
      if (pointerId === null) return;
      grabX = e.clientX; grabY = lastY = e.clientY;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      if (mode === null) {
        if (Math.abs(dx) + Math.abs(dy) > MOVE_CANCEL) {
          clearTimers();
          mode = Math.abs(dx) > Math.abs(dy) ? 'swipe' : 'scroll';
          if (mode === 'swipe') {
            row.style.transition = 'none';
            try { row.setPointerCapture(pointerId); } catch (err) { /* noop */ }
          }
        }
      }

      if (mode === 'swipe') {
        currentX = Math.min(0, Math.max(-ACTION_W, dx));
        row.style.transform = 'translateX(' + currentX + 'px)';
      } else if (mode === 'drag') {
        e.preventDefault();
        wrap.style.left = (e.clientX - offX) + 'px';
        wrap.style.top = (e.clientY - offY) + 'px';
        updatePlaceholder(e.clientY);
        edgeAutoScroll(e.clientY);
      }
    });

    function endPointer(isUp) {
      if (pointerId === null) return;
      const pid = pointerId;
      const wasMode = mode;
      pointerId = null;
      clearTimers();

      if (wasMode === 'drag') { finishDrag(pid); mode = null; return; }
      try { row.releasePointerCapture(pid); } catch (err) { /* noop */ }

      if (wasMode === 'swipe') {
        row.style.transition = '';
        const open = currentX < -(ACTION_W / 3);
        row.style.transform = open ? 'translateX(-' + ACTION_W + 'px)' : '';
        row.classList.toggle('swiped', open);
        mode = null;
        return;
      }

      mode = null;
      if (wasMode === 'scroll' || !isUp) return;

      if (row.classList.contains('swiped')) {
        row.classList.remove('swiped');
        row.style.transform = '';
        return;
      }
      onOpen();
    }
    row.addEventListener('pointerup', () => endPointer(true));
    row.addEventListener('pointercancel', () => endPointer(false));
    row.addEventListener('contextmenu', (e) => { if (mode === 'drag' || wrap.classList.contains('armed')) e.preventDefault(); });

    function startDrag() {
      if (mode !== null || pointerId === null) return;
      mode = 'drag';
      wrap.classList.remove('armed');
      row.classList.remove('swiped');
      row.style.transition = '';
      row.style.transform = '';
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch (err) { /* noop */ } }

      // 並び替えは今いる枠（ルート直下 or 展開中のフォルダの中）の中だけで完結させる
      dragScope = wrap.parentNode;

      const r = wrap.getBoundingClientRect();
      offX = grabX - r.left;
      offY = grabY - r.top;

      placeholder = document.createElement('div');
      placeholder.className = 'listRowPlaceholder';
      placeholder.style.height = r.height + 'px';
      wrap.parentNode.insertBefore(placeholder, wrap.nextSibling);

      wrap.style.width = r.width + 'px';
      wrap.style.left = r.left + 'px';
      wrap.style.top = r.top + 'px';
      wrap.classList.add('rowDragging');
      listRows.classList.add('isDragging');

      try { row.setPointerCapture(pointerId); } catch (err) { /* noop */ }
      document.addEventListener('touchmove', preventTouch, { passive: false });
    }

    function fileWraps() {
      return Array.prototype.filter.call(
        dragScope.querySelectorAll('.listRowWrap'),
        (w) => w !== wrap && w.querySelector('.listRow[data-file-id]')
      );
    }
    function updatePlaceholder(y) {
      if (!placeholder) return;
      const others = fileWraps();
      if (!others.length) { dragScope.appendChild(placeholder); return; }
      let target = null;
      for (let i = 0; i < others.length; i++) {
        const rr = others[i].getBoundingClientRect();
        if (y < rr.top + rr.height / 2) { target = others[i]; break; }
      }
      if (target) dragScope.insertBefore(placeholder, target);
      else dragScope.insertBefore(placeholder, others[others.length - 1].nextSibling);
    }
    function edgeAutoScroll(y) {
      const lr = listRows.getBoundingClientRect();
      autoDir = y < lr.top + 52 ? -1 : (y > lr.bottom - 52 ? 1 : 0);
      if (autoDir && !rafId) rafId = requestAnimationFrame(scrollTick);
    }
    function scrollTick() {
      rafId = 0;
      if (mode !== 'drag' || !autoDir) return;
      listRows.scrollTop += autoDir * 9;
      updatePlaceholder(lastY);
      rafId = requestAnimationFrame(scrollTick);
    }
    function finishDrag(pid) {
      document.removeEventListener('touchmove', preventTouch, { passive: false });
      autoDir = 0;
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      if (placeholder && placeholder.parentNode) {
        dragScope.insertBefore(wrap, placeholder);
        placeholder.remove();
      }
      placeholder = null;
      wrap.classList.remove('rowDragging');
      wrap.style.width = wrap.style.left = wrap.style.top = '';
      listRows.classList.remove('isDragging');
      try { row.releasePointerCapture(pid); } catch (err) { /* noop */ }
      commitOrderFromDom(dragScope);
      dragScope = null;
    }
  }

  // DOM 上のファイル行の並びを savedFiles に反映（表示中の行だけを、その枠内で入れ替える）
  function commitOrderFromDom(container) {
    const scope = container || listRows;
    const shownIds = Array.prototype.map.call(
      scope.querySelectorAll('.listRow[data-file-id]'),
      (r) => r.dataset.fileId
    );
    if (!shownIds.length) return;
    const shown = new Set(shownIds);
    const byId = new Map(savedFiles.map((f) => [f.id, f]));
    const queue = shownIds.map((id) => byId.get(id)).filter(Boolean);
    let qi = 0;
    savedFiles = savedFiles.map((f) => (shown.has(f.id) ? queue[qi++] : f));
    persistSavedFiles();
  }

  // 声調123／記号表記を切り替えても行の高さが動かないよう、ピンインが1行に収まるまで

  // 描画直後はまだ画面が非表示のことがあるので、確実に幅が測れるよう次フレームで実行する。
  function fitWordChipPy(el) {
    el.style.fontSize = '';
    const maxWidth = el.clientWidth;
    if (!maxWidth) return;
    let fontSize = 19;
    while (el.scrollWidth > maxWidth + 0.5 && fontSize > 12) {

      el.style.fontSize = fontSize + 'px';

  let wordAddComposing = false;
  wordAddInput.addEventListener('compositionstart', () => { wordAddComposing = true; });
  wordAddInput.addEventListener('compositionend', () => { wordAddComposing = false; });
  wordAddInput.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || wordAddComposing || e.isComposing) return;
    e.preventDefault();
    addWord(wordAddInput.value);
    wordAddInput.value = '';
    renderWordGrid();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!nameModal.hidden) { finishName(null); return; }
    if (!folderPicker.hidden) { closeFolderPicker(); return; }
    if (!saveModal.hidden) { closeSaveModal(); return; }
    if (!wordbookScreen.hidden) {
      if (wordSelectMode) exitWordSelectMode();
      else closeWordbookScreen();
      return;
    }
    if (!allKanjiScreen.hidden) { closeAllKanjiScreen(); return; }
    if (isListScreenOpen()) {
      if (listView.query.trim()) setQuery('');
      else closeListScreen();
    }
  });

  // ================= スマホでの左→右スワイプで保存一覧メニューを開く =================
  let edgeSwipeStart = null;
  document.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'touch') return;
    if (isListScreenOpen()) return;
    if (state.reordering) return;
    if (!saveModal.hidden || !folderPicker.hidden || !nameModal.hidden) return;
    edgeSwipeStart = { x: e.clientX, y: e.clientY, t: Date.now() };
  }, { passive: true });
  document.addEventListener('pointerup', (e) => {
    if (!edgeSwipeStart) return;
    const { x, y, t } = edgeSwipeStart;
    edgeSwipeStart = null;
    if (e.pointerType !== 'touch') return;
    if (isListScreenOpen()) return;
    if (state.reordering) return;
    const dx = e.clientX - x;
    const dy = e.clientY - y;
    if (Date.now() - t > 700) return;
    if (dx > 60 && Math.abs(dy) < 50 && dx > Math.abs(dy) * 1.5) {
      openListScreen();
    }
  }, { passive: true });
  document.addEventListener('pointercancel', () => { edgeSwipeStart = null; }, { passive: true });

  // ================= フッター2段の実測サイズをCSS変数へ反映 =================
  // env(safe-area-inset-bottom)やbutton内のstretch挙動はブラウザ差が出やすいため、
  // calc()に頼らず実際に描画された高さを測って var(--toolfooter-h) / var(--footer-total-h) に入れる。
  function syncFooterOffsets() {
    const toolH = toolFooter.offsetHeight;
    const modeH = modeFooter.offsetHeight;
    modeFooter.style.bottom = toolH + 'px';
    document.documentElement.style.setProperty('--toolfooter-h', toolH + 'px');
    document.documentElement.style.setProperty('--footer-total-h', (toolH + modeH) + 'px');
  }
  window.addEventListener('resize', syncFooterOffsets);
  window.addEventListener('orientationchange', syncFooterOffsets);

  // ================= 起動 =================
  lastCommittedValue = input.value;
  setSubtitleDisplay('');
  updateModeTabsUI();
  document.body.classList.toggle('focusMode', state.focusMode);
  focusToggle.classList.toggle('active', state.focusMode);
  focusToggle.setAttribute('aria-pressed', state.focusMode ? 'true' : 'false');
  focusToggle.title = state.focusMode ? '入力欄を表示' : '入力欄を畳んで広く表示';
  autoGrow();
  renderCurrentMode();
  syncFooterOffsets();
})();

</script>
</body>
</html>
