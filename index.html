<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- ステータスバーの裏までページを広げる設定（black-translucent＋viewport-fit=cover）にすると、ホーム画面アプリで
     iPhoneが報告する画面の高さが実際より短くなり、画面の下に余白が出ることがあるため、ページはステータスバーの下から始める -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="拼音帮手">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3b3833">
<title>拼音帮手</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== 入力ページ（土台の画面。ほかのページはこの上に全画面で重ねて表示する） ===== -->
  <!-- 上部（ヘッダーなど）は内容の上に重ねて表示する。後ろをスクロールする内容がすりガラス越しに透ける -->
  <div class="pageTop">
    <header id="topHeader" class="pageHeader">
      <span class="pageTitle">入力</span>
      <div class="displayToggles"></div>
    </header>

    <div id="fileBar">
      <div id="titleWrap">
        <span id="fileTitle"></span>
        <button id="renameBtn" class="iconBtn" type="button" aria-label="タイトルを編集" title="タイトルを編集">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
        </button>
      </div>
      <button id="newBtn" class="pillGroup pillGroupBtn" type="button" title="新規作成">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg><span>新規</span>
      </button>
      <button id="saveBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        保存
      </button>
    </div>

    <div id="inputWrap">
      <textarea id="zhInput" rows="1" placeholder="ここに入力／貼り付け" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
      <div class="inputTools">
        <button id="undoBtn" class="miniBtn" type="button" title="元に戻す" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a7 7 0 1 1 2 4.9"></path><polyline points="3 4 3 10 9 10"></polyline></svg>
        </button>
        <button id="clearBtn" class="miniBtn" type="button" title="クリア">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
        </button>
      </div>
      <button id="focusToggle" type="button" aria-pressed="false" title="入力欄を畳んで広く表示">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 11 12 6 7 11"></polyline><polyline points="17 18 12 13 7 18"></polyline></svg>
      </button>
    </div>

  </div>

  <main>
    <div id="results">
      <div class="emptyState"></div>
    </div>
  </main>

  <!-- ===== フッターのタブバー（画面下に浮かぶすりガラスのカプセル） ===== -->
  <nav id="tabBar" aria-label="ページ切り替え">
    <span id="tabIndicator" aria-hidden="true"></span>
    <button class="tabItem" type="button" data-tab="input">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
      <span>入力</span>
    </button>
    <button class="tabItem" type="button" data-tab="list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="14" y2="18"></line></svg>
      <span>保存一覧</span>
    </button>
    <button class="tabItem" type="button" data-tab="wordbook">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
      <span>単語帳</span>
    </button>
    <button class="tabItem" type="button" data-tab="allKanji">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"></rect><rect x="13" y="3" width="8" height="8" rx="1.5"></rect><rect x="3" y="13" width="8" height="8" rx="1.5"></rect><rect x="13" y="13" width="8" height="8" rx="1.5"></rect></svg>
      <span>全漢字</span>
    </button>
  </nav>

  <div id="wordSheet">
    <div class="wordSheetHandle"></div>
    <div id="wordSheetList"></div>
  </div>

  <div id="saveModal" class="modalOverlay" hidden>
    <div class="modalCard">
      <div class="modalTitle" id="modalHeading">保存</div>
      <div class="modalLabel">タイトル（任意）</div>
      <div class="modalInputWrap">
        <input id="modalTitleInput" class="modalInput" type="text" autocomplete="off" />
        <button id="modalClearBtn" class="modalClearBtn" type="button" title="クリア" aria-label="クリア">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
        </button>
      </div>
      <div class="modalHint">空欄のときは、冒頭の文字から自動でタイトルがつきます</div>
      <div class="modalActions">
        <button id="modalCancelBtn" class="modalBtnGhost" type="button">キャンセル</button>
        <button id="modalSaveBtn" class="modalBtnPrimary" type="button">保存する</button>
      </div>
    </div>
  </div>

  <!-- ===== 保存一覧ページ ===== -->
  <div id="listScreen" class="pageScreen" hidden>
    <div class="pageTop">
      <header class="pageHeader">
        <span class="pageTitle">保存一覧</span>
        <div class="headerActions">
          <div class="pillGroup">
            <button id="exportBtn" class="pillGroupBtn" type="button" title="バックアップを書き出す（JSONファイル）">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><polyline points="7 10 12 15 17 10"></polyline><path d="M4 19h16"></path></svg><span>書き出し</span>
            </button>
            <button id="importBtn" class="pillGroupBtn" type="button" title="バックアップを読み込む（JSONファイル）">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"></path><polyline points="7 8 12 3 17 8"></polyline><path d="M4 19h16"></path></svg><span>読み込み</span>
            </button>
            <button id="listNewBtn" class="pillGroupBtn" type="button" title="新規作成">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg><span>新規</span>
            </button>
          </div>
          <input id="importFileInput" type="file" accept="application/json,.json" hidden>
        </div>
      </header>
    </div>
    <div id="listRows"></div>
  </div>

  <!-- ===== 単語帳ページ ===== -->
  <div id="wordbookScreen" class="pageScreen" hidden>
    <div class="pageTop">
      <header class="pageHeader">
        <div class="pageTitleWrap">
          <span class="pageTitle">単語帳</span>
          <span id="wordSelectCount"></span>
        </div>
        <div class="headerActions">
          <button id="wordSelectToggleBtn" class="textBtn" type="button" aria-pressed="false">選択</button>
          <!-- 選択モードの間だけ、表示切り替えの代わりにこの3つを出す -->
          <button id="wordMarkPersonBtn" class="iconBtn" type="button" aria-label="人名として登録" title="人名として登録" hidden disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
          </button>
          <button id="wordUnmarkPersonBtn" class="iconBtn" type="button" aria-label="人名登録を解除" title="人名登録を解除" hidden disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="23" y1="11" x2="17" y2="11"></line></svg>
          </button>
          <button id="wordDeleteBtn" class="pillGroup pillGroupBtn dangerPill" type="button" title="選択した単語を削除" hidden disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg><span>削除</span>
          </button>
          <div class="displayToggles"></div>
        </div>
      </header>
      <div id="wordSortBar" class="segmented">
        <span class="segThumb" aria-hidden="true"></span>
        <button class="wordSortBtn" type="button" data-sort="registered">登録順</button>
        <button class="wordSortBtn" type="button" data-sort="pinyin">ピンイン順</button>
        <button class="wordSortBtn" type="button" data-sort="tone">声調順</button>
      </div>
      <div id="wordAddBar" class="searchRow">
        <input id="wordAddInput" class="pillField" type="text" placeholder="単語を入力してEnterで登録（4文字まで）" maxlength="12" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" />
          <!-- 入力中だけ右に出る「すべて消す」ボタン（iOSの検索バーと同じ動き） -->
          <button id="wordAddClearBtn" class="fieldClearBtn" type="button" aria-label="入力をすべて消す" title="入力をすべて消す" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
          </button>
      </div>
    </div>
    <div id="wordbookBody">
      <div id="wordGrid"></div>
      <div id="wordbookIndex" hidden></div>
    </div>
    <!-- 登録順のときだけ出す「一番上に戻る」ボタン（右端の目次が無いので代わりに使う） -->
    <button id="wordScrollTopBtn" class="floatRoundBtn" type="button" aria-label="一番上に戻る" title="一番上に戻る" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="6 11 12 5 18 11"></polyline></svg>
    </button>
  </div>

  <!-- ===== 全漢字ページ ===== -->
  <div id="allKanjiScreen" class="pageScreen" hidden>
    <div class="pageTop">
      <header class="pageHeader">
        <span class="pageTitle">全漢字</span>
        <div class="displayToggles"></div>
      </header>
      <div id="allKanjiAddBar" class="searchRow">
        <input id="allKanjiAddInput" class="pillField" type="text" placeholder="文字を入力してEnterで漢字を登録" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" />
          <!-- 入力中だけ右に出る「すべて消す」ボタン（iOSの検索バーと同じ動き） -->
          <button id="allKanjiAddClearBtn" class="fieldClearBtn" type="button" aria-label="入力をすべて消す" title="入力をすべて消す" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
          </button>
      </div>
    </div>
    <div id="allKanjiBody">
      <div id="allKanjiGrid"></div>
      <div id="allKanjiIndex"></div>
    </div>
  </div>

  <div id="folderPicker" class="modalOverlay" hidden>
    <div class="modalCard">
      <div class="modalTitle">フォルダへ移動</div>
      <div id="folderPickerList"></div>
      <div class="modalActions">
        <button id="folderPickerCancel" class="modalBtnGhost" type="button">キャンセル</button>
      </div>
    </div>
  </div>

  <div id="nameModal" class="modalOverlay" hidden>
    <div class="modalCard">
      <div class="modalTitle" id="nameModalHeading">フォルダ名</div>
      <input id="nameModalInput" class="modalInput" type="text" autocomplete="off" maxlength="30" />
      <div class="modalActions" style="margin-top:12px">
        <button id="nameModalCancel" class="modalBtnGhost" type="button">キャンセル</button>
        <button id="nameModalOk" class="modalBtnPrimary" type="button">OK</button>
      </div>
    </div>
  </div>

  <div id="surume"><img src="images/surume.png" alt=""></div>

<!-- 漢字→ピンイン変換ライブラリ pinyin-pro（配布版をそのまま置いている） -->
<script src="vendor/pinyin-pro.min.js"></script>
<!-- 辞書データ（アプリ本体から定数として参照する） -->
<script src="data/kanji-map.js"></script>
<script src="data/char-freq.js"></script>
<script src="data/custom-words.js"></script>
<script>
(function () {
  // ---------- element refs ----------
  const input = document.getElementById('zhInput');
  const results = document.getElementById('results');
  const inputPageTop = document.querySelector('body > .pageTop');
  const clearBtn = document.getElementById('clearBtn');
  const undoBtn = document.getElementById('undoBtn');
  const surume = document.getElementById('surume');

  const saveBtn = document.getElementById('saveBtn');
  const fileTitle = document.getElementById('fileTitle');
  const renameBtn = document.getElementById('renameBtn');

  const focusToggle = document.getElementById('focusToggle');

  const wordSheet = document.getElementById('wordSheet');
  const wordSheetList = document.getElementById('wordSheetList');

  const saveModal = document.getElementById('saveModal');
  const modalHeading = document.getElementById('modalHeading');
  const modalTitleInput = document.getElementById('modalTitleInput');
  const modalClearBtn = document.getElementById('modalClearBtn');
  const modalCancelBtn = document.getElementById('modalCancelBtn');
  const modalSaveBtn = document.getElementById('modalSaveBtn');

  const listScreen = document.getElementById('listScreen');
  const listNewBtn = document.getElementById('listNewBtn');
  const newBtn = document.getElementById('newBtn');
  const listRows = document.getElementById('listRows');
  const exportBtn = document.getElementById('exportBtn');
  const importBtn = document.getElementById('importBtn');
  const importFileInput = document.getElementById('importFileInput');

  const tabBar = document.getElementById('tabBar');
  const tabIndicator = document.getElementById('tabIndicator');
  const tabItems = Array.from(document.querySelectorAll('.tabItem'));

  const wordbookScreen = document.getElementById('wordbookScreen');
  const wordbookDisplayToggles = wordbookScreen.querySelector('.displayToggles');
  const wordSelectToggleBtn = document.getElementById('wordSelectToggleBtn');
  const wordAddClearBtn = document.getElementById('wordAddClearBtn');
  const allKanjiAddClearBtn = document.getElementById('allKanjiAddClearBtn');
  const wordMarkPersonBtn = document.getElementById('wordMarkPersonBtn');
  const wordUnmarkPersonBtn = document.getElementById('wordUnmarkPersonBtn');
  const wordDeleteBtn = document.getElementById('wordDeleteBtn');
  const wordSelectCount = document.getElementById('wordSelectCount');
  const wordAddInput = document.getElementById('wordAddInput');
  const wordGrid = document.getElementById('wordGrid');
  const wordbookIndex = document.getElementById('wordbookIndex');
  const wordScrollTopBtn = document.getElementById('wordScrollTopBtn');
  const wordSortBtns = Array.from(document.querySelectorAll('.wordSortBtn'));
  const wordSortThumb = document.querySelector('#wordSortBar .segThumb');

  const allKanjiScreen = document.getElementById('allKanjiScreen');
  const allKanjiAddInput = document.getElementById('allKanjiAddInput');
  const allKanjiGrid = document.getElementById('allKanjiGrid');
  const allKanjiIndex = document.getElementById('allKanjiIndex');

  const folderPicker = document.getElementById('folderPicker');
  const folderPickerList = document.getElementById('folderPickerList');
  const folderPickerCancel = document.getElementById('folderPickerCancel');

  const nameModal = document.getElementById('nameModal');
  const nameModalHeading = document.getElementById('nameModalHeading');
  const nameModalInput = document.getElementById('nameModalInput');
  const nameModalCancel = document.getElementById('nameModalCancel');
  const nameModalOk = document.getElementById('nameModalOk');

  const pp = window.pinyinPro;
  if (pp && pp.customPinyin) {
    try { pp.customPinyin(CUSTOM_WORDS); } catch (e) { /* noop */ }
  }

  const HANZI_RE = /[一-鿿㐀-䶿]/;

  // 日本語漢字(新字体など)を中国語簡体字の対応字に正規化する
  function normalizeToSimplified(text) {
    let out = '';
    for (const ch of text) {
      const mapped = KANJI_MAP[ch];
      out += (mapped && mapped !== ch) ? mapped : ch;
    }
    return out;
  }

  // 中国語簡体字→日本の字体（表示専用）。KANJI_MAPの逆引きで作る。
  // 1つの簡体字に複数の日本字体が対応するケースは、KANJI_MAP内で先に見つかった方を採用する
  // （同じ字の新字体／旧字体のペアでは大抵 新字体の方が先に見つかる）。
  const JA_KANJI_MAP = (() => {
    const rev = {};
    for (const ja in KANJI_MAP) {
      const cn = KANJI_MAP[ja];
      if (cn === ja) continue;
      if (!(cn in rev)) rev[cn] = ja;
    }
    return rev;
  })();
  // KANJI_MAPは「日本語入力を簡体字へ正規化する」ためのテーブルなので、
  // 日本の新字体と簡体字がたまたま同じ形の字（国・学 など）は、そもそもキーに存在しない。
  // そのため単純な逆引きだと、そうした字が別人（主に旧字体）に化けてしまう。
  // 気づいたものはここに追加していく（変換せずそのまま表示する字のリスト）。
  const JA_KANJI_NO_CONVERT = new Set([
    '国', '学', '会', '体', '数', '万', '与', '争', '号', '医', '声', '麦',
    '当', '灯', '点', '独', '昼',
    '教', '姜', '径', '侠', '峡', '将', '条', '状', '床', '即',
    '呆', '台', '峰', '布', '板', '表', '面',
    '壮', '装',
    '致', '折', '周', '虫', '寿', '凶', '制', '没', '秘', '弥', '蛮', '堕',
    '脱', '担', '胆', '党', '断', '糖', '盗', '冬', '同', '来', '乱', '礼',
    '凌', '娘', '恋', '梁', '既', '戚', '旗', '凄', '席', '局', '巨', '虚',
    '旧', '厩', '秋', '修', '届', '窃', '写', '携', '却', '晋', '尽', '静',
    '寝', '脚', '奸', '千', '浅', '向', '群', '旋', '松', '辞', '私', '洒',
    '唇', '占', '真', '征', '蝉', '禅', '扇', '沈', '吃', '税', '出', '朱',
    '注', '属',
    '才', '采', '彩', '杯', '斗', '栗', '念', '楼', '只', '痴', '厨', '合',
    '悦', '岳', '遥', '瑶', '岩', '涌', '横', '恒', '回', '谷', '胡', '干',
    '画', '核', '困', '弯', '温',
    '玩', '曲', '泄', '家', '咸', '俊',
    '宝',
    '于', '黄', '猫', '内', '累', '里',
    '范', '吊', '凛',
    '晒', '蚕', '惨', '残', '参', '誉', '欲', '余',
    '雇', '晴',
    '嘱', '葱',
    '触', '随', '御', '双', '幸', '矩',
    '蒙', '狸', '惧', '庵',
  ]);
  // 簡体字1字に新字体・旧字体など複数の候補があり、逆引きがたまたま違う方（主に旧字体）を
  // 選んでしまっているケース。気づいたものはここで正しい新字体を指定して上書きする。
  const JA_KANJI_PREFERRED = {
    '经': '経', '轻': '軽', '艺': '芸', '继': '継', '术': '術', '续': '続',
    '带': '帯', '对': '対', '发': '発', '满': '満', '丰': '豊', '变': '変',
    '边': '辺', '击': '撃', '专': '専', '传': '伝',
    '实': '実', '众': '衆', '废': '廃', '单': '単', '团': '団', '铁': '鉄',
    '厅': '庁', '听': '聴', '读': '読', '图': '図', '赖': '頼', '览': '覧',
    '历': '歴', '灵': '霊', '乐': '楽', '录': '録', '两': '両', '脑': '脳',

  function toJapaneseKanji(text) {

      const ch = raw.normalize('NFC');

  function renderDisplayText(el, text) {

      if (converted !== ch) {

  }

  // ---------- app state ----------
  const state = {
    tab: 'input',          // 表示中のページ：'list' | 'input' | 'wordbook' | 'allKanji'
    toneType: 'symbol',    // 'symbol' | 'num' (どちらか一方のみ表示。併記はしない。'num'に切り替えるボタンは今は出していない)
    contourOn: false,      // true のときはアルファベットを隠し、声調を高低カーブのSVG記号で表示する
    pinyinOff: false,      // true のときはピンインも声調カーブも一切表示しない（contourOnとは同時にtrueにならない）
    focusMode: false,
    jaKanjiOn: false,      // true のときは漢字の表示だけ日本の字体に変換する（内部データ・ピンイン計算には影響しない）
  };

  let currentFileId = null;
  let undoStack = [];      // 直近5件までの編集前スナップショット
  let lastCommittedValue = '';
  let typingTimer = null;
  let burstStartValue = '';

  // ================= 変換結果のキャッシュ =================
  // pinyin-proの変換は1回なら速いが、単語帳の描画・並び替えでは同じ単語を何千回も変換することになるので、
  // 結果を覚えておく（読みは単語と表記の種類だけで決まり、途中で変わらない）。
  // 入力欄の文章も通るので、件数が増えすぎたら丸ごと捨てて作り直す。
  // 返す配列・オブジェクトは共有されるので、呼び出し側で書き換えないこと。
  const CACHE_LIMIT = 20000;
  function memo(map, key, compute) {
    if (map.has(key)) return map.get(key);
    const value = compute();
    if (map.size >= CACHE_LIMIT) map.clear();
    map.set(key, value);
    return value;
  }
  const segmentCache = new Map();
  // textを単語区切りつきで変換した結果（pp.segmentのAllArray形式）。失敗したら[]
  function segmentCached(text, toneType) {
    return memo(segmentCache, toneType + '\u0000' + text, () => {
      if (!pp || !pp.segment) return [];
      try {
        return pp.segment(text, { format: pp.OutputFormat.AllArray, toneType: toneType });
      } catch (e) { return []; }
    });
  }

  // ================= pinyin table order (ju/qu/xu のような並び用) =================
  const INITIAL_LIST = ['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s','y','w'];
  const INITIAL_ORDER = ['b','p','m','f','d','t','n','l','g','k','h','j','q','x','zh','ch','sh','r','z','c','s','y','w',''];
  const FINAL_ORDER = [
    'a','o','e','ai','ei','ao','ou','an','en','ang','eng','ong','er',
    'i','ia','ie','iao','iu','ian','in','iang','ing','iong',
    'u','ua','uo','uai','ui','uan','un','uang','ueng',
    'v','ve','van','vn'
  ];

  function splitPinyinBase(base) {
    for (const ini of INITIAL_LIST) {
      if (base.indexOf(ini) === 0 && base.length > ini.length) {
        let final = base.slice(ini.length).replace(/^ü/, 'v');
        if ((ini === 'j' || ini === 'q' || ini === 'x') && final.charAt(0) === 'u') {
          final = 'v' + final.slice(1);
        }
        return { initial: ini, final: final };
      }
    }
    return { initial: '', final: base.replace(/^ü/, 'v') };
  }

  function pinyinGroupRank(base) {
    const parts = splitPinyinBase(base || '');
    let ir = INITIAL_ORDER.indexOf(parts.initial);
    if (ir < 0) ir = INITIAL_ORDER.length;
    let fr = FINAL_ORDER.indexOf(parts.final);
    if (fr < 0) fr = FINAL_ORDER.length;
    return [ir, fr];
  }

  function compareGroupKeys(a, b) {
    const ra = pinyinGroupRank(a);
    const rb = pinyinGroupRank(b);
    if (ra[0] !== rb[0]) return ra[0] - rb[0];
    if (ra[1] !== rb[1]) return ra[1] - rb[1];
    return a < b ? -1 : a > b ? 1 : 0;
  }

  // ================= 単語帳の並び替え（登録順／ピンイン順／声調順） =================
  // ピンイン順：単語を音節ごとにINITIAL_ORDER/FINAL_ORDERの表（あいうえお順相当）で比較する
  const pinyinRanksCache = new Map();
  function pinyinRanksForWord(word) {
    return memo(pinyinRanksCache, word, () => Array.from(word).map((ch) => pinyinGroupRank(getBasePinyin(ch))));
  }
  function comparePinyinWords(a, b) {
    const ra = pinyinRanksForWord(a);
    const rb = pinyinRanksForWord(b);
    const len = Math.min(ra.length, rb.length);
    for (let i = 0; i < len; i++) {
      if (ra[i][0] !== rb[i][0]) return ra[i][0] - rb[i][0];
      if (ra[i][1] !== rb[i][1]) return ra[i][1] - rb[i][1];
    }
    if (ra.length !== rb.length) return ra.length - rb.length;
    return a < b ? -1 : a > b ? 1 : 0;
  }
  // 声調順：漢字1文字だけを切り出して調べると「一」「不」のような変調や、重ね言葉の軽声が
  // 元の（変化前の）声調のまま拾われてしまう。単語全体をピンイン変換してから声調を拾うことで、
  // その単語として実際に読まれる声調（変調・軽声を含む）で比較する。
  function getWordToneDigits(word) {
    if (!pp || !pp.segment) return Array.from(word).map(() => '');
    const groups = segmentCached(word, 'num');
    const chars = groups.length
      ? groups.reduce((acc, g) => acc.concat(g), [])
      : Array.from(word).map((c) => ({ result: c }));
    return chars.map(({ result }) => {
      const m = /([0-5])$/.exec(result || '');
      return m ? m[1] : '';
    });
  }
  // 声調順：1文字目・2文字目の声調の組み合わせ（例：1声+2声）でグループ化して並べる。
  // 3文字以上の単語も先頭2文字の声調だけで判定する。同じ組み合わせの中はピンイン順。
  // pinyin-proは軽声を末尾「0」（まれに「5」）で表すので、どちらも同じ「0」として扱う。
  const TONE_GROUP_ORDER = ['1', '2', '3', '4', '0'];
  const TONE_GROUP_NAME = { '1': '1声', '2': '2声', '3': '3声', '4': '4声', '0': '軽声' };
  function normalizeToneDigit(d) {
    return d === '5' ? '0' : d;
  }
  function toneGroupRank(digit) {
    const idx = TONE_GROUP_ORDER.indexOf(digit);
    return idx >= 0 ? idx : TONE_GROUP_ORDER.length;
  }
  // 1文字だけの単語は2文字目の声調が存在しないので''のまま返す（呼び出し側で個別に扱う）
  const wordToneGroupCache = new Map();
  function wordToneGroupDigits(word) {
    return memo(wordToneGroupCache, word, () => {
      const digits = getWordToneDigits(word).map(normalizeToneDigit);
      return [digits[0] || '', digits[1] || ''];
    });
  }
  function compareToneWords(a, b) {
    const [a1, a2] = wordToneGroupDigits(a);
    const [b1, b2] = wordToneGroupDigits(b);
    const r1 = toneGroupRank(a1) - toneGroupRank(b1);
    if (r1 !== 0) return r1;
    const r2 = toneGroupRank(a2) - toneGroupRank(b2);
    if (r2 !== 0) return r2;
    return comparePinyinWords(a, b);

  // アプリを開いたときは常に登録順から始める（前回の並び順は引き継がない）
  let wordSortMode = 'registered';
  // 並び替えのセグメントコントロール：選んだボタンの文字色を変え、つまみをその位置へすべらせる
  function updateWordSortBtnsUI() {
    wordSortBtns.forEach((btn) => btn.classList.toggle('active', btn.dataset.sort === wordSortMode));
    const idx = wordSortBtns.findIndex((btn) => btn.dataset.sort === wordSortMode);

  }
  updateWordSortBtnsUI();
  function getSortedWords() {

    else if (wordSortMode === 'tone') list.sort(compareToneWords);

  }

  // ================= pinyin lookup helpers =================
  const basePinyinCache = new Map();
  function getBasePinyin(ch) {
    return memo(basePinyinCache, ch, () => {
      if (!pp || !pp.pinyin) return '';
      try { return pp.pinyin(ch, { toneType: 'none', multiple: false }) || ''; } catch (e) { return ''; }
    });
  }

  const toneDigitCache = new Map();
  function getToneDigit(ch) {
    return memo(toneDigitCache, ch, () => {
      if (!pp || !pp.pinyin) return '';
      try {
        const withNum = pp.pinyin(ch, { toneType: 'num', multiple: false }) || '';
        // pinyin-proは軽声を末尾「0」で表す（「5」ではない）ので両方拾う
        const m = withNum.match(/([0-5])$/);

  const wordReadingCache = new Map();
  function getWordCharReadings(word) {
    return memo(wordReadingCache, word, () =>
      segmentCached(word, 'num').reduce((acc, g) => acc.concat(g), []).map(({ origin, result }) => {
        const m = /^(.*?)([0-5])?$/.exec(result || '');
        return { ch: origin, base: m[1], tone: normalizeToneDigit(m[2] || '') };

  // 標準の読み（pinyin-proの多音字リストの先頭。1文字単独での変換だと「了」がliǎoになるため使わない）は
  // 常に入れ、それ以外の読みは単語帳にその読みで
  // 使われている単語があるときだけ入れる（あまり使わない読みまで並ぶとノイズになるため）。
  // 声調は辞書のその音の最初の軽声以外の声調を代表にし（好 hǎo/hào → 3声）、軽声でしか読まない音だけ'0'。
  // 辞書に無い読み（カスタム読み等）は単語の中で実際に読まれている声調を使う。
  function getCharReadings(ch) {
    const dictTones = new Map();
    let standardBase = '';
    if (pp && pp.pinyin) {
      try {
        pp.pinyin(ch, { toneType: 'num', multiple: true, type: 'array' }).forEach((r) => {
          const m = /^(.*?)([0-5])?$/.exec(r || '');
          const base = m[1];
          const tone = normalizeToneDigit(m[2] || '');
          if (!base) return;
          if (!standardBase) standardBase = base;
          if (!dictTones.has(base) || (dictTones.get(base) === '0' && tone !== '0')) dictTones.set(base, tone);
        });
      } catch (e) { /* noop */ }
    }
    const readings = new Map();
    const add = (base, tone) => {
      if (!base || readings.has(base)) return;
      readings.set(base, dictTones.has(base) ? dictTones.get(base) : tone);
    };
    if (standardBase) add(standardBase, '');
    else add(getBasePinyin(ch), normalizeToneDigit(getToneDigit(ch)));
    wordsContaining(ch).forEach((w) => {
      getWordCharReadings(w).forEach((r) => { if (r.ch === ch) add(r.base, r.tone); });

  let charFreqRankMap = null;
  function charFreqRank(ch) {
    if (!charFreqRankMap) {
      charFreqRankMap = new Map();
      Array.from(typeof CHAR_FREQ_ORDER === 'string' ? CHAR_FREQ_ORDER : '').forEach((c, i) => charFreqRankMap.set(c, i));

  // 全漢字ページでは漢字1字ごとに引くので、毎回全単語を調べずに済むよう一度だけ作る。
  // 単語帳が変わったら（persistWords）捨てて、次に使うときに作り直す。
  let wordsByCharIndex = null;
  function wordsContaining(ch) {
    if (!wordsByCharIndex) {
      wordsByCharIndex = new Map();
      savedWords.forEach((w) => {
        new Set(w).forEach((c) => {
          if (!wordsByCharIndex.has(c)) wordsByCharIndex.set(c, []);
          wordsByCharIndex.get(c).push(w);
        });
      });
    }

  function wordsForChar(ch, base) {

    if (!base) return list;
    return list.filter((w) => getWordCharReadings(w).some((r) => r.ch === ch && r.base === base));

  function setToneContour(el, digit) {
    if (digit) el.dataset.tone = digit;
  }

    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function lineToPinyin(normalizedLine) {
    if (!pp || !pp.segment) return '';
    return segmentCached(normalizedLine, state.toneType)
      .map((group) => group.map((g) => g.result).join(''))
      .join(' ');
  }

  // 漢字1文字ずつの下にその声調カーブSVGを揃えて配置する行を作る（アルファベット非表示のとき共通で使う）
  function appendContourCols(row, text) {
    const groups = segmentCached(text, 'num');
    const chars = groups.length
      ? groups.reduce((acc, g) => acc.concat(g), [])
      : Array.from(text).map((c) => ({ origin: c, result: c }));

    chars.forEach(({ origin, result }) => {
      const col = document.createElement('span');
      col.className = 'cCol';

      const charEl = document.createElement('span');
      charEl.className = 'cChar';
      renderDisplayText(charEl, origin);
      col.appendChild(charEl);

      const toneEl = document.createElement('span');
      toneEl.className = 'cTone';
      const m = /([0-5])$/.exec(result || '');
      if (m) setToneContour(toneEl, m[1]);
      col.appendChild(toneEl);

      row.appendChild(col);
    });
  }

  // 入力ページ用：行全体を漢字＋声調カーブの行にする
  function buildContourBlock(normalizedLine) {
    const block = document.createElement('div');
    block.className = 'lineBlock contourBlock';

    const row = document.createElement('div');
    row.className = 'contourRow';
    appendContourCols(row, normalizedLine);

    block.appendChild(row);
    return block;
  }

  function buildWordContourRow(word) {
    const row = document.createElement('div');
    row.className = 'contourRow wordChipContourRow';
    appendContourCols(row, word);
    return row;
  }

  // ================= surume（背景キャラ） =================
  let hasText = false;
  function updateSurume(nextHasText) {
    if (nextHasText === hasText) return;
    hasText = nextHasText;
    if (!surume) return;
    if (hasText) {
      surume.classList.remove('leaving', 'visible');
      void surume.offsetWidth;
      surume.classList.add('enter');
    } else {
      surume.classList.remove('enter', 'visible');
      void surume.offsetWidth;
      surume.classList.add('leaving');
    }
  }
  if (surume) {
    surume.addEventListener('animationend', (e) => {
      if (e.animationName === 'peekIn') {
        surume.classList.remove('enter');
        surume.classList.add('visible');
      } else if (e.animationName === 'peekOut') {
        surume.classList.remove('leaving');
      }
    });
  }

  // ================= undo (元に戻す) =================
  function pushUndo(val) {
    clearTimeout(typingTimer);
    typingTimer = null;
    if (undoStack[undoStack.length - 1] === val) return;
    undoStack.push(val);
    if (undoStack.length > 5) undoStack.shift();
    undoBtn.disabled = undoStack.length === 0;
  }

  function commitInputValue(newValue, opts) {
    const skipUndo = opts && opts.skipUndo;
    if (!skipUndo && input.value !== newValue) {
      pushUndo(input.value);
    }
    input.value = newValue;
    lastCommittedValue = newValue;
    autoGrow();
  }

  undoBtn.addEventListener('click', () => {
    if (!undoStack.length) return;
    clearTimeout(typingTimer);
    typingTimer = null;
    const prev = undoStack.pop();
    input.value = prev;
    lastCommittedValue = prev;
    undoBtn.disabled = undoStack.length === 0;
    autoGrow();
    renderInputPage();
  });

  // ================= 入力ページ（文章とピンイン） =================
  // 表示エリアで今一番上に見えている行（何番目の行か、その行の上端が表示エリアの上端からどれだけずれているか）
  // 基準にするのは、上部（すりガラスのヘッダー）の下に上端まで見えている最初の行（書体が変わって行の高さが変わっても、
  // 見えている行がずれないように。行が長くてそういう行が無いときは、ヘッダーの下にかかっている行）
  function captureResultsAnchor() {
    const top = inputPageTop.getBoundingClientRect().bottom;
    const blocks = results.children;
    let partial = null;
    for (let i = 0; i < blocks.length; i++) {
      const r = blocks[i].getBoundingClientRect();
      if (r.bottom <= top) continue;
      if (r.top >= top - 1) return { index: i, offset: r.top - top, top };
      if (!partial) partial = { index: i, offset: r.top - top, top };
    }
    return partial;
  }
  // captureResultsAnchorで覚えた行が、描き直したあとも同じ位置に来るようにスクロールを合わせる
  function restoreResultsAnchor(anchor) {
    const block = anchor && results.children[anchor.index];
    if (!block) return;
    results.scrollTop += block.getBoundingClientRect().top - anchor.top - anchor.offset;
  }

  // scrollAnchor（captureResultsAnchorの結果）を渡したときは、見ていた位置をそのまま保つ（表示切り替えボタン用）。
  // 省略したときは入力中の最新の行が見えるよう一番下までスクロールする
  function renderSentence(scrollAnchor) {
    const keepScroll = scrollAnchor !== undefined;
    const raw = input.value;
    const trimmed = raw ? raw.trim() : '';

    if (trimmed === '') {
      results.innerHTML = '<div class="emptyState"></div>';
      return;
    }

    const lines = raw.split('\n');
    const frag = document.createDocumentFragment();
    let hasBlock = false;
    let blankBefore = false; // 直前に表示した行との間に空行があったか

    lines.forEach((line) => {
      if (line.trim() === '') { blankBefore = true; return; }

      const normalized = normalizeToSimplified(line);
      let block;
      if (state.contourOn && !state.pinyinOff) {
        block = buildContourBlock(normalized);
      } else {
        block = document.createElement('div');
        block.className = 'lineBlock';
        const zhDiv = document.createElement('div');
        zhDiv.className = 'zhLine';
        renderDisplayText(zhDiv, normalized);
        block.appendChild(zhDiv);
        if (!state.pinyinOff) {
          const pyDiv = document.createElement('div');
          pyDiv.className = 'pyLine';
          pyDiv.textContent = lineToPinyin(normalized);
          block.appendChild(pyDiv);
        }
      }
      if (hasBlock && blankBefore) block.classList.add('afterBlank');
      frag.appendChild(block);
      hasBlock = true;
      blankBefore = false;
    });

    results.innerHTML = '';
    results.appendChild(frag);
    if (keepScroll) restoreResultsAnchor(scrollAnchor);
    else results.scrollTop = results.scrollHeight;
  }

  // ================= 全漢字ページの漢字カード =================
  // 漢字だけを大きく表示。声調数字は123トグルON時のみ右肩に小さく（絶対配置なのでレイアウトは動かない）。
  // 単語帳にその漢字を含む単語が1つもないときはタップしても何も起きないので、少し薄い色で示す。
  // opts.base/opts.tone（全漢字ページ用）：多音字をどの読みとして表示しているか。
  // 指定時は声調表示をその読みの声調にし、タップで出す単語もその読みのものだけに絞る。
  // opts.alwaysShowTone：123ボタンがOFFでも声調数字を表示する（全漢字ページの各声調の先頭用）。
  function makeCard(ch, opts) {
    const base = (opts && opts.base) || '';
    const toneDigit = opts && opts.tone != null ? opts.tone : getToneDigit(ch);
    const hasWord = wordsForChar(ch, base).length > 0;
    const card = document.createElement('div');
    card.className = 'kcard' + (state.contourOn ? ' contourOn' : '');
    card.dataset.char = ch;
    if (base) card.dataset.base = base;
    // このカードが表している声調（単語シートで、違う声調で読まれている音節に下線を引くのに使う）。
    // data-toneは声調カーブの記号用のCSSが使っているので別の名前にする
    card.dataset.readingTone = normalizeToneDigit(toneDigit || '');

    const hz = document.createElement('span');
    hz.className = 'khz' + (hasWord ? '' : ' noWord');
    renderDisplayText(hz, ch);
    card.appendChild(hz);

    if (state.contourOn) {
      const contour = document.createElement('span');
      contour.className = 'kcontour';
      setToneContour(contour, toneDigit);
      card.appendChild(contour);
    } else {
      const tone = document.createElement('span');
      tone.className = 'ktone';
      const showTone = (state.toneType === 'num' && !state.pinyinOff) || (opts && opts.alwaysShowTone);
      tone.textContent = showTone ? toneDigit : '';
      card.appendChild(tone);
    }

    card.addEventListener('click', () => {
      if (!hasWord) return;
      openWordSheetFor(ch, card, base);
    });

    return card;
  }

  // ================= 漢字タップ時の単語シート =================
  // 登録済み単語にその漢字を含むものがあれば下からシートを出す。無ければ何もしない（現状維持）。
  let activeWordCard = null;
  let activeWordChar = null;
  let activeWordBase = '';
  function setActiveWordCard(card) {
    if (activeWordCard && activeWordCard !== card) activeWordCard.classList.remove('wordActive');
    activeWordCard = card || null;
    if (activeWordCard) activeWordCard.classList.add('wordActive');
  }
  // 単語のピンインをelに入れる（単語区切りごとにスペース。lineToPinyinと同じ並び）。
  // mark = { ch, base, tone } のときは、その漢字がbaseの音で、しかもtoneとは違う声調で読まれている音節に下線を引く
  function renderWordPinyin(el, word, mark) {
    const groups = segmentCached(word, state.toneType);
    const readings = getWordCharReadings(word); // 同じ単語を声調番号つきで区切った結果（1文字ずつ同じ順に並ぶ）
    const flatCount = groups.reduce((n, g) => n + g.length, 0);
    const canMark = mark && mark.tone && readings.length === flatCount;
    let i = 0;
    groups.forEach((group, gi) => {
      if (gi) el.appendChild(document.createTextNode(' '));
      group.forEach((g) => {
        const r = readings[i++];
        if (canMark && r.ch === mark.ch && r.base === mark.base && r.tone !== mark.tone) {
          const span = document.createElement('span');
          span.className = 'toneDiff';
          span.textContent = g.result;
          el.appendChild(span);
        } else {
          el.appendChild(document.createTextNode(g.result));
        }
      });
    });
  }
  // 現在の表示設定（声調123／声調カーブ／日本字体）に合わせて中身だけを作り直す。
  // tone：タップしたカードの声調。これと違う声調で読まれている音節に下線を引く
  function renderWordSheetContent(ch, base, tone) {
    const matches = wordsForChar(ch, base);
    wordSheetList.innerHTML = '';
    matches.forEach((w) => {
      const item = document.createElement('div');
      item.className = 'wordSheetItem';
      if (state.contourOn) {
        const row = document.createElement('div');
        row.className = 'contourRow';
        appendContourCols(row, w);
        item.appendChild(row);
      } else {
        const hz = document.createElement('div');
        hz.className = 'wordSheetHz';
        renderDisplayText(hz, w);
        const py = document.createElement('div');
        py.className = 'wordSheetPy';
        if (!state.pinyinOff) renderWordPinyin(py, w, { ch, base, tone });
        if (personWords.has(w)) {
          const icon = document.createElement('span');
          icon.className = 'wordSheetPersonIcon';
          icon.innerHTML = PERSON_SVG;
          py.appendChild(icon);
        }
        item.appendChild(hz);
        item.appendChild(py);
      }
      wordSheetList.appendChild(item);
    });
    return matches.length;
  }
  function openWordSheetFor(ch, cardEl, base) {
    if (!renderWordSheetContent(ch, base, cardEl ? cardEl.dataset.readingTone : '')) return;
    activeWordChar = ch;
    activeWordBase = base || '';
    // タップした漢字が画面下半分にある場合は、シートに隠れないよう上から出す
    if (cardEl) {
      const rect = cardEl.getBoundingClientRect();
      wordSheet.classList.toggle('fromTop', rect.top > window.innerHeight / 2);
    }
    wordSheet.classList.add('open');
    setActiveWordCard(cardEl);
  }
  function closeWordSheet() {
    wordSheet.classList.remove('open');
    setActiveWordCard(null);
    activeWordChar = null;
    activeWordBase = '';
  }
  // 声調123／声調カーブ／日本字体の表示設定が変わったとき用。呼び出し側は
  // renderInputPage(true)でシート自体を閉じずに描画し直しているので、ここでは
  // 新しい表示設定のカードを探して中身だけを作り直す（'open'クラスは既に付いたままなので
  // classList.addは何もしない＝閉じるアニメーションは一切発生しない）
  function reopenWordSheetIfNeeded(ch, base) {
    if (!ch) return;
    // 全漢字ページでは同じ漢字が複数の読みのグループに出るので、読み(data-base)まで一致するカードを探す
    const sel = '.kcard[data-char="' + CSS.escape(ch) + '"]' + (base ? '[data-base="' + CSS.escape(base) + '"]' : '');
    const card = allKanjiGrid.querySelector(sel);
    openWordSheetFor(ch, card, base);
  }
  // カードでもシート自身でも表示切り替えボタンでもない場所をタップしたら閉じる
  document.addEventListener('click', (e) => {
    if (!wordSheet.classList.contains('open')) return;
    if (e.target.closest('#wordSheet')) return;
    if (e.target.closest('.kcard')) return;
    if (e.target.closest('.displayToggles')) return;
    closeWordSheet();
  });

  // ================= 全漢字ページ =================
  // 登録済みの漢字を常にピンインでグループ化して表示する。
  // 子音インデックス（右端の目次）でジャンプする先の見出しがない“無子音”の音（ā/ān等）用のラベル
  const ALL_KANJI_INDEX_NO_INITIAL_LABEL = '·';

  function renderAllKanjiGrid() {
    allKanjiGrid.innerHTML = '';
    allKanjiIndex.innerHTML = '';
    if (!allKanji.length) {
      allKanjiGrid.innerHTML = '<div class="listEmpty">まだ漢字が登録されていません</div>';
      return;
    }

    // 多音字は標準の読みのグループに加え、単語帳で使われている読みのグループにも出す（例：长はchangとzhang）。
    // グループ内は声調順（1→2→3→4→軽声）、同じ声調の中は出現頻度順、頻度表に無いもの同士は登録順
    // （sortは安定なので登録順が保たれる）。
    const groups = new Map();
    allKanji.forEach((ch) => {
      const readings = getCharReadings(ch);
      if (!readings.size) readings.set(ch, '');
      readings.forEach((tone, key) => {
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push({ ch, tone });
      });
    });
    groups.forEach((list) => list.sort((a, b) =>
      (toneGroupRank(a.tone) - toneGroupRank(b.tone)) || (charFreqRank(a.ch) - charFreqRank(b.ch))));

    const orderedKeys = Array.from(groups.keys()).sort(compareGroupKeys);
    const frag = document.createDocumentFragment();
    const indexFrag = document.createDocumentFragment();
    let lastInitial = null;
    orderedKeys.forEach((key) => {
      const initial = splitPinyinBase(key).initial;

      const wrap = document.createElement('div');
      wrap.className = 'kgroup';
      wrap.dataset.initial = initial;

      const label = document.createElement('div');
      label.className = 'kgroupLabel';
      label.innerHTML = '<span>' + escapeHtml(key) + '</span>';
      wrap.appendChild(label);

      const row = document.createElement('div');
      row.className = 'kgroupRow';
      // 同じ声調の並びの先頭の漢字だけは、123ボタンの状態に関係なく声調数字を常に出す
      let prevTone = null;
      groups.get(key).forEach(({ ch, tone }) => {
        row.appendChild(makeCard(ch, { base: key, tone, alwaysShowTone: tone !== prevTone }));
        prevTone = tone;
      });
      wrap.appendChild(row);

      frag.appendChild(wrap);

      // 同じ子音が続く間はインデックスに1つだけ出す（グループの先頭に飛べればよい）
      if (initial !== lastInitial) {
        lastInitial = initial;
        const item = document.createElement('div');
        item.className = 'allKanjiIndexItem';
        item.dataset.initial = initial;
        item.textContent = initial || ALL_KANJI_INDEX_NO_INITIAL_LABEL;
        indexFrag.appendChild(item);
      }
    });
    allKanjiGrid.appendChild(frag);
    allKanjiIndex.appendChild(indexFrag);
    allKanjiIndexHighlighter.refresh();
  }

  // ================= 右端の目次で「今見ている場所」の文字に色を付ける（全漢字・単語帳で共用） =================
  // 各グループの上端の位置は描画後に一度だけ測って覚えておき、スクロールのたびにはその数値と比べるだけにする
  // （スクロール中にレイアウトを測り直さないので軽い）。描き直し・上部の高さの変化・画面サイズの変化で測り直す。
  // opts: screen（ページ）, grid（スクロールする一覧）, index（目次）, groupSelector（グループの要素）,
  //       key（グループと目次の項目を対応づけるdata属性。dataset上の名前）
  function createIndexHighlighter(opts) {
    let tops = null;      // [{ key, top }]（上から順。一覧の中での位置）
    let currentKey;       // 今色を付けている項目
    let ticking = false;
    function measure() {
      const gridTop = opts.grid.getBoundingClientRect().top - opts.grid.scrollTop;
      tops = Array.prototype.map.call(opts.grid.querySelectorAll(opts.groupSelector), (g) => ({
        key: g.dataset[opts.key],
        top: g.getBoundingClientRect().top - gridTop,
      }));
    }
    function update() {
      ticking = false;
      if (opts.screen.hidden || opts.index.hidden) return;
      if (!tops) measure();
      if (!tops.length) return;
      // 上部（すりガラスのヘッダー）のすぐ下の線より上から始まっている、一番下のグループ＝今見ているグループ
      const line = opts.grid.scrollTop + (parseFloat(getComputedStyle(opts.grid).scrollPaddingTop) || 0) + 8;
      let lo = 0, hi = tops.length - 1, found = 0;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (tops[mid].top <= line) { found = mid; lo = mid + 1; } else { hi = mid - 1; }
      }
      const key = tops[found].key;
      if (key === currentKey) return;
      currentKey = key;
      Array.prototype.forEach.call(opts.index.children, (item) => {
        item.classList.toggle('current', item.dataset[opts.key] === key);
      });
    }
    opts.grid.addEventListener('scroll', () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(update);
    }, { passive: true });
    window.addEventListener('resize', () => { tops = null; });
    return {
      // 一覧を描き直したときや、位置が変わったときに呼ぶ
      refresh() {
        tops = null;
        currentKey = undefined;
        requestAnimationFrame(update);
      },
    };
  }
  const allKanjiIndexHighlighter = createIndexHighlighter({
    screen: allKanjiScreen, grid: allKanjiGrid, index: allKanjiIndex, groupSelector: '.kgroup', key: 'initial',
  });

  // scrollerの中のelが、上部（すりガラスのヘッダー）のすぐ下に来るようにscrollerだけをスクロールする。
  // scrollIntoViewはページ全体（html）まで動かしてしまい、画面ごと上にずれることがあるので使わない
  function scrollChildToTop(scroller, el) {
    const topH = parseFloat(getComputedStyle(scroller).scrollPaddingTop) || 0;
    scroller.scrollTop += el.getBoundingClientRect().top - scroller.getBoundingClientRect().top - topH;
  }

  // 全漢字ページの右端インデックスをタップ／ドラッグして、その子音の先頭グループへジャンプする
  function jumpAllKanjiToInitial(initial) {
    const target = allKanjiGrid.querySelector('.kgroup[data-initial="' + CSS.escape(initial) + '"]');
    if (target) scrollChildToTop(allKanjiGrid, target);
  }
  function allKanjiIndexItemAt(x, y) {
    const el = document.elementFromPoint(x, y);
    return el ? el.closest('.allKanjiIndexItem') : null;
  }
  let allKanjiIndexActiveEl = null;
  function setAllKanjiIndexActive(item) {
    if (allKanjiIndexActiveEl && allKanjiIndexActiveEl !== item) allKanjiIndexActiveEl.classList.remove('active');
    allKanjiIndexActiveEl = item || null;
    if (allKanjiIndexActiveEl) allKanjiIndexActiveEl.classList.add('active');
  }
  allKanjiIndex.addEventListener('click', (e) => {
    const item = e.target.closest('.allKanjiIndexItem');
    if (item) jumpAllKanjiToInitial(item.dataset.initial);
  });
  allKanjiIndex.addEventListener('touchstart', (e) => {
    const item = allKanjiIndexItemAt(e.touches[0].clientX, e.touches[0].clientY);
    if (item) { jumpAllKanjiToInitial(item.dataset.initial); setAllKanjiIndexActive(item); }
  }, { passive: true });
  allKanjiIndex.addEventListener('touchmove', (e) => {
    const item = allKanjiIndexItemAt(e.touches[0].clientX, e.touches[0].clientY);
    if (item && item !== allKanjiIndexActiveEl) { jumpAllKanjiToInitial(item.dataset.initial); setAllKanjiIndexActive(item); }
    e.preventDefault();
  }, { passive: false });
  allKanjiIndex.addEventListener('touchend', () => setAllKanjiIndexActive(null));
  allKanjiIndex.addEventListener('touchcancel', () => setAllKanjiIndexActive(null));

  // ================= 表示切り替え（声調カーブ／ピンインなし／日本字体） =================
  // 単語帳を開いている間に声調表示の設定を切り替えたら、単語帳側も即座に反映する
  // 描き直しても見ていた場所が動かないよう、ヘッダーのすぐ下に見えていたカードを覚えておき、描き直し後に同じ位置へ戻す
  // anchorは、表示を変える前にcaptureWordbookAnchorで測っておいたもの（省略時はここで測る）
  function refreshWordbookIfOpen(anchor) {
    if (wordbookScreen.hidden) return;
    if (anchor === undefined) anchor = captureWordbookAnchor();
    renderWordGrid();
    restoreGridAnchor(wordGrid, anchor);
  }
  function captureWordbookAnchor() {
    if (wordbookScreen.hidden) return null;
    return captureGridAnchor(wordGrid, '.wordChip', (el) => '.wordChip[data-word="' + CSS.escape(el.dataset.word) + '"]');
  }
  // 全漢字ページを開いている間も同様に即座に反映する（同じ漢字が複数の読みのグループに出るので、読みまで一致するカードを探す）
  function refreshAllKanjiIfOpen(anchor) {
    if (allKanjiScreen.hidden) return;
    if (anchor === undefined) anchor = captureAllKanjiAnchor();
    renderAllKanjiGrid();
    restoreGridAnchor(allKanjiGrid, anchor);
  }
  function captureAllKanjiAnchor() {
    if (allKanjiScreen.hidden) return null;
    return captureGridAnchor(allKanjiGrid, '.kcard', (el) =>
      '.kcard[data-char="' + CSS.escape(el.dataset.char) + '"][data-base="' + CSS.escape(el.dataset.base || '') + '"]');
  }
  // 一覧（grid）で、上部（すりガラスのヘッダー）のすぐ下に最初に見えている項目と、その上端の位置を覚える。
  // selectorOf(el)は、描き直したあとに同じ項目を探すためのセレクタを返す
  // 基準にするのは、上部の下に上端まで見えている最初の項目（書体が変わって項目の高さが変わっても、見えている所がずれないように）
  function captureGridAnchor(grid, itemSelector, selectorOf) {
    const line = grid.getBoundingClientRect().top + (parseFloat(getComputedStyle(grid).scrollPaddingTop) || 0);
    const items = grid.querySelectorAll(itemSelector);
    let partial = null;
    for (let i = 0; i < items.length; i++) {
      const r = items[i].getBoundingClientRect();
      if (r.bottom <= line) continue;
      if (r.top >= line - 1) return { selector: selectorOf(items[i]), offset: r.top - line, line };
      if (!partial) partial = { selector: selectorOf(items[i]), offset: r.top - line, line };
    }
    return partial;
  }
  // captureGridAnchorで覚えた項目が、描き直したあとも同じ位置に来るようにgridだけをスクロールする。
  // 声調カーブ表示の単語帳は画面外のカードの高さを見積もりで並べていて（content-visibility）、画面近くのカードが
  // 実際の高さになると少しずれるので、続く2フレームでもう一度合わせ直す
  function restoreGridAnchor(grid, anchor) {
    const el = anchor && grid.querySelector(anchor.selector);
    if (!el) return;
    const align = () => { grid.scrollTop += el.getBoundingClientRect().top - anchor.line - anchor.offset; };
    align();
    requestAnimationFrame(() => { align(); requestAnimationFrame(align); });
  }

  // ヘッダー右の表示切り替えボタン。入力・単語帳・全漢字の各ヘッダーの .displayToggles に同じものを並べる。
  // 'num'（声調を数字で表示）は今はボタンを出していない（hidden: true）。戻すときは hidden を外すだけでよい
  // ボタンはこの配列の順に左から並ぶ（日本漢字 → 声調 → 非表示）
  const DISPLAY_TOGGLES = [
    {
      key: 'ja', label: '日本漢字', title: '漢字を日本の字体で表示（内部のデータは変わりません）',
      isOn: () => state.jaKanjiOn,
      apply: () => { state.jaKanjiOn = !state.jaKanjiOn; },
    },
    {
      key: 'num', hidden: true, label: '123', title: '声調を数字で表示',
      isOn: () => state.toneType === 'num' && !state.pinyinOff,
      apply: () => {
        if (state.contourOn || state.pinyinOff) {
          // 記号モード／ピンインなしモード中に押した場合は、そのモードを抜けて数字モードへ切り替える
          state.contourOn = false;
          state.pinyinOff = false;
          state.toneType = 'num';
        } else {
          state.toneType = state.toneType === 'symbol' ? 'num' : 'symbol';
        }
      },
    },
    {
      key: 'contour', label: '声調', title: '声調を高低カーブの記号で表示（アルファベット非表示）',
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17 L9 7 L15 7 L20 17"></path></svg>',
      isOn: () => state.contourOn,
      apply: () => {
        state.pinyinOff = false;
        state.contourOn = !state.contourOn;
      },
    },
    {
      key: 'off', label: '非表示', title: 'ピンインを表示しない',
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="5.6" y1="5.6" x2="18.4" y2="18.4"></line></svg>',
      isOn: () => state.pinyinOff,
      apply: () => {
        state.pinyinOff = !state.pinyinOff;
        if (state.pinyinOff) state.contourOn = false;
      },
    },
  ];
  document.querySelectorAll('.displayToggles').forEach((box) => {
    DISPLAY_TOGGLES.forEach((t) => {
      if (t.hidden) return;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'dispToggle';
      btn.dataset.toggle = t.key;
      btn.title = t.title;
      btn.setAttribute('aria-label', t.title);
      // アイコン（あれば）＋文字

  // 表示切り替えボタンの点灯状態を今のstateに合わせる（全ヘッダーのボタンをまとめて更新する）
  function updateDisplayTogglesUI() {

    const inputAnchor = captureResultsAnchor();
    const wordbookAnchor = captureWordbookAnchor();
    const allKanjiAnchor = captureAllKanjiAnchor();

    updateDisplayTogglesUI();

  // ================= 保存（localStorage） =================
  const STORAGE_KEY = 'pinyinHelperSavedFiles_v1';
  function loadSavedFiles() {

  }
  function persistSavedFiles() {

  let savedFiles = loadSavedFiles();

  // タイトルは手動入力の1種類だけ（空欄で保存したときだけ冒頭の文字から自動でつける）。
  // 「自動タイトル＋手動サブタイトル」だった時期の保存データは、サブタイトルが入力されていれば
  // それをタイトルにし、空ならその時点の自動タイトルをそのまま残して、subtitleの項目を消す。
  // subtitleが無いデータ（それ以前の、タイトルが手入力だった時期のものも含む）はtitleをそのまま使う。
  function migrateFileTitle(f) {
    let changed = false;
    if ('subtitle' in f) {
      const sub = typeof f.subtitle === 'string' ? f.subtitle.trim() : '';
      if (sub) f.title = sub;
      delete f.subtitle;
      changed = true;
    }
    if (!f.title || !String(f.title).trim()) {
      f.title = defaultTitleFromText(f.text || '');
      changed = true;
    }
    return changed;
  }
  (function migrateTitlesToSingleTitle() {
    let changed = false;
    savedFiles.forEach((f) => { if (migrateFileTitle(f)) changed = true; });

  // 一覧の並び順を「更新日時順」から「手動（配列順）」へ一度だけ移行する。
  // 既存ユーザーには、今まで見えていた並び（新しい順）をそのまま初期の手動順として渡す。
  const ORDER_INIT_KEY = 'pinyinHelperOrderInit_v1';
  try {
    if (!localStorage.getItem(ORDER_INIT_KEY)) {
      savedFiles.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      persistSavedFiles();
      localStorage.setItem(ORDER_INIT_KEY, '1');
    }

  // ---------- フォルダ（1階層） ----------
  const FOLDER_KEY = 'pinyinHelperFolders_v1';
  function loadFolders() {
    try {

    } catch (e) { return []; }

    try { localStorage.setItem(FOLDER_KEY, JSON.stringify(folders)); } catch (e) { /* noop */ }
  }
  let folders = loadFolders();

  // ---------- 単語帳（全漢字ページで漢字をタップしたときに関連語を出すための登録単語） ----------
  const WORDS_KEY = 'pinyinHelperWords_v1';
  function loadWords() {
    try {
      const raw = localStorage.getItem(WORDS_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function persistWords() {
    wordsByCharIndex = null;
    try { localStorage.setItem(WORDS_KEY, JSON.stringify(savedWords)); } catch (e) { /* noop */ }
  }
  let savedWords = loadWords(); // 新しく登録した単語が先頭

  // 簡体字化して先頭4文字（漢字のみ）に丸め、既に登録済みなら何もしない（重複自動排除）
  // ここに含まれる漢字は、全漢字ページ未登録のものだけ自動で登録する（通知なし）
  function addWord(raw) {
    const simplified = normalizeToSimplified(raw || '');
    const chars = Array.from(simplified).filter((ch) => HANZI_RE.test(ch)).slice(0, 4);
    const word = chars.join('');
    if (!word || savedWords.indexOf(word) >= 0) return false;
    savedWords.unshift(word);
    persistWords();
    addAllKanji(word);
    return true;
  }
  function deleteWords(words) {
    const del = new Set(words);
    savedWords = savedWords.filter((w) => !del.has(w));
    persistWords();
    let personChanged = false;
    del.forEach((w) => { if (personWords.delete(w)) personChanged = true; });
    if (personChanged) persistPersonWords();
  }

  // ---------- 人名登録（単語帳の単語のうち、人名として登録したものの集合） ----------
  const PERSON_WORDS_KEY = 'pinyinHelperPersonWords_v1';
  function loadPersonWords() {
    try {
      const raw = localStorage.getItem(PERSON_WORDS_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return new Set(Array.isArray(arr) ? arr : []);
    } catch (e) { return new Set(); }
  }
  function persistPersonWords() {
    try { localStorage.setItem(PERSON_WORDS_KEY, JSON.stringify(Array.from(personWords))); } catch (e) { /* noop */ }
  }
  let personWords = loadPersonWords();
  // isPerson=trueで人名登録、falseで解除。1件でも変化があればtrueを返す
  function setWordsPersonStatus(words, isPerson) {
    let changed = false;
    words.forEach((w) => {
      if (isPerson) { if (!personWords.has(w)) { personWords.add(w); changed = true; } }
      else if (personWords.delete(w)) { changed = true; }
    });
    if (changed) persistPersonWords();
    return changed;
  }

  // ---------- 全漢字（単語帳とは別に、登録した漢字を常にピンインごとにグループ表示するページ） ----------
  const ALL_KANJI_KEY = 'pinyinHelperAllKanji_v1';
  function loadAllKanji() {
    try {
      const raw = localStorage.getItem(ALL_KANJI_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function persistAllKanji() {
    try { localStorage.setItem(ALL_KANJI_KEY, JSON.stringify(allKanji)); } catch (e) { /* noop */ }
  }
  let allKanji = loadAllKanji(); // 登録順（古い順）

  // 入力された文字列から漢字だけを取り出し、まだ登録していないものだけ末尾に追加する（重複は自動で無視）
  function addAllKanji(raw) {
    const simplified = normalizeToSimplified(raw || '');
    const seen = new Set(allKanji);
    let added = false;
    for (const ch of simplified) {
      if (!HANZI_RE.test(ch) || seen.has(ch)) continue;
      seen.add(ch);
      allKanji.push(ch);
      added = true;
    }
    if (added) persistAllKanji();
    return added;
  }

  // ---------- バックアップの書き出し／読み込み ----------
  // ホーム画面アプリはブラウザ側の事情でデータ領域が消えることがあるため、
  // 手元にJSONファイルとして退避・復元できるようにする。
  function exportBackup() {
    const payload = {
      app: 'pinyin-helper',
      version: 2,
      exportedAt: Date.now(),
      savedFiles: savedFiles,
      folders: folders,
      words: savedWords,
      personWords: Array.from(personWords),
      allKanji: allKanji,
    };
    const json = JSON.stringify(payload, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const pad = (n) => String(n).padStart(2, '0');
    const d = new Date();
    const stamp = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes());

    const a = document.createElement('a');
    a.href = url;
    a.download = 'pinyin-helper-backup-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  // 既存データは残したまま、まだ無いファイル・フォルダ・単語・人名登録・全漢字だけを追加する（上書きしない）。
  // version 1 のバックアップには personWords / allKanji が無いので、その場合は単語に含まれる漢字だけ全漢字に足す。
  // 戻り値は種類ごとの追加件数
  function mergeImportedBackup(data) {
    const importedFolders = Array.isArray(data.folders) ? data.folders : [];
    const importedFiles = Array.isArray(data.savedFiles) ? data.savedFiles : [];
    const importedWords = Array.isArray(data.words) ? data.words : [];
    const importedPersonWords = Array.isArray(data.personWords) ? data.personWords : [];
    const importedAllKanji = Array.isArray(data.allKanji) ? data.allKanji : [];
    const counts = { files: 0, words: 0, personWords: 0, kanji: 0 };

    const existingFolderIds = new Set(folders.map((f) => f.id));
    importedFolders.forEach((f) => {
      if (f && f.id && !existingFolderIds.has(f.id)) {
        folders.push(f);
        existingFolderIds.add(f.id);
      }
    });

    const existingFileIds = new Set(savedFiles.map((f) => f.id));
    importedFiles.forEach((f) => {
      if (f && f.id && !existingFileIds.has(f.id)) {
        migrateFileTitle(f);
        savedFiles.push(f);
        existingFileIds.add(f.id);
        counts.files += 1;
      }
    });

    const existingWords = new Set(savedWords);
    importedWords.forEach((w) => {
      if (typeof w === 'string' && w && !existingWords.has(w)) {
        savedWords.push(w);
        existingWords.add(w);
        counts.words += 1;
      }
    });

    // 人名登録は単語帳に存在する単語の分だけ取り込む
    importedPersonWords.forEach((w) => {
      if (typeof w === 'string' && existingWords.has(w) && !personWords.has(w)) {
        personWords.add(w);
        counts.personWords += 1;
      }
    });

    // 全漢字はバックアップ内の登録順を保ったまま末尾に足し、続けて単語に含まれる漢字も足す
    // （アプリ内で単語を登録したときと同じく、単語の漢字は全漢字にも入っている状態にそろえる）
    const kanjiBefore = allKanji.length;
    addAllKanji(importedAllKanji.filter((ch) => typeof ch === 'string').join(''));
    addAllKanji(importedWords.filter((w) => typeof w === 'string').join(''));
    counts.kanji = allKanji.length - kanjiBefore;

    persistFolders();
    persistSavedFiles();
    persistWords();
    persistPersonWords();
    return counts;
  }

  exportBtn.addEventListener('click', exportBackup);

      try {
        data = JSON.parse(String(reader.result));
      } catch (e) {
        alert('ファイルの読み込みに失敗しました（JSON形式が正しくないようです）');
        return;
      }
      if (!data || (data.app !== 'pinyin-helper' &&
          !['savedFiles', 'folders', 'words', 'personWords', 'allKanji'].some((k) => Array.isArray(data[k])))) {
        alert('このファイルはバックアップ形式ではないようです');
        return;
      }
      const c = mergeImportedBackup(data);
      renderListRows();
      refreshWordbookIfOpen();
      refreshAllKanjiIfOpen();
      const parts = [];
      if (c.files) parts.push('ファイル' + c.files + '件');
      if (c.words) parts.push('単語' + c.words + '件');
      if (c.personWords) parts.push('人名登録' + c.personWords + '件');
      if (c.kanji) parts.push('漢字' + c.kanji + '字');
      alert(parts.length
        ? parts.join('、') + 'を読み込みました（既存のデータはそのまま残っています）'
        : '新しく追加されたデータはありませんでした（すでに読み込み済みの可能性があります）');
    };
    reader.readAsText(file);
  });

  // 開いているファイルのタイトルを入力ページの2段目に表示（まだタイトルのない新規ファイルは「無題」）
  function setTitleDisplay(title) {

  // 保存時にタイトルが空欄だったときに使う自動タイトル：先頭の文字を適度な文字数だけ抽出
  function defaultTitleFromText(text) {
    const flat = text.replace(/\s+/g, '').trim();
    if (!flat) return '無題';
    return flat.length > 14 ? flat.slice(0, 14) + '…' : flat;
  }

  // 現在の内容が、最後に保存した状態から変わっているか（未保存の変更があるか）
  function isDirty() {
    if (currentFileId) {

      if (!f) return false;
      return f.text !== input.value;

    return input.value.trim() !== '';
  }

  // 既存ファイルの内容を保存する
  function saveExistingFile() {
    const idx = savedFiles.findIndex((f) => f.id === currentFileId);
    if (idx < 0) return;
    savedFiles[idx].text = input.value;
    savedFiles[idx].mode = 'sentence'; // 単漢字モードは廃止。以前のバージョン向けに項目だけ残す
    savedFiles[idx].updatedAt = Date.now();
    persistSavedFiles();
  }

  // 一覧や新規作成へ移動する前に呼ぶ：一度でも保存済みのファイルに未保存の変更があれば自動保存する。
  // まだ一度も保存していない新規ファイルは、確認なしで破棄してよい。
  function autoSaveBeforeLeaving() {

  }

    const typedTitle = modalTitleInput.value.trim();

    if (modalContext.mode === 'rename') {

      let title = typedTitle;
      if (idx >= 0) {

        if (!title) title = defaultTitleFromText(savedFiles[idx].text || '');
        savedFiles[idx].title = title;
        persistSavedFiles();
      }
      if (modalContext.fileId === currentFileId) setTitleDisplay(title);
      if (!listScreen.hidden) renderListRows();
    } else {
      const title = typedTitle || defaultTitleFromText(input.value);
      const file = {
        id: 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
        title: title,
        mode: 'sentence', // 単漢字モードは廃止。以前のバージョン向けに項目だけ残す
        text: input.value,
        folderId: null, // アコーディオン化により「今開いているフォルダ」という概念がないため常にルートへ保存
        updatedAt: Date.now(),
      };
      savedFiles.unshift(file); // 新規保存は一覧の先頭へ。以降は手動の並び順を保持
      persistSavedFiles();
      currentFileId = file.id;
      setTitleDisplay(title);
      updateSaveBtnDirtyState();
    }
    closeSaveModal();
  });

  // ================= 保存一覧ページ =================
  // 保存一覧ページを表示する直前に呼ぶ：一覧を今の状態に合わせて作り直す
  function prepareListScreen() {
    renderListRows();
  }

  function emptyRow(msg) {
    const empty = document.createElement('div');
    empty.className = 'listEmpty';
    empty.textContent = msg;
    return empty;
  }

  // iOSの「設定」アプリのように、角丸のカード（セクション）の中に行を並べる。
  // 上のカード：新規フォルダ＋フォルダ（展開中はその下に中のファイル）、下のカード：フォルダに入っていないファイル
  function renderListRows() {
    listRows.innerHTML = '';

    const folderSection = document.createElement('div');
    folderSection.className = 'listSection';
    const newFolderBtn = document.createElement('button');
    newFolderBtn.type = 'button';
    newFolderBtn.className = 'newFolderRow';
    newFolderBtn.innerHTML = FOLDER_PLUS_SVG + '<span>新規フォルダ</span>';
    newFolderBtn.addEventListener('click', createFolderFlow);
    folderSection.appendChild(newFolderBtn);

    folders.forEach((folder) => {
      folderSection.appendChild(makeFolderRow(folder));
      if (!expandedFolders.has(folder.id)) return;
      const body = document.createElement('div');
      body.className = 'folderBody';
      const inFolder = savedFiles.filter((f) => (f.folderId || null) === folder.id);
      if (!inFolder.length) {
        body.appendChild(emptyRow('このフォルダは空です'));
      } else {
        inFolder.forEach((file) => body.appendChild(makeListRow(file)));
      }
      folderSection.appendChild(body);
    });
    listRows.appendChild(folderSection);

    const rootFiles = savedFiles
      .filter((f) => !f.folderId || !folders.some((d) => d.id === f.folderId));
    if (!folders.length && !rootFiles.length) {
      listRows.appendChild(emptyRow('保存された内容はまだありません'));
      return;
    }
    if (!rootFiles.length) return;
    const fileSection = document.createElement('div');
    fileSection.className = 'listSection';
    rootFiles.forEach((file) => fileSection.appendChild(makeListRow(file)));
    listRows.appendChild(fileSection);
  }

  // 保存済みファイルを複製する。複製は元ファイルのすぐ後ろに挿入する
  function duplicateFile(file) {
    const copy = Object.assign({}, file, {
      id: 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      updatedAt: Date.now(),
    });
    const idx = savedFiles.findIndex((f) => f.id === file.id);
    savedFiles.splice(idx + 1, 0, copy);
    persistSavedFiles();
    renderListRows();
  }

    actions.className = 'listRowActions';

      e.stopPropagation();

    dup.type = 'button';

    dup.addEventListener('click', (e) => {
      e.stopPropagation();
      duplicateFile(file);
    });

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'rowActionBtn actDelete';
    del.innerHTML = TRASH_SVG + '<span>削除</span>';

      e.stopPropagation();

    const meta = document.createElement('span');
    meta.className = 'listMeta';

    const editBtn = document.createElement('button');
    editBtn.type = 'button';

    editBtn.setAttribute('aria-label', 'タイトルを編集');
    editBtn.title = 'タイトルを編集';
    // editBtnはrow内部の子要素なので、rowのタップ判定（ファイルを開く）に巻き込まれないようpointerdown段階で止める
    editBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
