    '圆': '円', '缘': '縁', '龟': '亀', '归': '帰',
    '让': '譲', '围': '囲', '稳': '穏',
    '聪': '聡', '乡': '郷', '觉': '覚', '险': '険', '关': '関', '欢': '歓', '怀': '懐',
    '卖': '売', '广': '広',
    '观': '観', '馆': '館', '佛': '仏', '荡': '蕩', '恼': '悩', '泪': '涙', '猎': '猟', '绿': '緑',
    '价': '価', '劝': '勧', '摄': '摂', '转': '転',
    '烧': '焼', '赞': '賛', '脏': '臓',
    '岁': '歳', '儿': '児',
    '济': '済', '纵': '縦',
    // 右側が「靑」の晴（異体字）。日本の字体では普通の「晴」になる
    '暒': '晴',
  };
  function toJapaneseKanji(text) {
    let out = '';
    for (const raw of text) {
      // 「晴」(U+FA12)のような互換漢字は見た目が旧字体でも中身は同じ字なので、先に通常の字(U+6674など)へ正規化する
      const ch = raw.normalize('NFC');
      if (JA_KANJI_PREFERRED[ch]) out += JA_KANJI_PREFERRED[ch];
      else if (JA_KANJI_NO_CONVERT.has(ch)) out += ch;
      else out += JA_KANJI_MAP[ch] || ch;
    }
    return out;
  }
  // elの中身をtextで置き換える。日本漢字表示ONのときは、実際に字形が変わった文字だけ
  // <span class="jaChanged">で包んで色を付ける（変わらない文字は普通のテキストのまま）。
  function renderDisplayText(el, text) {
    el.textContent = '';
    if (!state.jaKanjiOn) {
      el.textContent = text;
      return;
    }
    for (const ch of text) {
      const converted = toJapaneseKanji(ch);
      if (converted !== ch) {
        const span = document.createElement('span');
        span.className = 'jaChanged';
        span.textContent = converted;
        el.appendChild(span);
      } else {
        el.appendChild(document.createTextNode(ch));
      }
    }
  }

  // ---------- app state ----------
  const state = {
    mode: 'sentence',      // 'sentence' | 'kanji'
    toneType: 'symbol',    // 'symbol' | 'num' (どちらか一方のみ表示。併記はしない)
    contourOn: false,      // true のときはアルファベットを隠し、声調を高低カーブのSVG記号で表示する
    pinyinOff: false,      // true のときはピンインも声調カーブも一切表示しない（contourOnとは同時にtrueにならない）
    reordering: false,
    focusMode: false,
    groupedView: false,    // 単漢字モードでグループ分け済みかどうか（グループが1つだけでも true になりうる）
    jaKanjiOn: false,      // true のときは漢字の表示だけ日本の字体に変換する（内部データ・ピンイン計算には影響しない）
  };

  let currentFileId = null;
  let undoStack = [];      // 直近5件までの編集前スナップショット
  let lastCommittedValue = '';
  let typingTimer = null;
  let burstStartValue = '';

  // ================= 変換結果のキャッシュ =================
  // pinyin-proの変換は1回なら速いが、単語帳の描画・並び替えでは同じ単語を何千回も変換することになるので、
  // 結果を覚えておく（読みは単語と表記の種類だけで決まり、途中で変わらない）。
  // 入力欄の文章も通るので、件数が増えすぎたら丸ごと捨てて作り直す。
  // 返す配列・オブジェクトは共有されるので、呼び出し側で書き換えないこと。
  const CACHE_LIMIT = 20000;
  function memo(map, key, compute) {
    if (map.has(key)) return map.get(key);
    const value = compute();
    if (map.size >= CACHE_LIMIT) map.clear();
    map.set(key, value);
    return value;
  }
  const segmentCache = new Map();
  // textを単語区切りつきで変換した結果（pp.segmentのAllArray形式）。失敗したら[]
  function segmentCached(text, toneType) {
    return memo(segmentCache, toneType + '\u0000' + text, () => {
      if (!pp || !pp.segment) return [];
      try {
        return pp.segment(text, { format: pp.OutputFormat.AllArray, toneType: toneType });
      } catch (e) { return []; }
    });
  }

  // ================= pinyin table order (ju/qu/xu のような並び用) =================
  const INITIAL_LIST = ['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s','y','w'];
  const INITIAL_ORDER = ['b','p','m','f','d','t','n','l','g','k','h','j','q','x','zh','ch','sh','r','z','c','s','y','w',''];
  const FINAL_ORDER = [
    'a','o','e','ai','ei','ao','ou','an','en','ang','eng','ong','er',
    'i','ia','ie','iao','iu','ian','in','iang','ing','iong',
    'u','ua','uo','uai','ui','uan','un','uang','ueng',
    'v','ve','van','vn'
  ];

  function splitPinyinBase(base) {
    for (const ini of INITIAL_LIST) {
      if (base.indexOf(ini) === 0 && base.length > ini.length) {
        let final = base.slice(ini.length).replace(/^ü/, 'v');
        if ((ini === 'j' || ini === 'q' || ini === 'x') && final.charAt(0) === 'u') {
          final = 'v' + final.slice(1);
        }
        return { initial: ini, final: final };
      }
    }
    return { initial: '', final: base.replace(/^ü/, 'v') };
  }

  function pinyinGroupRank(base) {
    const parts = splitPinyinBase(base || '');
    let ir = INITIAL_ORDER.indexOf(parts.initial);
    if (ir < 0) ir = INITIAL_ORDER.length;
    let fr = FINAL_ORDER.indexOf(parts.final);
    if (fr < 0) fr = FINAL_ORDER.length;
    return [ir, fr];
  }

  function compareGroupKeys(a, b) {
    const ra = pinyinGroupRank(a);
    const rb = pinyinGroupRank(b);
    if (ra[0] !== rb[0]) return ra[0] - rb[0];
    if (ra[1] !== rb[1]) return ra[1] - rb[1];
    return a < b ? -1 : a > b ? 1 : 0;
  }

  // ================= 単語帳の並び替え（登録順／ピンイン順／声調順） =================
  // ピンイン順：単語を音節ごとにINITIAL_ORDER/FINAL_ORDERの表（あいうえお順相当）で比較する
  const pinyinRanksCache = new Map();
  function pinyinRanksForWord(word) {
    return memo(pinyinRanksCache, word, () => Array.from(word).map((ch) => pinyinGroupRank(getBasePinyin(ch))));
  }
  function comparePinyinWords(a, b) {
    const ra = pinyinRanksForWord(a);
    const rb = pinyinRanksForWord(b);
    const len = Math.min(ra.length, rb.length);
    for (let i = 0; i < len; i++) {
      if (ra[i][0] !== rb[i][0]) return ra[i][0] - rb[i][0];
      if (ra[i][1] !== rb[i][1]) return ra[i][1] - rb[i][1];
    }
    if (ra.length !== rb.length) return ra.length - rb.length;
    return a < b ? -1 : a > b ? 1 : 0;
  }
  // 声調順：漢字1文字だけを切り出して調べると「一」「不」のような変調や、重ね言葉の軽声が
  // 元の（変化前の）声調のまま拾われてしまう。単語全体をピンイン変換してから声調を拾うことで、
  // その単語として実際に読まれる声調（変調・軽声を含む）で比較する。
  function getWordToneDigits(word) {
    if (!pp || !pp.segment) return Array.from(word).map(() => '');
    const groups = segmentCached(word, 'num');
    const chars = groups.length
      ? groups.reduce((acc, g) => acc.concat(g), [])
      : Array.from(word).map((c) => ({ result: c }));
    return chars.map(({ result }) => {
      const m = /([0-5])$/.exec(result || '');
      return m ? m[1] : '';
    });
  }
  // 声調順：1文字目・2文字目の声調の組み合わせ（例：1声+2声）でグループ化して並べる。
  // 3文字以上の単語も先頭2文字の声調だけで判定する。同じ組み合わせの中はピンイン順。
  // pinyin-proは軽声を末尾「0」（まれに「5」）で表すので、どちらも同じ「0」として扱う。
  const TONE_GROUP_ORDER = ['1', '2', '3', '4', '0'];
  const TONE_GROUP_NAME = { '1': '1声', '2': '2声', '3': '3声', '4': '4声', '0': '軽声' };
  function normalizeToneDigit(d) {
    return d === '5' ? '0' : d;
  }
  function toneGroupRank(digit) {
    const idx = TONE_GROUP_ORDER.indexOf(digit);
    return idx >= 0 ? idx : TONE_GROUP_ORDER.length;
  }
  // 1文字だけの単語は2文字目の声調が存在しないので''のまま返す（呼び出し側で個別に扱う）
  const wordToneGroupCache = new Map();
  function wordToneGroupDigits(word) {
    return memo(wordToneGroupCache, word, () => {
      const digits = getWordToneDigits(word).map(normalizeToneDigit);
      return [digits[0] || '', digits[1] || ''];
    });
  }
  function compareToneWords(a, b) {
    const [a1, a2] = wordToneGroupDigits(a);
    const [b1, b2] = wordToneGroupDigits(b);
    const r1 = toneGroupRank(a1) - toneGroupRank(b1);
    if (r1 !== 0) return r1;
    const r2 = toneGroupRank(a2) - toneGroupRank(b2);
    if (r2 !== 0) return r2;
    return comparePinyinWords(a, b);
  }
  // アプリを開いたときは常に登録順から始める（前回の並び順は引き継がない）
  let wordSortMode = 'registered';
  function updateWordSortBtnsUI() {
    wordSortBtns.forEach((btn) => btn.classList.toggle('active', btn.dataset.sort === wordSortMode));
  }
  updateWordSortBtnsUI();
  function getSortedWords() {
    const list = savedWords.slice();
    if (wordSortMode === 'pinyin') list.sort(comparePinyinWords);
    else if (wordSortMode === 'tone') list.sort(compareToneWords);
    return list;
  }

  // ================= pinyin lookup helpers =================
  const basePinyinCache = new Map();
  function getBasePinyin(ch) {
    return memo(basePinyinCache, ch, () => {
      if (!pp || !pp.pinyin) return '';
      try { return pp.pinyin(ch, { toneType: 'none', multiple: false }) || ''; } catch (e) { return ''; }
    });
  }
  // 声調の数字1文字だけ取り出す（単漢字モードで123トグルON時に使う）
  const toneDigitCache = new Map();
  function getToneDigit(ch) {
    return memo(toneDigitCache, ch, () => {
      if (!pp || !pp.pinyin) return '';
      try {
        const withNum = pp.pinyin(ch, { toneType: 'num', multiple: false }) || '';
        // pinyin-proは軽声を末尾「0」で表す（「5」ではない）ので両方拾う
        const m = withNum.match(/([0-5])$/);
        return m ? m[1] : '';
      } catch (e) { return ''; }
    });
  }
  // 単語の中で各漢字が実際にどう読まれているか（声調なしの音と声調番号）。単語ごとに結果をキャッシュする
  const wordReadingCache = new Map();
  function getWordCharReadings(word) {
    return memo(wordReadingCache, word, () =>
      segmentCached(word, 'num').reduce((acc, g) => acc.concat(g), []).map(({ origin, result }) => {
        const m = /^(.*?)([0-5])?$/.exec(result || '');
        return { ch: origin, base: m[1], tone: normalizeToneDigit(m[2] || '') };
      }));
  }
  // 漢字の読みを「声調なしの音 → 代表の声調」のMapで返す（全漢字ページ用）。
  // 標準の読み（pinyin-proの多音字リストの先頭。1文字単独での変換だと「了」がliǎoになるため使わない）は
  // 常に入れ、それ以外の読みは単語帳にその読みで
  // 使われている単語があるときだけ入れる（あまり使わない読みまで並ぶとノイズになるため）。
  // 声調は辞書のその音の最初の軽声以外の声調を代表にし（好 hǎo/hào → 3声）、軽声でしか読まない音だけ'0'。
  // 辞書に無い読み（カスタム読み等）は単語の中で実際に読まれている声調を使う。
  function getCharReadings(ch) {
    const dictTones = new Map();
    let standardBase = '';
    if (pp && pp.pinyin) {
      try {
        pp.pinyin(ch, { toneType: 'num', multiple: true, type: 'array' }).forEach((r) => {
          const m = /^(.*?)([0-5])?$/.exec(r || '');
          const base = m[1];
          const tone = normalizeToneDigit(m[2] || '');
          if (!base) return;
          if (!standardBase) standardBase = base;
          if (!dictTones.has(base) || (dictTones.get(base) === '0' && tone !== '0')) dictTones.set(base, tone);
        });
      } catch (e) { /* noop */ }
    }
    const readings = new Map();
    const add = (base, tone) => {
      if (!base || readings.has(base)) return;
      readings.set(base, dictTones.has(base) ? dictTones.get(base) : tone);
    };
    if (standardBase) add(standardBase, '');
    else add(getBasePinyin(ch), normalizeToneDigit(getToneDigit(ch)));
    wordsContaining(ch).forEach((w) => {
      getWordCharReadings(w).forEach((r) => { if (r.ch === ch) add(r.base, r.tone); });
    });
    return readings;
  }
  // 出現頻度の順位（小さいほどよく使う）。頻度表に無い漢字は表の後ろ扱い
  let charFreqRankMap = null;
  function charFreqRank(ch) {
    if (!charFreqRankMap) {
      charFreqRankMap = new Map();
      Array.from(typeof CHAR_FREQ_ORDER === 'string' ? CHAR_FREQ_ORDER : '').forEach((c, i) => charFreqRankMap.set(c, i));
    }
    return charFreqRankMap.has(ch) ? charFreqRankMap.get(ch) : charFreqRankMap.size;
  }
  // 漢字 → その漢字を含む登録単語の一覧（単語帳と同じ並び）の索引。
  // 全漢字ページでは漢字1字ごとに引くので、毎回全単語を調べずに済むよう一度だけ作る。
  // 単語帳が変わったら（persistWords）捨てて、次に使うときに作り直す。
  let wordsByCharIndex = null;
  function wordsContaining(ch) {
    if (!wordsByCharIndex) {
      wordsByCharIndex = new Map();
      savedWords.forEach((w) => {
        new Set(w).forEach((c) => {
          if (!wordsByCharIndex.has(c)) wordsByCharIndex.set(c, []);
          wordsByCharIndex.get(c).push(w);
        });
      });
    }
    return wordsByCharIndex.get(ch) || [];
  }
  // その漢字を含む単語のうち、base指定時はその漢字がbaseの音で読まれている単語だけを返す
  function wordsForChar(ch, base) {
    const list = wordsContaining(ch);
    if (!base) return list;
    return list.filter((w) => getWordCharReadings(w).some((r) => r.ch === ch && r.base === base));
  }
  // 声調カーブの記号を出す：data-toneに声調番号を入れると、CSS（[data-tone]）がその形を描く。
  // 声調が分からないとき（''）は何も描かない
  function setToneContour(el, digit) {
    if (digit) el.dataset.tone = digit;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // 単語区切りを考慮してピンインを組み立てる（単語内はくっつけ、単語間はスペース）
  function lineToPinyin(normalizedLine) {
    if (!pp || !pp.segment) return '';
    return segmentCached(normalizedLine, state.toneType)
      .map((group) => group.map((g) => g.result).join(''))
      .join(' ');
  }

  // 漢字1文字ずつの下にその声調カーブSVGを揃えて配置する行を作る（アルファベット非表示のとき共通で使う）
  function appendContourCols(row, text) {
    const groups = segmentCached(text, 'num');
    const chars = groups.length
      ? groups.reduce((acc, g) => acc.concat(g), [])
      : Array.from(text).map((c) => ({ origin: c, result: c }));

    chars.forEach(({ origin, result }) => {
      const col = document.createElement('span');
      col.className = 'cCol';

      const charEl = document.createElement('span');
      charEl.className = 'cChar';
      renderDisplayText(charEl, origin);
      col.appendChild(charEl);

      const toneEl = document.createElement('span');
      toneEl.className = 'cTone';
      const m = /([0-5])$/.exec(result || '');
      if (m) setToneContour(toneEl, m[1]);
      col.appendChild(toneEl);

      row.appendChild(col);
    });
  }

  // 文章モード用：行全体を漢字＋声調カーブの行にする
  function buildContourBlock(normalizedLine) {
    const block = document.createElement('div');
    block.className = 'lineBlock contourBlock';

    const row = document.createElement('div');
    row.className = 'contourRow';
    appendContourCols(row, normalizedLine);

    block.appendChild(row);
    return block;
  }

  // 単語帳用：チップの中に収まる小さめの漢字＋声調カーブの行を作る
  function buildWordContourRow(word) {
    const row = document.createElement('div');
    row.className = 'contourRow wordChipContourRow';
    appendContourCols(row, word);
    return row;
  }

  // ================= surume（背景キャラ） =================
  let hasText = false;
  function updateSurume(nextHasText) {
    if (nextHasText === hasText) return;
    hasText = nextHasText;
    if (!surume) return;
    if (hasText) {
      surume.classList.remove('leaving', 'visible');
      void surume.offsetWidth;
      surume.classList.add('enter');
    } else {
      surume.classList.remove('enter', 'visible');
      void surume.offsetWidth;
      surume.classList.add('leaving');
    }
  }
  if (surume) {
    surume.addEventListener('animationend', (e) => {
      if (e.animationName === 'peekIn') {
        surume.classList.remove('enter');
        surume.classList.add('visible');
      } else if (e.animationName === 'peekOut') {
        surume.classList.remove('leaving');
      }
    });
  }

  // ================= undo (元に戻す) =================
  function pushUndo(val) {
    clearTimeout(typingTimer);
    typingTimer = null;
    if (undoStack[undoStack.length - 1] === val) return;
    undoStack.push(val);
    if (undoStack.length > 5) undoStack.shift();
    undoBtn.disabled = undoStack.length === 0;
  }

  function commitInputValue(newValue, opts) {
    const skipUndo = opts && opts.skipUndo;
    if (!skipUndo && input.value !== newValue) {
      pushUndo(input.value);
    }
    input.value = newValue;
    lastCommittedValue = newValue;
    autoGrow();
  }

  undoBtn.addEventListener('click', () => {
    if (!undoStack.length) return;
    clearTimeout(typingTimer);
    typingTimer = null;
    const prev = undoStack.pop();
    input.value = prev;
    lastCommittedValue = prev;
    undoBtn.disabled = undoStack.length === 0;
    autoGrow();
    renderCurrentMode();
  });

  // ================= 文章モード =================
  function renderSentence() {
    const raw = input.value;
    const trimmed = raw ? raw.trim() : '';

    if (trimmed === '') {
      results.innerHTML = '<div class="emptyState"></div>';
      return;
    }

    const lines = raw.split('\n');
    const frag = document.createDocumentFragment();

    lines.forEach((line) => {
      if (line.trim() === '') return;

      const normalized = normalizeToSimplified(line);

      if (state.pinyinOff) {
        const block = document.createElement('div');
        block.className = 'lineBlock';
        const zhDiv = document.createElement('div');
        zhDiv.className = 'zhLine';
        renderDisplayText(zhDiv, normalized);
        block.appendChild(zhDiv);
        frag.appendChild(block);
        return;
      }

      if (state.contourOn) {
        frag.appendChild(buildContourBlock(normalized));
        return;
      }

      const pyText = lineToPinyin(normalized);

      const block = document.createElement('div');
      block.className = 'lineBlock';

      const zhDiv = document.createElement('div');
      zhDiv.className = 'zhLine';
      renderDisplayText(zhDiv, normalized);

      const pyDiv = document.createElement('div');
      pyDiv.className = 'pyLine';
      pyDiv.textContent = pyText;

      block.appendChild(zhDiv);
      block.appendChild(pyDiv);
      frag.appendChild(block);
    });

    results.innerHTML = '';
    results.appendChild(frag);
    results.scrollTop = results.scrollHeight;
  }

  // ================= 単漢字モード =================
  // テキストエリアの内容そのものを正とする：行＝グループ。1行のみなら「未グループ」表示。
  function parseKanjiLines(rawText) {
    const normalized = normalizeToSimplified(rawText);
    const rawLines = normalized.split('\n');
    const seen = new Set();
    const lines = [];
    rawLines.forEach((line) => {
      const chars = [];
      for (const ch of line) {
        if (!HANZI_RE.test(ch)) continue;
        if (seen.has(ch)) continue;
        seen.add(ch);
        chars.push(ch);
      }
      if (chars.length) lines.push(chars);
    });
    return lines;
  }

  // 漢字だけを大きく表示。声調数字は123トグルON時のみ右肩に小さく（絶対配置なのでレイアウトは動かない）。
  // mismatch=true のときは、そのグループの代表音と読みが違う＝警告色で表示。
  // 単語帳にその漢字を含む単語が1つもないときはタップしても何も起きないので、少し薄い色で示す。
  // opts.base/opts.tone（全漢字ページ用）：多音字をどの読みとして表示しているか。
  // 指定時は声調表示をその読みの声調にし、タップで出す単語もその読みのものだけに絞る。
  // opts.alwaysShowTone：123ボタンがOFFでも声調数字を表示する（全漢字ページの各声調の先頭用）。
  function makeCard(ch, mismatch, opts) {
    const base = (opts && opts.base) || '';
    const toneDigit = opts && opts.tone != null ? opts.tone : getToneDigit(ch);
    const hasWord = wordsForChar(ch, base).length > 0;
    const card = document.createElement('div');
    card.className = 'kcard' + (state.contourOn ? ' contourOn' : '');
    card.dataset.char = ch;
    if (base) card.dataset.base = base;

    const hz = document.createElement('span');
    hz.className = 'khz' + (mismatch ? ' mismatch' : '') + (hasWord ? '' : ' noWord');
    renderDisplayText(hz, ch);
    card.appendChild(hz);

    if (state.contourOn) {
      const contour = document.createElement('span');
      contour.className = 'kcontour';
      setToneContour(contour, toneDigit);
      card.appendChild(contour);
    } else {
      const tone = document.createElement('span');
      tone.className = 'ktone';
      const showTone = (state.toneType === 'num' && !state.pinyinOff) || (opts && opts.alwaysShowTone);
      tone.textContent = showTone ? toneDigit : '';
      card.appendChild(tone);
    }

    card.addEventListener('click', () => {
      if (state.reordering || !hasWord) return;
      openWordSheetFor(ch, card, base);
    });

    return card;
  }

  const WARN_ICON_SVG = '<svg class="kgroupWarnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>';

  // ================= 単漢字タップ時の単語シート =================
  // 登録済み単語にその漢字を含むものがあれば下からシートを出す。無ければ何もしない（現状維持）。
  let activeWordCard = null;
  let activeWordChar = null;
  let activeWordBase = '';
  function setActiveWordCard(card) {
    if (activeWordCard && activeWordCard !== card) activeWordCard.classList.remove('wordActive');
    activeWordCard = card || null;
    if (activeWordCard) activeWordCard.classList.add('wordActive');
  }
  // 現在の表示設定（声調123／声調カーブ／日本字体）に合わせて中身だけを作り直す
  function renderWordSheetContent(ch, base) {
    const matches = wordsForChar(ch, base);
    wordSheetList.innerHTML = '';
    matches.forEach((w) => {
      const item = document.createElement('div');
      item.className = 'wordSheetItem';
      if (state.contourOn) {
        const row = document.createElement('div');
        row.className = 'contourRow';
        appendContourCols(row, w);
        item.appendChild(row);
      } else {
        const hz = document.createElement('div');
        hz.className = 'wordSheetHz';
        renderDisplayText(hz, w);
        const py = document.createElement('div');
        py.className = 'wordSheetPy';
        py.textContent = state.pinyinOff ? '' : lineToPinyin(w);
        if (personWords.has(w)) {
          const icon = document.createElement('span');
          icon.className = 'wordSheetPersonIcon';
          icon.innerHTML = PERSON_SVG;
          py.appendChild(icon);
        }
        item.appendChild(hz);
        item.appendChild(py);
      }
      wordSheetList.appendChild(item);
    });
    return matches.length;
  }
  function openWordSheetFor(ch, cardEl, base) {
    if (!renderWordSheetContent(ch, base)) return;
    activeWordChar = ch;
    activeWordBase = base || '';
    // タップした漢字が画面下半分にある場合は、シートに隠れないよう上から出す
    if (cardEl) {
      const rect = cardEl.getBoundingClientRect();
      wordSheet.classList.toggle('fromTop', rect.top > window.innerHeight / 2);
    }
    wordSheet.classList.add('open');
    setActiveWordCard(cardEl);
  }
  function closeWordSheet() {
    wordSheet.classList.remove('open');
    setActiveWordCard(null);
    activeWordChar = null;
    activeWordBase = '';
  }
  // 声調123／声調カーブ／日本字体の表示設定が変わったとき用。呼び出し側は
  // renderCurrentMode(true)でシート自体を閉じずに描画し直しているので、ここでは
  // 新しい表示設定のカードを探して中身だけを作り直す（'open'クラスは既に付いたままなので
  // classList.addは何もしない＝閉じるアニメーションは一切発生しない）
  function reopenWordSheetIfNeeded(ch, base) {
    if (!ch) return;
    // シートは単漢字モードのグリッドか全漢字ページのグリッドのどちらからでも開けるので、
    // 今表示されている方を探す
    const grid = !allKanjiScreen.hidden ? allKanjiGrid : kanjiGrid;
    // 全漢字ページでは同じ漢字が複数の読みのグループに出るので、読み(data-base)まで一致するカードを探す
    const sel = '.kcard[data-char="' + CSS.escape(ch) + '"]' + (base ? '[data-base="' + CSS.escape(base) + '"]' : '');
    const card = grid.querySelector(sel);
    openWordSheetFor(ch, card, base);
  }
  // カードでもシート自身でも表示切り替えボタンでもない場所をタップしたら閉じる
  document.addEventListener('click', (e) => {
    if (!wordSheet.classList.contains('open')) return;
    if (e.target.closest('#wordSheet')) return;
    if (e.target.closest('.kcard')) return;
    if (e.target.closest('#toolFooter')) return;
    closeWordSheet();
  });

  function renderKanjiMode() {
    const lines = parseKanjiLines(input.value);
    kanjiGrid.innerHTML = '';

    if (!lines.length) {
      kanjiGrid.innerHTML = '<div class="emptyState"></div>';
      updateKanjiToolbarUI(0, false);
      return;
    }

    // state.groupedView が true（＝グループ分け実行済み）のときだけ、グループ見出し・不一致警告を出す。
    // 同じピンインの漢字しかなくグループが1つだけになった場合でも、実行済みなら見出しを表示する。
    const isGroupedView = state.groupedView;
    lines.forEach((chars) => {
      const wrap = document.createElement('div');
      wrap.className = 'kgroup';

      let labelKey = '';
      if (isGroupedView) {
        labelKey = getBasePinyin(chars[0]) || '';
        const hasMismatch = chars.some((ch) => getBasePinyin(ch) !== labelKey);
        const label = document.createElement('div');
        label.className = 'kgroupLabel';
        label.innerHTML = '<span>' + escapeHtml(labelKey) + '</span>' + (hasMismatch ? WARN_ICON_SVG : '');
        wrap.appendChild(label);
      }

      const row = document.createElement('div');
      row.className = 'kgroupRow';
      chars.forEach((ch) => {
        const mismatch = isGroupedView && getBasePinyin(ch) !== labelKey;
        row.appendChild(makeCard(ch, mismatch));
      });
      wrap.appendChild(row);
      kanjiGrid.appendChild(wrap);
    });

    const total = lines.reduce((n, chars) => n + chars.length, 0);
    updateKanjiToolbarUI(total, isGroupedView);

    if (state.reordering) attachDragHandlers();
  }

  // ================= 全漢字ページ =================
  // 登録済みの漢字を常にピンインでグループ化して表示する。
  // 子音インデックス（右端の目次）でジャンプする先の見出しがない“無子音”の音（ā/ān等）用のラベル
  const ALL_KANJI_INDEX_NO_INITIAL_LABEL = '·';

  function renderAllKanjiGrid() {
    allKanjiGrid.innerHTML = '';
    allKanjiIndex.innerHTML = '';
    if (!allKanji.length) {
      allKanjiGrid.innerHTML = '<div class="listEmpty">まだ漢字が登録されていません</div>';
      return;
    }

    // 多音字は標準の読みのグループに加え、単語帳で使われている読みのグループにも出す（例：长はchangとzhang）。
    // グループ内は声調順（1→2→3→4→軽声）、同じ声調の中は出現頻度順、頻度表に無いもの同士は登録順
    // （sortは安定なので登録順が保たれる）。
    const groups = new Map();
    allKanji.forEach((ch) => {
      const readings = getCharReadings(ch);
      if (!readings.size) readings.set(ch, '');
      readings.forEach((tone, key) => {
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push({ ch, tone });
      });
    });
    groups.forEach((list) => list.sort((a, b) =>
      (toneGroupRank(a.tone) - toneGroupRank(b.tone)) || (charFreqRank(a.ch) - charFreqRank(b.ch))));

    const orderedKeys = Array.from(groups.keys()).sort(compareGroupKeys);
    const frag = document.createDocumentFragment();
    const indexFrag = document.createDocumentFragment();
    let lastInitial = null;
    orderedKeys.forEach((key) => {
      const initial = splitPinyinBase(key).initial;

      const wrap = document.createElement('div');
      wrap.className = 'kgroup';
      wrap.dataset.initial = initial;

      const label = document.createElement('div');
      label.className = 'kgroupLabel';
      label.innerHTML = '<span>' + escapeHtml(key) + '</span>';
      wrap.appendChild(label);

      const row = document.createElement('div');
      row.className = 'kgroupRow';
      // 同じ声調の並びの先頭の漢字だけは、123ボタンの状態に関係なく声調数字を常に出す
      let prevTone = null;
      groups.get(key).forEach(({ ch, tone }) => {
        row.appendChild(makeCard(ch, false, { base: key, tone, alwaysShowTone: tone !== prevTone }));
        prevTone = tone;
      });
      wrap.appendChild(row);

      frag.appendChild(wrap);

      // 同じ子音が続く間はインデックスに1つだけ出す（グループの先頭に飛べればよい）
      if (initial !== lastInitial) {
        lastInitial = initial;
        const item = document.createElement('div');
        item.className = 'allKanjiIndexItem';
        item.dataset.initial = initial;
        item.textContent = initial || ALL_KANJI_INDEX_NO_INITIAL_LABEL;
        indexFrag.appendChild(item);
      }
    });
    allKanjiGrid.appendChild(frag);
    allKanjiIndex.appendChild(indexFrag);
  }

  // 全漢字ページの右端インデックスをタップ／ドラッグして、その子音の先頭グループへジャンプする
  function jumpAllKanjiToInitial(initial) {
    const target = allKanjiGrid.querySelector('.kgroup[data-initial="' + CSS.escape(initial) + '"]');
    if (target) target.scrollIntoView({ block: 'start' });
  }
  function allKanjiIndexItemAt(x, y) {
    const el = document.elementFromPoint(x, y);
    return el ? el.closest('.allKanjiIndexItem') : null;
  }
  let allKanjiIndexActiveEl = null;
  function setAllKanjiIndexActive(item) {
    if (allKanjiIndexActiveEl && allKanjiIndexActiveEl !== item) allKanjiIndexActiveEl.classList.remove('active');
    allKanjiIndexActiveEl = item || null;
    if (allKanjiIndexActiveEl) allKanjiIndexActiveEl.classList.add('active');
  }
  allKanjiIndex.addEventListener('click', (e) => {
    const item = e.target.closest('.allKanjiIndexItem');
    if (item) jumpAllKanjiToInitial(item.dataset.initial);
  });
  allKanjiIndex.addEventListener('touchstart', (e) => {
    const item = allKanjiIndexItemAt(e.touches[0].clientX, e.touches[0].clientY);
    if (item) { jumpAllKanjiToInitial(item.dataset.initial); setAllKanjiIndexActive(item); }
  }, { passive: true });
  allKanjiIndex.addEventListener('touchmove', (e) => {
    const item = allKanjiIndexItemAt(e.touches[0].clientX, e.touches[0].clientY);
    if (item && item !== allKanjiIndexActiveEl) { jumpAllKanjiToInitial(item.dataset.initial); setAllKanjiIndexActive(item); }
    e.preventDefault();
  }, { passive: false });
  allKanjiIndex.addEventListener('touchend', () => setAllKanjiIndexActive(null));
  allKanjiIndex.addEventListener('touchcancel', () => setAllKanjiIndexActive(null));

  function updateKanjiToolbarUI(charCount, isGroupedView) {
    groupBtnLabel.textContent = isGroupedView ? '再グループ化' : 'グループ分け';
    groupBtn.disabled = charCount === 0;
    reorderBtn.hidden = !isGroupedView;
    orderHint.textContent = (!isGroupedView && charCount > 0) ? '入力順で表示中' : '';
  }

  // グループ分け：既にまとまっている行（＝同じ音の文字だけの行）はその並びを維持し、
  // 新しく増えた文字（混在した行や新規追加分）だけを対応グループの末尾に足す。
  function performGrouping() {
    const normalized = normalizeToSimplified(input.value);
    const rawLines = normalized.split('\n');
    const seen = new Set();
    const pureGroups = new Map();
    const strayChars = [];

    rawLines.forEach((line) => {
      const chars = [];
      for (const ch of line) {
        if (!HANZI_RE.test(ch) || seen.has(ch)) continue;
        seen.add(ch);
        chars.push(ch);
      }
      if (!chars.length) return;
      const keys = new Set(chars.map(getBasePinyin));
      if (keys.size === 1) {
        const key = getBasePinyin(chars[0]);
        const arr = pureGroups.get(key) || [];
        pureGroups.set(key, arr.concat(chars));
      } else {
        strayChars.push.apply(strayChars, chars);
      }
    });

    strayChars.forEach((ch) => {
      const key = getBasePinyin(ch) || ch;
      const arr = pureGroups.get(key) || [];
      arr.push(ch);
      pureGroups.set(key, arr);
    });

    if (!pureGroups.size) return;

    const orderedKeys = Array.from(pureGroups.keys()).sort(compareGroupKeys);
    const outLines = orderedKeys.map((k) => pureGroups.get(k).join(''));
    commitInputValue(outLines.join('\n'));
    state.groupedView = true;
    renderCurrentMode();
  }

  groupBtn.addEventListener('click', performGrouping);

  reorderBtn.addEventListener('click', () => {
    closeWordSheet();
    state.reordering = true;
    document.body.classList.add('reordering');
    renderKanjiMode();
  });

  function collectTextFromDom() {
    const lines = [];
    kanjiGrid.querySelectorAll('.kgroup').forEach((groupEl) => {
      const row = groupEl.querySelector('.kgroupRow');
      if (!row) return;
      const chars = Array.prototype.map
        .call(row.querySelectorAll('.kcard'), (c) => c.dataset.char)
        .join('');
      if (chars) lines.push(chars);
    });
    return lines.join('\n');
  }

  doneBtn.addEventListener('click', () => {
    const newText = collectTextFromDom();
    commitInputValue(newText);
    state.reordering = false;
    document.body.classList.remove('reordering');
    renderCurrentMode();
  });

  // カードのドラッグ並び替え（マウス／タッチ共通、グループ内のみ）
  function attachDragHandlers() {
    kanjiGrid.querySelectorAll('.kgroupRow').forEach((row) => {
      Array.prototype.forEach.call(row.querySelectorAll('.kcard'), (card) => attachCardDrag(card, row));
    });
  }

  function attachCardDrag(card, row) {
    card.addEventListener('pointerdown', (e) => {
      if (!state.reordering) return;
      e.preventDefault();
      const rect = card.getBoundingClientRect();
      const offsetX = e.clientX - rect.left;
      const offsetY = e.clientY - rect.top;
      try { card.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
      card.classList.add('dragging');
      card.style.width = rect.width + 'px';
      card.style.left = rect.left + 'px';
      card.style.top = rect.top + 'px';

      const placeholder = document.createElement('div');
      placeholder.className = 'kcardPlaceholder';
      placeholder.style.width = rect.width + 'px';
      placeholder.style.height = rect.height + 'px';
      row.insertBefore(placeholder, card.nextSibling);

      function onMove(ev) {
        card.style.left = (ev.clientX - offsetX) + 'px';
        card.style.top = (ev.clientY - offsetY) + 'px';
        const dragRect = card.getBoundingClientRect();
        const dcx = dragRect.left + dragRect.width / 2;
        const dcy = dragRect.top + dragRect.height / 2;
        let closest = null;
        let closestDist = Infinity;
        Array.prototype.forEach.call(row.querySelectorAll('.kcard:not(.dragging)'), (sib) => {
          const r = sib.getBoundingClientRect();
          const dist = Math.hypot(dcx - (r.left + r.width / 2), dcy - (r.top + r.height / 2));
          if (dist < closestDist) { closestDist = dist; closest = sib; }
        });
        if (closest) {
          const r = closest.getBoundingClientRect();
          const before = dcx < r.left + r.width / 2;
          row.insertBefore(placeholder, before ? closest : closest.nextSibling);
        }
      }
      function onUp(ev) {
        row.insertBefore(card, placeholder);
        placeholder.remove();
        card.classList.remove('dragging');
        card.style.position = '';
        card.style.left = '';
        card.style.top = '';
        card.style.width = '';
        try { card.releasePointerCapture(ev.pointerId); } catch (err) { /* noop */ }
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
      }
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    });
  }

  // ================= モード切替 / 声調トグル =================
  function updateModeTabsUI() {
    tabBtns.forEach((btn) => btn.classList.toggle('active', btn.dataset.mode === state.mode));
  }

  tabBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      const mode = btn.dataset.mode;
      if (mode === state.mode) return;
      state.mode = mode;
      updateModeTabsUI();
      renderCurrentMode();
    });
  });

  // 単語帳を開いている間に声調表示の設定を切り替えたら、単語帳側も即座に反映する
  function refreshWordbookIfOpen() {
    if (!wordbookScreen.hidden) renderWordGrid();
  }
  // 全漢字ページを開いている間も同様に即座に反映する
  function refreshAllKanjiIfOpen() {
    if (!allKanjiScreen.hidden) renderAllKanjiGrid();
  }

  function setToggleActive(btn, on) {
    btn.classList.toggle('active', on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  // 下段フッターのボタンの点灯状態を今のstateに合わせる。
  // ピンインなしモード中は123の設定（toneType）は覚えたまま、ボタンだけ消灯する
  function updateToolFooterUI() {
    setToggleActive(toneToggle, state.toneType === 'num' && !state.pinyinOff);
    setToggleActive(contourToggle, state.contourOn);
    setToggleActive(pinyinOffToggle, state.pinyinOff);
    setToggleActive(jaKanjiToggle, state.jaKanjiOn);
  }
  // 表示設定を変えたあと、開いている画面・単語シートをすべて描き直す
  function applyDisplaySettingChange(fn) {
    const reopenChar = wordSheet.classList.contains('open') ? activeWordChar : null;
    const reopenBase = activeWordBase;
    fn();
    updateToolFooterUI();
    renderCurrentMode(!!reopenChar);
    refreshWordbookIfOpen();
    refreshAllKanjiIfOpen();
    reopenWordSheetIfNeeded(reopenChar, reopenBase);
  }

  toneToggle.addEventListener('click', () => applyDisplaySettingChange(() => {
    if (state.contourOn || state.pinyinOff) {
      // 記号モード／ピンインなしモード中に押した場合は、そのモードを抜けて数字モードへ切り替える
      state.contourOn = false;
      state.pinyinOff = false;
      state.toneType = 'num';
    } else {
      state.toneType = state.toneType === 'symbol' ? 'num' : 'symbol';
    }
  }));

  contourToggle.addEventListener('click', () => applyDisplaySettingChange(() => {
    state.pinyinOff = false;
    state.contourOn = !state.contourOn;
  }));

  pinyinOffToggle.addEventListener('click', () => applyDisplaySettingChange(() => {
    state.pinyinOff = !state.pinyinOff;
    if (state.pinyinOff) state.contourOn = false;
  }));

  jaKanjiToggle.addEventListener('click', () => applyDisplaySettingChange(() => {
    state.jaKanjiOn = !state.jaKanjiOn;
  }));

  // 入力欄を畳む(true)／開く(false)
  function setFocusMode(on) {
    state.focusMode = on;
    document.body.classList.toggle('focusMode', on);
    focusToggle.classList.toggle('active', on);
    focusToggle.setAttribute('aria-pressed', on ? 'true' : 'false');
    focusToggle.title = on ? '入力欄を表示' : '入力欄を畳んで広く表示';
  }
  focusToggle.addEventListener('click', () => setFocusMode(!state.focusMode));

  // ================= 描画の切替 =================
  // keepWordSheet=trueのときは単語シートを閉じない（声調123／声調カーブ／日本字体の
  // 表示切り替えボタン用。呼び出し側でシートの中身を後から作り直す）
  function renderCurrentMode(keepWordSheet) {
    if (!keepWordSheet) closeWordSheet();
    const trimmed = input.value ? input.value.trim() : '';
    updateSurume(trimmed !== '');
    clearBtn.classList.toggle('show', input.value.length > 0);
    updateSaveBtnDirtyState();

    if (state.mode === 'sentence') {
      results.hidden = false;
      kanjiGrid.hidden = true;
      kanjiToolbar.hidden = true;
      renderSentence();
    } else {
      results.hidden = true;
      kanjiGrid.hidden = false;
      kanjiToolbar.hidden = false;
      renderKanjiMode();
    }
  }

  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, window.innerHeight * 0.22) + 'px';
  }

  input.addEventListener('input', () => {
    if (!typingTimer) burstStartValue = lastCommittedValue;
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => {
      typingTimer = null;
      if (input.value !== burstStartValue) {
        pushUndo(burstStartValue);
        lastCommittedValue = input.value;
      }
    }, 800);
    autoGrow();
    state.groupedView = false;
    renderCurrentMode();
  });

  clearBtn.addEventListener('click', () => {
    commitInputValue('');
    input.focus();
    renderCurrentMode();
  });

  // ================= 保存（localStorage） =================
  const STORAGE_KEY = 'pinyinHelperSavedFiles_v1';
  function loadSavedFiles() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function persistSavedFiles() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(savedFiles)); } catch (e) { /* noop */ }
  }
  let savedFiles = loadSavedFiles();

  // タイトルは手動入力の1種類だけ（空欄で保存したときだけ冒頭の文字から自動でつける）。
  // 「自動タイトル＋手動サブタイトル」だった時期の保存データは、サブタイトルが入力されていれば
  // それをタイトルにし、空ならその時点の自動タイトルをそのまま残して、subtitleの項目を消す。
  // subtitleが無いデータ（それ以前の、タイトルが手入力だった時期のものも含む）はtitleをそのまま使う。
  function migrateFileTitle(f) {
    let changed = false;
    if ('subtitle' in f) {
      const sub = typeof f.subtitle === 'string' ? f.subtitle.trim() : '';
      if (sub) f.title = sub;
      delete f.subtitle;
      changed = true;
    }
    if (!f.title || !String(f.title).trim()) {
      f.title = computeAutoTitle(f.mode, f.text || '');
      changed = true;
    }
    return changed;
  }
  (function migrateTitlesToSingleTitle() {
    let changed = false;
    savedFiles.forEach((f) => { if (migrateFileTitle(f)) changed = true; });
    if (changed) persistSavedFiles();
  })();

  // 一覧の並び順を「更新日時順」から「手動（配列順）」へ一度だけ移行する。
  // 既存ユーザーには、今まで見えていた並び（新しい順）をそのまま初期の手動順として渡す。
  const ORDER_INIT_KEY = 'pinyinHelperOrderInit_v1';
  try {
    if (!localStorage.getItem(ORDER_INIT_KEY)) {
      savedFiles.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      persistSavedFiles();
      localStorage.setItem(ORDER_INIT_KEY, '1');
    }
  } catch (e) { /* noop */ }

  // ---------- フォルダ（1階層） ----------
  const FOLDER_KEY = 'pinyinHelperFolders_v1';
  function loadFolders() {
    try {
      const raw = localStorage.getItem(FOLDER_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function persistFolders() {
    try { localStorage.setItem(FOLDER_KEY, JSON.stringify(folders)); } catch (e) { /* noop */ }
  }
  let folders = loadFolders();

  // ---------- 単語帳（単漢字モードのタップで関連語を出すための登録単語） ----------
  const WORDS_KEY = 'pinyinHelperWords_v1';
  function loadWords() {
    try {
      const raw = localStorage.getItem(WORDS_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function persistWords() {
    wordsByCharIndex = null;
    try { localStorage.setItem(WORDS_KEY, JSON.stringify(savedWords)); } catch (e) { /* noop */ }
  }
  let savedWords = loadWords(); // 新しく登録した単語が先頭

  // 簡体字化して先頭4文字（漢字のみ）に丸め、既に登録済みなら何もしない（重複自動排除）
  // ここに含まれる漢字は、全漢字ページ未登録のものだけ自動で登録する（通知なし）
  function addWord(raw) {
    const simplified = normalizeToSimplified(raw || '');
    const chars = Array.from(simplified).filter((ch) => HANZI_RE.test(ch)).slice(0, 4);
    const word = chars.join('');
    if (!word || savedWords.indexOf(word) >= 0) return false;
    savedWords.unshift(word);
    persistWords();
    addAllKanji(word);
    return true;
  }
  function deleteWords(words) {
    const del = new Set(words);
    savedWords = savedWords.filter((w) => !del.has(w));
    persistWords();
    let personChanged = false;
    del.forEach((w) => { if (personWords.delete(w)) personChanged = true; });
    if (personChanged) persistPersonWords();
  }

  // ---------- 人名登録（単語帳の単語のうち、人名として登録したものの集合） ----------
  const PERSON_WORDS_KEY = 'pinyinHelperPersonWords_v1';
  function loadPersonWords() {
    try {
      const raw = localStorage.getItem(PERSON_WORDS_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return new Set(Array.isArray(arr) ? arr : []);
    } catch (e) { return new Set(); }
  }
  function persistPersonWords() {
    try { localStorage.setItem(PERSON_WORDS_KEY, JSON.stringify(Array.from(personWords))); } catch (e) { /* noop */ }
  }
  let personWords = loadPersonWords();
  // isPerson=trueで人名登録、falseで解除。1件でも変化があればtrueを返す
  function setWordsPersonStatus(words, isPerson) {
    let changed = false;
    words.forEach((w) => {
      if (isPerson) { if (!personWords.has(w)) { personWords.add(w); changed = true; } }
      else if (personWords.delete(w)) { changed = true; }
    });
    if (changed) persistPersonWords();
    return changed;
  }

  // ---------- 全漢字（単語帳とは別に、登録した漢字を常にピンインごとにグループ表示するページ） ----------
  const ALL_KANJI_KEY = 'pinyinHelperAllKanji_v1';
  function loadAllKanji() {
    try {
      const raw = localStorage.getItem(ALL_KANJI_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function persistAllKanji() {
    try { localStorage.setItem(ALL_KANJI_KEY, JSON.stringify(allKanji)); } catch (e) { /* noop */ }
  }
  let allKanji = loadAllKanji(); // 登録順（古い順）

  // 入力された文字列から漢字だけを取り出し、まだ登録していないものだけ末尾に追加する（重複は自動で無視）
  function addAllKanji(raw) {
    const simplified = normalizeToSimplified(raw || '');
    const seen = new Set(allKanji);
    let added = false;
    for (const ch of simplified) {
      if (!HANZI_RE.test(ch) || seen.has(ch)) continue;
      seen.add(ch);
      allKanji.push(ch);
      added = true;
    }
    if (added) persistAllKanji();
    return added;
  }

  // ---------- バックアップの書き出し／読み込み ----------
  // ホーム画面アプリはブラウザ側の事情でデータ領域が消えることがあるため、
  // 手元にJSONファイルとして退避・復元できるようにする。
  function exportBackup() {
    const payload = {
      app: 'pinyin-helper',
      version: 2,
      exportedAt: Date.now(),
      savedFiles: savedFiles,
      folders: folders,
      words: savedWords,
      personWords: Array.from(personWords),
      allKanji: allKanji,
    };
    const json = JSON.stringify(payload, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const pad = (n) => String(n).padStart(2, '0');
    const d = new Date();
    const stamp = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes());

    const a = document.createElement('a');
    a.href = url;
    a.download = 'pinyin-helper-backup-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  // 既存データは残したまま、まだ無いファイル・フォルダ・単語・人名登録・全漢字だけを追加する（上書きしない）。
  // version 1 のバックアップには personWords / allKanji が無いので、その場合は単語に含まれる漢字だけ全漢字に足す。
  // 戻り値は種類ごとの追加件数
  function mergeImportedBackup(data) {
    const importedFolders = Array.isArray(data.folders) ? data.folders : [];
    const importedFiles = Array.isArray(data.savedFiles) ? data.savedFiles : [];
    const importedWords = Array.isArray(data.words) ? data.words : [];
    const importedPersonWords = Array.isArray(data.personWords) ? data.personWords : [];
    const importedAllKanji = Array.isArray(data.allKanji) ? data.allKanji : [];
    const counts = { files: 0, words: 0, personWords: 0, kanji: 0 };

    const existingFolderIds = new Set(folders.map((f) => f.id));
    importedFolders.forEach((f) => {
      if (f && f.id && !existingFolderIds.has(f.id)) {
        folders.push(f);
        existingFolderIds.add(f.id);
      }
    });

    const existingFileIds = new Set(savedFiles.map((f) => f.id));
    importedFiles.forEach((f) => {
      if (f && f.id && !existingFileIds.has(f.id)) {
        migrateFileTitle(f);
        savedFiles.push(f);
        existingFileIds.add(f.id);
        counts.files += 1;
      }
    });

    const existingWords = new Set(savedWords);
    importedWords.forEach((w) => {
      if (typeof w === 'string' && w && !existingWords.has(w)) {
        savedWords.push(w);
        existingWords.add(w);
        counts.words += 1;
      }
    });

    // 人名登録は単語帳に存在する単語の分だけ取り込む
    importedPersonWords.forEach((w) => {
      if (typeof w === 'string' && existingWords.has(w) && !personWords.has(w)) {
        personWords.add(w);
        counts.personWords += 1;
      }
    });

    // 全漢字はバックアップ内の登録順を保ったまま末尾に足し、続けて単語に含まれる漢字も足す
    // （アプリ内で単語を登録したときと同じく、単語の漢字は全漢字にも入っている状態にそろえる）
    const kanjiBefore = allKanji.length;
    addAllKanji(importedAllKanji.filter((ch) => typeof ch === 'string').join(''));
    addAllKanji(importedWords.filter((w) => typeof w === 'string').join(''));
    counts.kanji = allKanji.length - kanjiBefore;

    persistFolders();
    persistSavedFiles();
    persistWords();
    persistPersonWords();
    return counts;
  }

  exportBtn.addEventListener('click', exportBackup);
  importBtn.addEventListener('click', () => importFileInput.click());
  importFileInput.addEventListener('change', () => {

        return;
      }
      if (!data || (data.app !== 'pinyin-helper' &&
          !['savedFiles', 'folders', 'words', 'personWords', 'allKanji'].some((k) => Array.isArray(data[k])))) {
        alert('このファイルはバックアップ形式ではないようです');

      renderListRows();

      if (c.kanji) parts.push('漢字' + c.kanji + '字');
      alert(parts.length
        ? parts.join('、') + 'を読み込みました（既存のデータはそのまま残っています）'
        : '新しく追加されたデータはありませんでした（すでに読み込み済みの可能性があります）');
    };
    reader.readAsText(file);

  // 保存一覧の表示状態：query は検索文字列。フォルダはアコーディオンなので展開中のIDをSetで持つ
  const listView = { query: '' };

  function folderName(id) {

  function fileCountInFolder(id) {

  // タイトル or 中の漢字で検索（「你好」なら 你 と 好 を両方含むファイルを拾う）
  function fileMatchesQuery(file, q) {
    const query = q.trim();
    if (!query) return true;
    if ((file.title || '').toLowerCase().indexOf(query.toLowerCase()) >= 0) return true;
    const text = normalizeToSimplified(file.text || '');
    if (text.indexOf(query) >= 0) return true;
    const hanziChars = [];
    for (const ch of query) {
      if (HANZI_RE.test(ch)) hanziChars.push(normalizeToSimplified(ch));
    }
    return hanziChars.length > 0 && hanziChars.every((ch) => text.indexOf(ch) >= 0);
  }

  // ---------- アイコン ----------

  // 開いているファイルのタイトルをヘッダーに表示（未保存の新規ファイルは空）
  function setTitleDisplay(title) {
    fileTitle.textContent = title || '';
  }

  // 保存時にタイトルが空欄だったときに使う自動タイトル
  // 文章モード：先頭の文字を適度な文字数だけ抽出
  function defaultTitleFromText(text) {
    const flat = text.replace(/\s+/g, '').trim();
    if (!flat) return '無題';
    return flat.length > 14 ? flat.slice(0, 14) + '…' : flat;
  }

  // 単漢字モードの自動タイトル：グループ（行）ごとの代表ピンインを、同じ音は重複させずに半角スペースで連結
  function kanjiAutoTitle(text) {
    const lines = parseKanjiLines(text);
    const seen = new Set();
    const labels = [];
    lines.forEach((chars) => {
      if (!chars.length) return;
      const label = getBasePinyin(chars[0]) || chars[0];
      if (seen.has(label)) return;
      seen.add(label);
      labels.push(label);
    });
    return labels.length ? labels.join(' ') : '無題';
  }

  // モードに応じた自動タイトルを算出する
  function computeAutoTitle(mode, text) {
    return mode === 'kanji' ? kanjiAutoTitle(text) : defaultTitleFromText(text);
  }

  function flashSaved() {
    saveBtn.classList.add('justSaved');
    setTimeout(() => saveBtn.classList.remove('justSaved'), 700);
  }

  // 現在の内容が、最後に保存した状態から変わっているか（未保存の変更があるか）
  function isDirty() {
    if (currentFileId) {
      const f = savedFiles.find((x) => x.id === currentFileId);
      if (!f) return false;
      return f.text !== input.value || f.mode !== state.mode;
    }
    return input.value.trim() !== '';
  }
  function updateSaveBtnDirtyState() {
    saveBtn.classList.toggle('dirty', isDirty());
  }

  function saveExistingFile() {

    const idx = savedFiles.findIndex((f) => f.id === currentFileId);
    if (idx < 0) return;
    savedFiles[idx].text = input.value;

    savedFiles[idx].updatedAt = Date.now();
    persistSavedFiles();
  }

  // まだ一度も保存していない新規ファイルは、確認なしで破棄してよい。
  function autoSaveBeforeLeaving() {
    if (currentFileId && isDirty()) saveExistingFile();
  }

  saveBtn.addEventListener('click', () => {

  });

    if (!modalContext) return;
    const typedTitle = modalTitleInput.value.trim();

    if (modalContext.mode === 'rename') {
      const idx = savedFiles.findIndex((f) => f.id === modalContext.fileId);
      let title = typedTitle;
      if (idx >= 0) {
        // 空欄にしたときは、そのファイルの中身から自動タイトルをつけ直す
        if (!title) title = computeAutoTitle(savedFiles[idx].mode, savedFiles[idx].text || '');
        savedFiles[idx].title = title;
        persistSavedFiles();
      }
      if (modalContext.fileId === currentFileId) setTitleDisplay(title);
      if (listScreen.classList.contains('open')) renderListRows();
    } else {
      if (state.mode === 'kanji') performGrouping(); // 保存時は自動で再グループ化する
      const title = typedTitle || computeAutoTitle(state.mode, input.value);
      const file = {
        id: 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
        title: title,

        updatedAt: Date.now(),

      persistSavedFiles();

  function renderListRows() {
    listRows.innerHTML = '';

    // 検索中：全ファイルを横断してフラット表示
    if (q) {
      const hits = savedFiles.filter((f) => fileMatchesQuery(f, q));
      if (!hits.length) {
        listRows.appendChild(emptyRow('該当する保存はありません'));

      hits.forEach((file) => listRows.appendChild(makeListRow(file, { showFolder: true })));

    // フォルダ一覧（アコーディオン開閉）→ ルート直下のファイル

    newFolderBtn.addEventListener('click', createFolderFlow);

    folders
      .forEach((folder) => {
        listRows.appendChild(makeFolderRow(folder));
        if (!expandedFolders.has(folder.id)) return;
        const body = document.createElement('div');
        body.className = 'folderBody';
        const inFolder = savedFiles.filter((f) => (f.folderId || null) === folder.id);
        if (!inFolder.length) {
          body.appendChild(emptyRow('このフォルダは空です'));
        } else {
          inFolder.forEach((file) => body.appendChild(makeListRow(file, {})));
        }
        listRows.appendChild(body);
      });

    const rootFiles = savedFiles
      .filter((f) => !f.folderId || !folders.some((d) => d.id === f.folderId));

    if (folders.length && rootFiles.length) {
      const div = document.createElement('div');
      div.className = 'listSectionDivider';
      listRows.appendChild(div);
    }
    if (!folders.length && !rootFiles.length) {
      listRows.appendChild(emptyRow('保存された内容はまだありません'));
      return;
    }
    rootFiles.forEach((file) => listRows.appendChild(makeListRow(file, {})));
  }

  // 保存済みファイルを複製する。複製は元ファイルのすぐ後ろに挿入する
  function duplicateFile(file) {
    const copy = Object.assign({}, file, {
      id: 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      updatedAt: Date.now(),
    });
    const idx = savedFiles.findIndex((f) => f.id === file.id);
    savedFiles.splice(idx + 1, 0, copy);
    persistSavedFiles();
    renderListRows();
  }

    dup.type = 'button';

    dup.innerHTML = COPY_SVG + '<span>複製</span>';
    dup.addEventListener('click', (e) => {
      e.stopPropagation();

    });

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'rowActionBtn actDelete';
    del.innerHTML = TRASH_SVG + '<span>削除</span>';

      e.stopPropagation();

    actions.appendChild(dup);
    actions.appendChild(del);

    const row = document.createElement('div');
    row.className = 'listRow' + (file.id === currentFileId ? ' current' : '');
    row.dataset.fileId = file.id;

    const titleWrap = document.createElement('span');
    titleWrap.className = 'listTitleWrap';

    const title = document.createElement('span');
    title.className = 'listTitle';
    title.textContent = file.title;
    titleWrap.appendChild(title);

    const meta = document.createElement('span');
    meta.className = 'listMeta';

    if (opts.showFolder && file.folderId && folderName(file.folderId)) {
      const chip = document.createElement('span');
      chip.className = 'listFolderChip';

    editBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
    editBtn.addEventListener('click', (e) => {

    attachFileRowGestures(wrap, row, () => { loadFile(file); closeWordbookScreen(); closeAllKanjiScreen(); closeListScreen(); }, !opts.showFolder);

  function makeFolderRow(folder) {
    const wrap = document.createElement('div');
    wrap.className = 'listRowWrap';

    const actions = document.createElement('div');
    actions.className = 'listRowActions';

    const renameB = document.createElement('button');
    renameB.type = 'button';
    renameB.className = 'rowActionBtn actMove';
    renameB.innerHTML = PENCIL_SVG + '<span>名前</span>';
    renameB.addEventListener('click', (e) => {
      e.stopPropagation();
      renameFolderFlow(folder);
    });

    const delB = document.createElement('button');
    delB.type = 'button';
    delB.className = 'rowActionBtn actDelete';
    delB.innerHTML = TRASH_SVG + '<span>削除</span>';
    delB.addEventListener('click', (e) => {
      e.stopPropagation();
      const n = fileCountInFolder(folder.id);
      const msg = n
        ? 'フォルダ「' + folder.name + '」を削除します。\n中の' + n + '件も一緒に削除されます。'
        : 'フォルダ「' + folder.name + '」を削除しますか？';
      if (!window.confirm(msg)) return;
      savedFiles = savedFiles.filter((f) => f.folderId !== folder.id);
      folders = folders.filter((x) => x.id !== folder.id);
      expandedFolders.delete(folder.id);
      persistFolders();
      persistSavedFiles();
      renderListRows();
    });
    actions.appendChild(renameB);
    actions.appendChild(delB);

    if (expandedFolders.has(folder.id)) wrap.classList.add('expanded');

    const row = document.createElement('div');
    row.className = 'listRow folderRow';
    row.dataset.folderId = folder.id;

    const name = document.createElement('span');
    name.className = 'listTitle';
    name.innerHTML = FOLDER_SVG + '<span>' + escapeHtml(folder.name) + '</span>';

    const meta = document.createElement('span');
    meta.className = 'listMeta';
    const count = document.createElement('span');
    count.className = 'folderCount';
    count.textContent = String(fileCountInFolder(folder.id));
    const chev = document.createElement('span');
    chev.className = 'folderChevron';
    chev.innerHTML = CHEVRON_SVG;
    meta.appendChild(count);
    meta.appendChild(chev);

    row.appendChild(name);
    row.appendChild(meta);

    wrap.appendChild(actions);
    wrap.appendChild(row);
    attachFileRowGestures(wrap, row, () => {
      if (expandedFolders.has(folder.id)) expandedFolders.delete(folder.id);
      else expandedFolders.add(folder.id);
      renderListRows();
    }, true, {
      actionW: 128,
      attr: 'folderId',
      commit: commitFolderOrderFromDom,
      // 展開中に並び替えを始めたら、中身(.folderBody)を置き去りにしないよう先に畳む
      onDragStart: () => {
        if (!expandedFolders.has(folder.id)) return;
        expandedFolders.delete(folder.id);
        wrap.classList.remove('expanded');
        const body = wrap.nextSibling;
        if (body && body.classList && body.classList.contains('folderBody')) body.remove();
      },
    });
    return wrap;
  }

  // 行のジェスチャ：タップで開く／左スワイプでアクション表示／長押しで並び替え
  // ファイル行・フォルダ行の両方で使う共通実装。opts.attrで対象行の判別用データ属性
  // （'fileId'→data-file-id、'folderId'→data-folder-id）を切り替え、その種類の行同士でだけ
  // 並び替えが完結するようにする（opts省略時はファイル行向けの既定値で動く）。
  function attachFileRowGestures(wrap, row, onOpen, enableReorder, opts) {
    const ACTION_W = (opts && opts.actionW) || 192; // 移動・複製・削除の3ボタン分（64px × 3）
    const HOLD_MS = 380;
    const MOVE_CANCEL = 10;
    const itemAttr = (opts && opts.attr) || 'fileId';
    const itemSelector = '.listRow[data-' + itemAttr.replace(/[A-Z]/g, (m) => '-' + m.toLowerCase()) + ']';
    const commitOrder = (opts && opts.commit) || commitOrderFromDom;

    let startX = 0, startY = 0, grabX = 0, grabY = 0, lastY = 0;
    let pointerId = null;
    let holdTimer = null, armTimer = null;
    let mode = null; // null | 'swipe' | 'scroll' | 'drag'
    let currentX = 0;
    let placeholder = null;
    let offX = 0, offY = 0;
    let autoDir = 0, rafId = 0;
    let dragScope = null;

    function preventTouch(e) { e.preventDefault(); }
    function clearTimers() {
      clearTimeout(holdTimer); holdTimer = null;
      clearTimeout(armTimer); armTimer = null;
      wrap.classList.remove('armed');
    }

    row.addEventListener('pointerdown', (e) => {
      if (mode || pointerId !== null || !e.isPrimary) return;
      pointerId = e.pointerId;
      startX = grabX = e.clientX;
      startY = grabY = lastY = e.clientY;
      currentX = 0;
      mode = null;
      if (enableReorder) {
        armTimer = setTimeout(() => { if (mode === null) wrap.classList.add('armed'); }, Math.max(0, HOLD_MS - 130));
        holdTimer = setTimeout(startDrag, HOLD_MS);
      }
    });

    row.addEventListener('pointermove', (e) => {
      if (pointerId === null) return;
      grabX = e.clientX; grabY = lastY = e.clientY;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      if (mode === null) {
        if (Math.abs(dx) + Math.abs(dy) > MOVE_CANCEL) {
          clearTimers();
          mode = Math.abs(dx) > Math.abs(dy) ? 'swipe' : 'scroll';
          if (mode === 'swipe') {
            row.style.transition = 'none';
            try { row.setPointerCapture(pointerId); } catch (err) { /* noop */ }
          }
        }
      }

      if (mode === 'swipe') {
        currentX = Math.min(0, Math.max(-ACTION_W, dx));
        row.style.transform = 'translateX(' + currentX + 'px)';
      } else if (mode === 'drag') {
        e.preventDefault();
        wrap.style.left = (e.clientX - offX) + 'px';
        wrap.style.top = (e.clientY - offY) + 'px';
        updatePlaceholder(e.clientY);
        edgeAutoScroll(e.clientY);
      }
    });

    function endPointer(isUp) {
      if (pointerId === null) return;
      const pid = pointerId;
      const wasMode = mode;
      pointerId = null;
      clearTimers();

      if (wasMode === 'drag') { finishDrag(pid); mode = null; return; }
      try { row.releasePointerCapture(pid); } catch (err) { /* noop */ }

      if (wasMode === 'swipe') {
        row.style.transition = '';
        const open = currentX < -(ACTION_W / 3);
        row.style.transform = open ? 'translateX(-' + ACTION_W + 'px)' : '';
        row.classList.toggle('swiped', open);
        mode = null;
        return;
      }

      mode = null;
      if (wasMode === 'scroll' || !isUp) return;

      if (row.classList.contains('swiped')) {
        row.classList.remove('swiped');
        row.style.transform = '';
        return;
      }
      onOpen();
    }
    row.addEventListener('pointerup', () => endPointer(true));
    row.addEventListener('pointercancel', () => endPointer(false));
    row.addEventListener('contextmenu', (e) => { if (mode === 'drag' || wrap.classList.contains('armed')) e.preventDefault(); });

    function startDrag() {
      if (mode !== null || pointerId === null) return;
      mode = 'drag';
      wrap.classList.remove('armed');
      row.classList.remove('swiped');
      row.style.transition = '';
      row.style.transform = '';
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch (err) { /* noop */ } }
      // フォルダ行の場合、展開中の中身（.folderBody）を置き去りにしないよう
      // 並び替え開始時に呼び出し側で先に畳んでもらう
      if (opts && opts.onDragStart) opts.onDragStart();

      // 並び替えは今いる枠（ルート直下 or 展開中のフォルダの中）の中だけで完結させる
      dragScope = wrap.parentNode;

      const r = wrap.getBoundingClientRect();
      offX = grabX - r.left;
      offY = grabY - r.top;

      placeholder = document.createElement('div');
      placeholder.className = 'listRowPlaceholder';
      placeholder.style.height = r.height + 'px';
      wrap.parentNode.insertBefore(placeholder, wrap.nextSibling);

      wrap.style.width = r.width + 'px';
      wrap.style.left = r.left + 'px';
      wrap.style.top = r.top + 'px';
      wrap.classList.add('rowDragging');
      listRows.classList.add('isDragging');

      try { row.setPointerCapture(pointerId); } catch (err) { /* noop */ }
      document.addEventListener('touchmove', preventTouch, { passive: false });
    }

    function fileWraps() {
      return Array.prototype.filter.call(
        dragScope.querySelectorAll('.listRowWrap'),
        (w) => w !== wrap && w.querySelector(itemSelector)
      );
    }
    function updatePlaceholder(y) {
      if (!placeholder) return;
      const others = fileWraps();
      if (!others.length) { dragScope.appendChild(placeholder); return; }
      let target = null;
      for (let i = 0; i < others.length; i++) {
        const rr = others[i].getBoundingClientRect();
        if (y < rr.top + rr.height / 2) { target = others[i]; break; }
      }
      if (target) dragScope.insertBefore(placeholder, target);
      else dragScope.insertBefore(placeholder, others[others.length - 1].nextSibling);
    }
    function edgeAutoScroll(y) {
      const lr = listRows.getBoundingClientRect();
      autoDir = y < lr.top + 52 ? -1 : (y > lr.bottom - 52 ? 1 : 0);
      if (autoDir && !rafId) rafId = requestAnimationFrame(scrollTick);
    }
    function scrollTick() {
      rafId = 0;
      if (mode !== 'drag' || !autoDir) return;
      listRows.scrollTop += autoDir * 9;
      updatePlaceholder(lastY);
      rafId = requestAnimationFrame(scrollTick);
    }
    function finishDrag(pid) {
      document.removeEventListener('touchmove', preventTouch, { passive: false });
      autoDir = 0;
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      if (placeholder && placeholder.parentNode) {
        dragScope.insertBefore(wrap, placeholder);
        placeholder.remove();
      }
      placeholder = null;
      wrap.classList.remove('rowDragging');
      wrap.style.width = wrap.style.left = wrap.style.top = '';
      listRows.classList.remove('isDragging');
      try { row.releasePointerCapture(pid); } catch (err) { /* noop */ }
      commitOrder(dragScope);
      dragScope = null;
    }
  }

  // DOM 上のファイル行の並びを savedFiles に反映（表示中の行だけを、その枠内で入れ替える）
  function commitOrderFromDom(container) {
    const scope = container || listRows;
    const shownIds = Array.prototype.map.call(
      scope.querySelectorAll('.listRow[data-file-id]'),
      (r) => r.dataset.fileId
    );
    if (!shownIds.length) return;
    const shown = new Set(shownIds);
    const byId = new Map(savedFiles.map((f) => [f.id, f]));
    const queue = shownIds.map((id) => byId.get(id)).filter(Boolean);
    let qi = 0;
    savedFiles = savedFiles.map((f) => (shown.has(f.id) ? queue[qi++] : f));
    persistSavedFiles();
  }

  // DOM 上のフォルダ行の並びを folders に反映（commitOrderFromDomのフォルダ版）
  function commitFolderOrderFromDom(container) {
    const scope = container || listRows;
    const shownIds = Array.prototype.map.call(
      scope.querySelectorAll('.listRow[data-folder-id]'),
      (r) => r.dataset.folderId
    );
    if (!shownIds.length) return;
    const shown = new Set(shownIds);
    const byId = new Map(folders.map((f) => [f.id, f]));
    const queue = shownIds.map((id) => byId.get(id)).filter(Boolean);
    let qi = 0;
    folders = folders.map((f) => (shown.has(f.id) ? queue[qi++] : f));
    persistFolders();
  }

  // ---------- フォルダ移動ピッカー ----------
  function openFolderPicker(file) {
    folderPickerList.innerHTML = '';

    const mkItem = (label, active, isAction, onClick) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'folderPickItem' + (active ? ' active' : '') + (isAction ? ' action' : '');
      b.innerHTML = (isAction ? FOLDER_PLUS_SVG : FOLDER_SVG) +
        '<span>' + escapeHtml(label) + '</span>' + (active ? CHECK_SVG : '');
      b.addEventListener('click', onClick);
      folderPickerList.appendChild(b);
    };

    mkItem('フォルダなし', !file.folderId, false, () => moveFileToFolder(file, null));
    folders.forEach((f) => mkItem(f.name, file.folderId === f.id, false, () => moveFileToFolder(file, f.id)));
    mkItem('新規フォルダ…', false, true, async () => {
      const nm = await askName('新規フォルダ', '');
      if (!nm) return;
      moveFileToFolder(file, addFolder(nm).id);
    });

    folderPicker.hidden = false;
  }
  function closeFolderPicker() { folderPicker.hidden = true; }
  function moveFileToFolder(file, folderId) {
    file.folderId = folderId;
    persistSavedFiles();
    closeFolderPicker();
    renderListRows();
  }
  folderPickerCancel.addEventListener('click', closeFolderPicker);
  folderPicker.addEventListener('click', (e) => { if (e.target === folderPicker) closeFolderPicker(); });

  // ---------- 名前入力モーダル（フォルダの作成・改名で共用） ----------
  let nameResolve = null;
  function askName(heading, initial) {
    return new Promise((resolve) => {
      nameResolve = resolve;
      nameModalHeading.textContent = heading;
      nameModalInput.value = initial || '';
      nameModal.hidden = false;
      setTimeout(() => { nameModalInput.focus(); nameModalInput.select(); }, 0);
    });
  }
  function finishName(val) {
    if (!nameResolve) return;
    const r = nameResolve;
    nameResolve = null;
    nameModal.hidden = true;
    r(val);
  }
  nameModalCancel.addEventListener('click', () => finishName(null));
  nameModalOk.addEventListener('click', () => finishName(nameModalInput.value.trim() || null));
  nameModalInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); nameModalOk.click(); }
  });
  nameModal.addEventListener('click', (e) => { if (e.target === nameModal) finishName(null); });

  async function createFolderFlow() {
    const nm = await askName('新規フォルダ', '');
    if (!nm) return;
    addFolder(nm);
    renderListRows();
  }
  async function renameFolderFlow(folder) {
    const nm = await askName('フォルダ名を変更', folder.name);
    if (!nm) return;
    folder.name = nm;
    persistFolders();
    updateListChrome();
    renderListRows();
  }

  function loadFile(file) {
    currentFileId = file.id;
    setTitleDisplay(file.title);
    // 保存済みのファイルは読むために開くことが多いので、入力欄は畳んで広く見せる
    setFocusMode(true);
    state.mode = file.mode || 'sentence';
    updateModeTabsUI();
    commitInputValue(file.text || '', { skipUndo: true });
    undoStack = [];
    undoBtn.disabled = true;
    // 保存時は常にグループ分けされているはずなので、読み込み直後はグループ表示にする。
    state.groupedView = parseKanjiLines(file.text || '').length > 0;
    renderCurrentMode();
    // 開いた直後は入力中の状態にせず、常に先頭が見える状態にする
    input.blur();
    results.scrollTop = 0;
    kanjiGrid.scrollTop = 0;
  }

  function startNewFile() {
    currentFileId = null;
    setTitleDisplay('');
    setFocusMode(false);
    commitInputValue('', { skipUndo: true });
    undoStack = [];
    undoBtn.disabled = true;
    state.groupedView = false;
    renderCurrentMode();
  }

  listBtn.addEventListener('click', () => {
    if (isListScreenOpen()) { closeListScreen(); return; }
    autoSaveBeforeLeaving();
    openListScreen();
  });
  listBackdrop.addEventListener('click', closeListScreen);
  listBackBtn.addEventListener('click', () => {
    if (listView.query.trim()) { setQuery(''); return; }
    closeListScreen();
  });

  listNewBtn.addEventListener('click', () => {
    autoSaveBeforeLeaving();
    closeListScreen();
    startNewFile();
